name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: no runtime dependencies
        run: |
          test -z "$(node -p "JSON.stringify(require('./package.json').dependencies || {})" | sed 's/{}//')" \
            || (echo "runtime dependencies are not allowed" && exit 1)
      - run: npm test
