name: ci
on:
  push:
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run preflight:ci
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 18 and 20 are EOL (April 2025 and April 2026). Testing dead runtimes
        # spent CI on false alarms twice — a shell glob and --test-timeout — while
        # 24, the current LTS, was not covered at all.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: no runtime dependencies
        # node, not shell: Windows runners default to PowerShell, and a bash
        # one-liner here failed the job before npm test ever ran.
        run: |
          node -e "const d=require('./package.json').dependencies||{};const k=Object.keys(d);if(k.length){console.error('runtime dependencies are not allowed - '+k.join(', '));process.exit(1)}"
      - run: npm test
