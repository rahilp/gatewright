# TEMPORARY. Delete once the Windows/Node-24 `gw open --watch` abort is fixed.
name: diag-watch
on: workflow_dispatch
jobs:
  diag:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/diag-watch.mjs
