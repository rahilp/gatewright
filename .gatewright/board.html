{"id":"P6-04","title":"Windows liveness and pid-reuse guard","phase":"P6","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"Liveness from the OS process list; reuse guarded by recorded start time rather than /proc/\u003cpid>/cwd. The weaker guarantee is documented, not hidden.","deps":[],"evidence":[{"text":"lib/run/lifecycle.js","stage":null},{"text":"test/run-lifecycle-windows.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:16.510Z","updated":"2026-09-15T04:30:19.973Z"},{"id":"P6-05","title":"Runner tests pass on Windows","phase":"P6","priority":"P1","type":"test","stage":"built","flag":null,"owner":"human:rahil","scope":"overnight, crash-mid-drain and both runaway tests green on windows-latest.","deps":[],"evidence":[{"text":"d6ecba8","stage":null},{"text":"test/runaway.test.js","stage":null},{"text":"test/overnight.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:16.563Z","updated":"2026-09-15T04:30:20.026Z"},{"id":"P6-06","title":"Full suite green on windows-latest","phase":"P6","priority":"P1","type":"test","stage":"built","flag":null,"owner":"human:rahil","scope":"All three platforms green in CI on Node 22 and 24.","deps":[],"evidence":[{"text":"34928803572","stage":null},{"text":"01eb098","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:16.614Z","updated":"2026-09-15T04:30:20.078Z"},{"id":"P6-07","title":"Docs state the platform support honestly","phase":"P6","priority":"P1","type":"doc","stage":"built","flag":null,"owner":"human:rahil","scope":"README names Windows as supported and specs 10.2 records where its guarantees are weaker.","deps":[],"evidence":[{"text":"README.md","stage":null},{"text":"specs.md","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:16.666Z","updated":"2026-09-15T04:30:20.128Z"},{"id":"P6-08","title":"Publish v0.6","phase":"P6","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"Version bump, preflight green, tag, publish.","deps":[],"evidence":[{"text":"gatewright@0.6.0","stage":null},{"text":"sha512 d732037dc0cd951d7957e6e8a53c91f7547351dc","stage":null},{"text":"v0.6.0 3ce0b0b","stage":null}],"notes":"[2026-09-15T09:21:54.767Z] Published to npm and verified end-to-end: installed globally from the registry into a clean project, drove init/add/claim/move/check/open, and confirmed both refusals still hold in the shipped build (missing evidence and stage skipping each exit 1). Verified normalizePath(store.dir) is present in the installed lib/commands/open.js, so the Windows fs.watch fix is actually in the tarball.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:16.713Z","updated":"2026-09-15T09:21:54.767Z"},{"id":"P6-09","title":"check does not validate vocab on existing items","phase":"P6","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"add validates phase/priority/gate/type against config.vocab, but check never re-validates, so a direct file write or a later narrowing of vocab drifts silently. The live board carries P4/P5 items with priority values outside vocab.priority and check reports it clean, which undercuts check's stated job of catching out-of-band writes. Deciding warn-vs-fail matters: making check newly fail would break existing boards mid-version.","deps":[],"evidence":[{"text":"lib/vocab.js","stage":null},{"text":"lib/commands/check.js","stage":null},{"text":"test/check.test.js","stage":null}],"notes":"[2026-09-15T10:38:46.514Z] Found 33 items on this board whose priority exactly equalled their phase (P4->P4, P5->P5) — phase leaking into priority during a bulk add. Corrected to P1 via gw edit rather than widening vocab.priority, which would have made priority mean two things.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:29.626Z","updated":"2026-09-15T10:38:46.514Z"},{"id":"P6-10","title":"gw help \u003ccommand> prints only the global help","phase":"P6","priority":"P3","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw help add and gw add --help both print the top-level command list rather than that command's own flags, so the per-command flag set is only discoverable by reading source. Every command already declares a flag spec that could back real per-command help.","deps":[],"evidence":[{"text":"lib/cli/router.js","stage":null},{"text":"test/help.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T04:28:29.679Z","updated":"2026-09-15T10:39:44.276Z"},{"id":"P6-11","title":"brief reports every built item as in flight","phase":"P6","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"On this repo's own board brief now prints '93 open, 84 in flight' and truncates with '(+73 more)'. built is non-terminal and items keep their owner after leaving building, so everything ever completed is counted in flight. brief is the first command an agent runs and its whole purpose is a \u003c=20-line digest; at 84 in flight it is the wall of context it was built to replace. Two candidate causes: ownership is never released when work leaves building, and the default pipeline cannot progress past built in a trunk-based repo because in_review hard-requires a GitHub PR URL. Ships as the default stages.json, so every trunk-based user hits this.","deps":[],"evidence":[{"text":"lib/stages.js","stage":null},{"text":"test/stages.test.js","stage":null},{"text":"brief on this board: 91 in flight to 3","stage":null}],"notes":"[2026-09-15T10:17:53.919Z] isTerminalStage now honours an explicit role:'done' stage. Deliberately does NOT honour the inferred default (last pipeline stage), which would silently reclassify the final stage of every existing board.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T09:22:41.011Z","updated":"2026-09-15T10:22:22.008Z"},{"id":"P6-12","title":"Default stages assume a PR flow the quickstart does not use","phase":"P6","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Shipped stages.json gates in_review on evidence matching ^https://github.com/.+/pull/\\d+, so a repo that commits to main cannot legitimately advance past built without forcing or forging a PR URL. The README quickstart itself ends at 'gw move P1-01 built' and never mentions a PR, and this repo has 84 items parked at built as a result. Either built should be reachable-terminal for trunk flows, or init should offer a trunk pipeline.","deps":[],"evidence":[{"text":"lib/tui/setup.js","stage":null},{"text":"init offers a trunk pipeline","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T09:22:41.063Z","updated":"2026-09-15T10:22:40.517Z"},{"id":"P7-01","title":"gw config: settings without hand-editing .gatewright/","phase":"P7","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"brief tells every agent 'Never edit .gatewright/ by hand' while the only documented way to enable the runner was to hand-edit config.json. Adds gw config \u003ckey> \u003cvalue> for scripts and agents, gw config --list, and an interactive editor when a real terminal is present. Never blocks automation: no TTY, --yes, GW_NO_INPUT or CI all take the non-interactive path.","deps":[],"evidence":[{"text":"lib/commands/config.js","stage":null},{"text":"lib/settings.js","stage":null},{"text":"test/config.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T09:49:37.208Z","updated":"2026-09-15T09:51:21.016Z"},{"id":"P7-02","title":"Interactive setup walkthrough for gw init","phase":"P7","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"Walk a new user through workflow shape, id scheme and runner setup on init when a terminal is present. Must leave non-interactive init byte-identical for agents and CI.","deps":[],"evidence":[{"text":"lib/tui/setup.js","stage":null},{"text":"test/setup.test.js","stage":null},{"text":"README.md","stage":null}],"notes":"[2026-09-15T10:17:54.020Z] init walkthrough built: workflow shape (trunk vs PR), id scheme, phases, runner opt-in. Runs only with a real terminal; --yes, CI, GW_NO_INPUT and no-TTY all leave init byte-identical.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T09:49:37.259Z","updated":"2026-09-15T10:22:22.109Z"},{"id":"P7-03","title":"gw crashes with EPIPE when its output is piped","phase":"P7","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw list | head, gw brief | less then q, gw check | grep -q all end in an unhandled EPIPE on stdout and print a Node stack trace after ordinary shell usage. Shipped in every version to date.","deps":[],"evidence":[{"text":"bin/gw.js","stage":null},{"text":"gw list | head no longer prints a stack trace","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T09:49:37.311Z","updated":"2026-09-15T09:51:21.071Z"},{"id":"P7-04","title":"gw config cannot edit list-valued settings","phase":"P7","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"SETTINGS covers scalars only, so vocab.phase, vocab.type, runner.providers and stages remain hand-edit-only. Found immediately: adding phase P7 for this very work required editing config.json by hand, which is the contradiction gw config exists to remove. Either cover list values or say plainly in the docs which keys are file-only.","deps":[],"evidence":[{"text":"lib/settings.js","stage":null},{"text":"test/config.test.js","stage":null}],"notes":"[2026-09-15T10:17:53.969Z] gw config gains list-valued settings: vocab.phase, vocab.priority, vocab.gate, vocab.type. Duplicates and empty lists refused.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T09:49:37.365Z","updated":"2026-09-15T10:22:22.060Z"},{"id":"P7-05","title":"Decide whether the specified stage earns its place","phase":"P7","priority":"P2","type":"decision","stage":"built","flag":null,"owner":"human:rahil","scope":"specified is auto:true with no requires, so it gates nothing and is traversed in the same breath as claim and building. Rahil noticed items appear to jump backlog to building. Either give it a rule that means something, or drop it from the default pipeline and stop charging every user a stage that asks nothing of them.","deps":[],"evidence":[{"text":"lib/rules.js","stage":null},{"text":"templates/stages.json","stage":null},{"text":"specs.md","stage":null}],"notes":"[2026-09-15T10:51:28.524Z] Decision: keep the stage, give it the rule it was always claiming. specified now requires a non-empty scope, so 'Specified' means scope is written rather than being a free pass. Applied to the shipped template and specs 4 only; existing boards keep their stages.json untouched, since retroactively adding a gate would make working boards report failures for work already done.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T10:36:31.137Z","updated":"2026-09-15T10:51:28.524Z"},{"id":"P7-06","title":"Card buttons must reflect the item's actual state","phase":"P7","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"The card action is binary: dispatched ? Stop : Play. It ignores terminal stages, so finished work in Built offers Play with nothing to play, and it ignores live runs, so an item whose agent is running right now still shows Play instead of Running with a way to stop it. /api/state already carries runs and stages; the viewer just does not consult them.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"lib/serve/server.js","stage":null},{"text":"test/serve-write.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T10:42:53.830Z","updated":"2026-09-15T10:51:36.064Z"},{"id":"P7-07","title":"Stopping a run from the board freezes the server for stop_timeout_s","phase":"P7","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"lifecycle.end waits the graceful-to-forceful grace period with Atomics.wait, a synchronous block. That is correct for the CLI, which is a standalone process, but the new POST /api/items/\u003cid>/stop runs it inside gw serve's single-threaded request handler: with the default stop_timeout_s of 30 the whole board stops answering for 30 seconds, the scheduler cannot tick, and every other request queues. Needs an async grace path for the serve caller while keeping the CLI's blocking behaviour, which exists precisely so the kill switch does not need an event loop.","deps":[],"evidence":[{"text":"lib/run/lifecycle.js","stage":null},{"text":"lib/serve/server.js","stage":null},{"text":"test/run-lifecycle.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T10:49:33.060Z","updated":"2026-09-15T11:02:04.663Z"},{"id":"P8-01","title":"Gates read as English, not JSON","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"The Stages view prints JSON.stringify(requires), so a human sees {\"evidence_min\":1,\"deps_at_least\":\"built\"} and must know the schema to read it. One shared translator turns a requires object into sentences — 'Needs at least one piece of evidence', 'Dependencies must have reached Built' — used by the stages view, the card, and the refusal message so all three say the same thing.","deps":[],"evidence":[{"text":"lib/gates/describe.js","stage":null},{"text":"test/gate-describe.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.315Z","updated":"2026-09-15T11:19:35.541Z"},{"id":"P8-02","title":"Say why a move is refused, in the same words","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"A blocked transition is a disabled button with a title attribute. A human should see the unmet condition stated plainly next to the item, and what to do about it.","deps":[],"evidence":[{"text":"lib/serve/server.js","stage":null},{"text":"transitions endpoint returns English reasons","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.368Z","updated":"2026-09-15T11:37:48.616Z"},{"id":"P8-03","title":"Move an item by dragging it between columns","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"There is no drag and drop at all; moving means opening the detail panel and finding a transition button. Dragging onto a column that refuses the move must explain the refusal rather than silently snapping back.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified live: drag to Built refused by the browser, drag to Specified persisted a move event","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.417Z","updated":"2026-09-15T11:37:48.669Z"},{"id":"P8-04","title":"Edit an item from the board","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"The write API accepts only move, note, triage and resume. Title, scope, priority, type, gate, phase and deps cannot be changed from the UI at all — a human has to drop to the CLI. Needs edit wired through the same command module the CLI uses, so one write path stays true.","deps":[],"evidence":[{"text":"lib/serve/server.js","stage":null},{"text":"test/serve-write.test.js","stage":null}],"notes":"[2026-09-15T11:34:49.817Z] Correction: the premise was partly wrong. The detail panel already had a field editor (title, scope, priority, type, phase, gate, deps, refs with a save button) posting to the bare /api/items/\u003cid> path, which already routed to the edit command. Verified present in committed HEAD, so it predates this work. What was actually missing and is now fixed: the explicit /api/items/\u003cid>/edit route 404'd, and deps arriving as a JSON array crashed on .split inside edit.js. I reached the wrong conclusion by grepping for 'panel-edit' and '/edit' and not finding them, rather than opening the UI.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.466Z","updated":"2026-09-15T11:34:49.817Z"},{"id":"P8-05","title":"Manage stages from the UI: add, rename, reorder, remove","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"stages.json is never written by the server, so columns cannot be created, renamed, reordered or removed. Needs a write endpoint that runs validateStages before accepting, and refuses to remove a stage that still holds items or is named by another stage's deps_at_least.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified live: added a stage, removal of a stage holding items refused verbatim, pipeline intact","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.525Z","updated":"2026-09-15T16:33:22.005Z"},{"id":"P8-06","title":"Build a gate with a form, not a JSON blob","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"Gates are the product's whole point and are currently editable only by hand-editing stages.json. A human should be able to say 'needs evidence', 'needs an owner', 'dependencies must have reached X', 'evidence must match a pattern' through a form, and see the English read-back before saving.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified live: built a gate with checkboxes and a stage picker; CLI enforced it immediately","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.577Z","updated":"2026-09-15T16:33:22.068Z"},{"id":"P8-07","title":"Configure Gatewright from the UI","phase":"P8","priority":"P2","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"config.json is written by the server only for runner.paused. lib/settings.js already declares every settable key with its type, range and summary, so a Settings view can render generically from it rather than hardcoding a form.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified live: saved runner.max_concurrent=7 through HTTP, persisted with a config event","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.629Z","updated":"2026-09-15T16:33:22.128Z"},{"id":"P8-08","title":"Guardrails for a board that can now rewrite its own rules","phase":"P8","priority":"P0","type":"decision","stage":"dropped","flag":null,"owner":"human:rahil","scope":"The API has no authentication and gw serve --host can expose it to a network. Widening it from moving items to rewriting stages, gates and config raises what a stranger on the LAN could do. Decide and document the posture before the write endpoints ship.","deps":[],"evidence":[{"text":"decision recorded on P8-08","stage":null},{"text":"constrains P8-05, P8-06, P8-07","stage":null}],"notes":"[2026-09-15T11:15:46.876Z] Decision: split the write surface in two. Item-level writes (create, move, edit, note, triage, resume, dispatch, stop) stay available wherever the board is reachable — that is the collaborative surface and the reason --host exists. Administrative writes that change the rules of the board itself (stages, gates, config) are refused unless the request arrived on loopback, regardless of --host. Rationale: a colleague on the LAN moving a card is the feature; a stranger on hotel wifi deleting your stages, disabling a gate, or enabling the runner is not. The guard is cheap, needs no auth system, and keeps the property that gw serve never becomes a remote administration console.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:15:15.681Z","updated":"2026-09-16T09:31:33.128Z"},{"id":"P8-09","title":"A card must say whether an agent is actually working on it","phase":"P8","priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"A card in Building owned by a human shows a Play button, because the button reflects run state while the stage reflects work state — two different axes, conflated. A human cannot tell whether anything is running. Rahil hit this directly: 'Is it actually playing? Is it actually doing the work? I can't tell.' The card should state what is true: no agent run and who owns it, or the run id and how long it has been going. When the scheduler is disabled, Play should read as 'queue for an agent' and look secondary, because pressing it starts nothing.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified in Chrome: cards read 'no agent run · unowned' and 'queued · no agent run yet'","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:20:47.497Z","updated":"2026-09-15T11:38:15.653Z"},{"id":"P8-10","title":"Header open count ignores role:done, so finished work is counted as open","phase":"P8","priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"viewer/board.html line 727 builds its terminal set from State.stages.terminal alone, while the card actions use terminalStageIds() which also honours an explicit role:'done'. Two competing notions of terminal in one file — the second added by P7-06 without retiring the first. On this board the header reads '112 items, 109 open' while gw brief reads '6 open': 103 finished items counted as open. Fix by making terminalStageIds() the single source and using it everywhere, including the Overview view if it has its own copy.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified: board header and gw brief both read 14 open","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:29:45.584Z","updated":"2026-09-15T11:38:15.712Z"},{"id":"P8-11","title":"Gate codes are never explained anywhere in the UI","phase":"P8","priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"G0, G1 and G2 appear as bare codes in the filter bar, the Overview 'BY GATE' chart, the Table column and the item panel. Nothing in the product ever says what a gate IS or what G1 means. Gates are the differentiator and they are the least explained thing on screen. Same for phase codes P0..P8. Either let a board name its gates and show the name, or show a legend, but stop shipping a chart of opaque letters.","deps":[],"evidence":[{"text":"lib/glossary.js","stage":null},{"text":"templates/config.json","stage":null},{"text":"test/glossary.test.js","stage":null}],"notes":"[2026-09-15T11:37:48.513Z] Moved to specified and back during a live drag-and-drop verification; the stage change was a test, not progress.\n[2026-09-15T12:22:47.270Z] Decision: vocab stays a list of plain strings (non-breaking), and an optional config.glossary maps a code to a human description — glossary.gate.G0, glossary.phase.P1, glossary.type.defect. The UI reads it for legends and tooltips; an undescribed code still renders, just without help text.\n[2026-09-15T12:29:09.193Z] Verified end to end: shipped defaults present, custom entries round-trip via gw config glossary.gate.G1, gw show prints a compact meaning block, and a malformed glossary degrades to no descriptions across show, check and config --list rather than throwing.\n[2026-09-15T16:11:31.743Z] Closed on the backend half only. The scope also said the UI should show a legend or tooltips, and the board still renders bare codes. Split rather than silently counted as done: see P8-21.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:37.960Z","updated":"2026-09-15T16:11:31.743Z"},{"id":"P8-12","title":"The Built column buries the board under finished work","phase":"P8","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Built holds 103 of 113 cards, so the board is 91 percent archive and the four columns that matter are squeezed to the left. Finished work should collapse to a count with an expand affordance, or default to hiding anything older than N days. Observed directly: the Dropped column is pushed off the right edge and cannot be read without horizontal scrolling.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified live: Built collapsed at 119 with Show all; all six columns fit, Dropped no longer cut off","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:38.017Z","updated":"2026-09-15T22:05:46.567Z"},{"id":"P8-13","title":"Overview answers 'what is the distribution' when a human asks 'what do I do next'","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"The Overview tab is four bar charts counting items by stage, phase, gate and type. It is a census. gw brief on the same data answers the useful question — what is in flight, what is blocked, what is next unblocked, what is mine — and the board has no equivalent. Make Overview the brief, and move the distributions to a secondary position.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified: Overview is WHAT NEXT; in-flight count matches gw brief exactly","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:38.074Z","updated":"2026-09-15T23:45:48.689Z"},{"id":"P8-14","title":"The Table view is read-only and has no row actions","phase":"P8","priority":"P2","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"The most scannable view in the product cannot change anything. No inline edit, no claim, no move, no multi-select. A human reviewing 113 rows has to open each item's panel one at a time to act on any of them.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified: row move select offers only permitted moves, 'Built (not ready)' disabled without evidence","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:38.132Z","updated":"2026-09-15T23:45:48.751Z"},{"id":"P8-15","title":"Refusal messages tell a human to run CLI commands","phase":"P8","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"The panel explains a blocked move as 'building: needs an owner: run `gw claim P8-05`'. On a board with a mouse, the answer to 'needs an owner' is a Claim button, not an instruction to open a terminal. The rule text comes from lib/rules.js where the CLI phrasing is correct, so the UI needs its own rendering of the same failure rather than echoing the CLI's.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"lib/serve/server.js","stage":null},{"text":"verified live: 'Someone must have claimed it' + a Claim button that recorded a claim event","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:38.187Z","updated":"2026-09-15T22:05:46.680Z"},{"id":"P8-16","title":"Card badges are cryptic and repetitive","phase":"P8","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Every card carries 'ev:0' which no first-time reader can decode, and 'human:rahil' repeated on a hundred cards as though ownership varied. Show evidence count only when it matters to the next gate, and show an owner only when it is not the obvious default.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified: owner noise gone, ev badge only when the next gate is short, tooltip explains it","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:38.243Z","updated":"2026-09-15T23:45:48.811Z"},{"id":"P8-17","title":"The filter bar appears on tabs where it filters nothing","phase":"P8","priority":"P3","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"phase/gate/type/stage/flag/search and '+ new item' render above the Stages & rules and Export tabs, where they control nothing on screen.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified: filter bar display:none on Stages and Settings","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:34:38.292Z","updated":"2026-09-15T23:45:48.878Z"},{"id":"P8-18","title":"A human cannot move a card backwards, including undoing a mis-drag","phase":"P8","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Drop targets are offered only where the move is permitted without --force, and a backward move counts as skipping stages, so dragging a card back to the column it came from is impossible. Found while undoing a test drag: gw move P8-11 backlog was refused with 'use --force to skip stages' and needed --force from a terminal. A board a human manages must support correcting a mistake without dropping to the CLI — offer backward moves explicitly, labelled as such, rather than hiding them.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"lib/serve/server.js","stage":null},{"text":"verified live: backward drag marked drop-back and persisted building->backlog","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T11:38:04.933Z","updated":"2026-09-15T22:05:46.623Z"},{"id":"P8-19","title":"POST /api/config cannot set glossary keys that gw config accepts","phase":"P8","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"The serve config endpoint validates through SETTINGS_BY_KEY only, while gw config also understands glossary.\u003cfield>.\u003ccode> keys handled in lib/commands/config.js. So a Settings UI backed by the endpoint will be unable to edit the glossary the CLI can. Self-reported by the agent that built the endpoint rather than left to be discovered. Close the gap in one direction: either the endpoint learns the same key form, or glossary handling moves into settings.js so both callers share it — the second is better, because a second validation path is how the CLI and the board start disagreeing.","deps":[],"evidence":[{"text":"lib/settings.js","stage":null},{"text":"verified: POST /api/config sets glossary.gate.G0, unknown field refused with the CLI wording","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T12:28:22.879Z","updated":"2026-09-15T21:48:17.645Z"},{"id":"P8-20","title":"specs.md has no section 6 heading","phase":"P8","priority":"P3","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"After the section 5 closing fence the CLI command list runs on with no heading of its own, followed by a stray fence. Pre-existing, found while editing the config block for the glossary. Every other section is numbered and referenced by number elsewhere in the docs, so a missing one makes cross-references ambiguous.","deps":[],"evidence":[{"text":"specs.md","stage":null},{"text":"verified: sections 1-14 sequential, no duplicates, all cross-references resolve","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T12:29:09.135Z","updated":"2026-09-15T21:41:49.739Z"},{"id":"P8-21","title":"Show the glossary in the UI so codes explain themselves","phase":"P8","priority":"P0","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"config.glossary exists and gw show uses it, but the board still renders G0/G1/P1/defect as bare codes in the filter bar, the BY GATE chart, the Table column and the item panel. Show the description as a tooltip on every code, and put a legend where the codes are aggregated.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"test/viewer.test.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T16:11:31.807Z","updated":"2026-09-15T16:33:22.191Z"},{"id":"P8-22","title":"The stage-order refusal tells agents to do what their instructions forbid","phase":"P8","priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"AGENTS.md says 'gw move \u003cid> \u003cstage> when you reach a stage' and 'If gw move refuses, fix the reason; do not use --force'. An agent that claims an item and moves it to building is refused with 'use --force to skip stages' — the only advice offered is the one action the block forbids, and the message never names the stage it should move to first. Compare the evidence refusal, which is exemplary: 'built: needs at least 1 evidence entry: run gw move \u003cid> built --evidence \u003ce>'. Say which stage comes next and offer that command.","deps":[],"evidence":[{"text":"lib/rules.js","stage":null},{"text":"lib/commands/move.js","stage":null},{"text":"verified: 'specified: move here first: run gw move P1-01 specified'","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T16:13:31.439Z","updated":"2026-09-15T21:48:17.422Z"},{"id":"P8-23","title":"A child item does not inherit its parent's phase","phase":"P8","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw add \"...\" --parent P1-02 creates P1-02.1 with phase P0 while its parent is phase P1, because add falls back to vocab.phase[0] when no --phase is given. The id says it belongs to P1-02; the phase says it belongs to a different phase entirely. An agent following the instruction block hits this on its first discovered sub-task.","deps":[],"evidence":[{"text":"lib/commands/add.js","stage":null},{"text":"verified: child of a P3 parent now inherits P3; explicit --phase still wins","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T16:13:31.499Z","updated":"2026-09-15T21:41:49.684Z"},{"id":"P8-24","title":"brief reports a claimed but unmoved item as in flight","phase":"P8","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"An item claimed and still sitting in backlog appears under IN FLIGHT because it has an owner. Ownership is not progress. Found by following the agent instruction block literally: claim succeeded, the move was refused, and brief then reported the item as in flight at backlog.","deps":[],"evidence":[{"text":"lib/brief.js","stage":null},{"text":"verified: claimed-but-unmoved is 0 in flight; a real move counts","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T16:13:31.562Z","updated":"2026-09-15T21:48:17.534Z"},{"id":"P8-25","title":"An agent cannot ask what an item may do next","phase":"P8","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"The board UI has GET /api/items/\u003cid>/transitions, which returns every stage the item could move to and the English reasons it cannot. The CLI has no equivalent, so an agent must already know the pipeline and infer gates from refusals. gw show prints the current stage but never what the next one requires. Agents are the primary user and are worse served here than the browser.","deps":[],"evidence":[{"text":"lib/commands/next.js","stage":null},{"text":"lib/transitions.js","stage":null},{"text":"verified: gw next lists reachable stages and unmet conditions","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T16:13:31.622Z","updated":"2026-09-15T21:48:17.477Z"},{"id":"P8-26","title":"brief prints phase and gate codes with no meaning","phase":"P8","priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"brief lists items as e.g. 'P1 G0'. config.glossary now carries a description for every shipped code and gw show uses it, but brief does not. The digest an agent reads at the start of every session is the place those codes most need explaining.","deps":[],"evidence":[{"text":"lib/brief.js","stage":null},{"text":"verified: single legend line for codes actually shown","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T16:13:31.683Z","updated":"2026-09-15T21:48:17.588Z"},{"id":"P8-27","title":"brief legend is one newline but many visual rows","phase":"P8","priority":"P3","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"The legend renders as a single ~300 character line. brief's cap is counted in newlines, but the cap exists to bound context cost and terminal height, and an unwrapped line costs the same tokens as the four rows it wraps to. Wrap it to the width brief already computes for its columns, and count the wrapped rows against the budget.","deps":[],"evidence":[{"text":"lib/brief.js","stage":null},{"text":"test/brief.test.js","stage":null},{"text":"verified: legend lines 72-75 chars, wrapped on word boundaries, counted against the budget","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T21:48:17.362Z","updated":"2026-09-15T23:32:42.666Z"},{"id":"P8-28","title":"gw next buries the answer it exists to give","phase":"P8","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"For an item in the middle of the pipeline gw next prints 27 lines. It leads with dropped and paused under 'can move to now', then lists backward moves under 'cannot move to yet', and only then the immediate next stage. After that it repeats a near-identical cascade for every remaining stage — verified lists four reasons including two overlapping evidence rules. The one useful line, 'built: Needs at least one piece of evidence', sits in the middle. The command exists so an agent can ask what to do next, and it is loaded into agent context where every line costs. Lead with the immediate next stage and what it needs; put backward and side moves in their own short section; stop enumerating stages more than one hop away, or collapse them to a count.","deps":[],"evidence":[{"text":"lib/commands/next.js","stage":null},{"text":"verified: 30 lines to 7; 'next: built (blocked)' leads, json shape unchanged","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-15T23:30:58.094Z","updated":"2026-09-15T23:38:10.031Z"},{"id":"P2-10","title":"Commit-time enforcement: gw guard + gw hook","phase":"P2","priority":null,"type":"feature","stage":"built","flag":"needs-triage","owner":"agent:claude","scope":"Nothing today forces work onto the board. Ship two enforcement points that both route to one decision module: `gw guard` (is this commit accounted for by an item?) and `gw hook install [--ci]` (a commit-msg hook, and a PR workflow running gw check + gw guard --range). Done when: guard accepts a claimed item, an id in the commit message, or an id in the branch; exempts board-only commits; refuses a terminal or unknown id with an actionable fix; hook install is idempotent, co-exists with an existing hook, and uninstalls cleanly; tests and preflight green.","deps":[],"evidence":[{"text":"test/guard.test.js","stage":null},{"text":"test/hook.test.js","stage":null},{"text":"491 tests green","stage":null},{"text":"33ec977","stage":null},{"text":"test/guard.test.js","stage":null},{"text":"test/hook.test.js","stage":null}],"notes":"[2026-09-17T10:46:45.916Z] Three gates, one decision module (lib/guard.js): pre-edit (provider PreToolUse), commit-msg hook, and gw guard --range in CI. Found by running guard against this repo's own board: items in a role:'done' stage were still vouching for later commits; fixed via isTerminalStage.","refs":[],"parent":null,"created_by":"agent:claude","gh":null,"created":"2026-09-17T10:37:23.987Z","updated":"2026-09-17T11:01:28.704Z"},{"id":"P2-11","title":"move: every refusal must name a command that actually works","phase":"P2","priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:claude","scope":"stageOrderMessage promises an actionable next step and breaks that promise in two cases, on every board, not only trunk-shaped ones. (1) Last pipeline stage: nextStage() returns null, so the 'outside the pipeline' branch fires even though fromIndex >= 0, and the backward branch that would have given the right answer is never reached. (2) Any side stage: the shipped board's own 'paused' and 'dropped' are outside the pipeline, so re-entering the pipeline prints 'move it onto the pipeline first: run gw move \u003cid> backlog' — and that command is refused by the same rule, verbatim, forever. Both are dead ends: the one thing this function exists to prevent. Done when every branch names a command move would accept, the last stage and the side stages are covered by tests on both a trunk and the shipped pipeline, and the agent contract distinguishes --force for pipeline ORDER (lawful, and named by the refusal itself) from --force past a GATE (never).","deps":[],"evidence":[{"text":"e83f685","stage":null},{"text":"test/rules.test.js","stage":null},{"text":"495 tests green","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"agent:claude","gh":null,"created":"2026-09-17T11:01:10.465Z","updated":"2026-09-17T11:22:06.597Z"},{"id":"P2-10.1","title":"CI must judge history by history's rules, and gate on the checkout under review","phase":"P2","priority":null,"type":"defect","stage":"built","flag":"needs-triage","owner":"agent:claude","scope":"Two faults found by pointing the installed workflow at this branch. (1) The template pins npx gatewright@\u003cversion>, correct for a consumer and wrong for gatewright's own repo: the published version cannot contain what the PR adds. This checkout runs node bin/gw.js. (2) gw guard --range refused this very branch — its commits name P2-10, which is finished, because a PR is reviewed after its work is done. 'That item is finished' is right for work happening now and wrong for history, so the rule is skipped under --range; an unknown id is still refused. Done when the range check passes on a completed branch and a test covers both.","deps":[],"evidence":[{"text":"de88d02","stage":null},{"text":"test/guard.test.js","stage":null},{"text":"493 tests green","stage":null}],"notes":"","refs":[],"parent":"P2-10","created_by":"agent:claude","gh":null,"created":"2026-09-17T11:03:16.522Z","updated":"2026-09-17T11:03:31.418Z"},{"id":"P2-10.2","title":"Windows: containment and the executable bit","phase":"P2","priority":null,"type":"defect","stage":"built","flag":"needs-triage","owner":"agent:claude","scope":"CI on windows-latest failed three of the new tests. One real defect: --pretool judged 'outside the repository' with relative().startsWith('..'), and between two drives Windows cannot express that answer as '..' — it returns the target absolute — so /etc/hosts read as inside the repo and was gated. Fixed by moving the containment predicate root.js already had into lib/util/paths.js as isWithin() and using it at both call sites, per specs §10.2 / P6-02: every comparison against an OS-produced path normalises first. Two platform-honesty fixes: hook status reported 'not executable' on Windows, which has no such bit for git to consult (Git for Windows runs the hook through its bundled sh regardless); and the two tests that need a POSIX shell and a ':' PATH separator now skip there, with the unit coverage reaching the same decisions without a shell. Done when all three OSes are green in CI.","deps":[],"evidence":[{"text":"b55c5c0","stage":null},{"text":"test/paths.test.js","stage":null},{"text":"497 tests green","stage":null}],"notes":"","refs":[],"parent":"P2-10","created_by":"agent:claude","gh":null,"created":"2026-09-17T11:33:11.203Z","updated":"2026-09-17T11:33:28.676Z"},{"id":"P0-08","title":"Improve TUI","scope":"THE TUI today looks very plain and does not look like a polished product. I want to add a more clear graphical and user-friendly TUI","phase":"P0","priority":null,"type":null,"stage":"built","flag":null,"owner":"human:rahil","deps":[],"evidence":[{"text":"Full-screen gw init (3 steps, review before write) and gw config settings screen driven in tmux at 80x24 (/tmp/gw-p008-screens); --yes output byte-identical to 0.12.0 for solo and team; test/tui-prompt.test.js, test/setup.test.js, test/config.test.js","stage":"built"}],"notes":"[2026-09-19T13:35:03.964Z] AGREED SCOPE (Rahil, 2026-09-19): the interactive flows of gw init and gw config, made as graphical as possible - arrow-key selection with a highlighted current choice, colour, boxes/panels, step progress, a live description of the focused option, and a closing summary card of what was done. Zero dependencies. Numbered entry still works as a fallback; anything non-interactive (no TTY, --yes, --no-input, CI, GW_NO_INPUT) stays byte-identical. init must ask one workflow question, not two overlapping ones.","refs":[],"parent":null,"created_by":"github","gh":{"number":8,"url":"https://github.com/rahilp/gatewright/issues/8","updated_at":"2026-09-19T19:49:49Z"},"created":"2026-09-17T11:34:24.927Z","updated":"2026-09-19T14:06:10.660Z"},{"id":"P0-09","title":"github.enabled true but the board never syncs","phase":"P0","priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"The serve sync controller enables polling only when github.enabled AND github.repo AND github.sync_interval_min are all set, but sync_interval_min is absent from templates/config.json and is not a settable key in lib/settings.js. So gw init --gh produces a config that says enabled:true while /api/state reports sync {enabled:false,status:'off'}, and the board never pulls an issue. Rahil hit this directly: filed issue #8, waited, saw nothing; last_sync was three days stale and a manual gw sync pulled it immediately. Fix: ship a default interval in the template, expose the key through gw config, and make the board say 'sync is configured but not scheduled' instead of reporting off while the config says on.","deps":[],"evidence":[{"text":"templates/config.json","stage":null},{"text":"lib/commands/init.js","stage":null},{"text":"test/serve.test.js","stage":null},{"text":"verified: board reports enabled/idle/5min after gw config","stage":null},{"text":"d86816f","stage":null},{"text":"test/serve.test.js","stage":null},{"text":"verified: board reports enabled/idle/5min","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T11:34:39.315Z","updated":"2026-09-17T11:41:28.655Z"},{"id":"P2-10.3","title":"A file that does not exist yet is still inside the repository","phase":"P2","priority":null,"type":"defect","stage":"built","flag":"needs-triage","owner":"agent:claude","scope":"normalizePath can only resolve a path that exists — realpath has nothing to open otherwise — and the paths guard compares routinely do not exist yet: an agent's Write names the file it is about to create. isWithin normalised only the side that existed, comparing a resolved parent against an unresolved child, so under any symlinked or short-named root (macOS /tmp -> /private/tmp, Windows RUNNER~1) a brand-new file inside the repository read as outside it and went ungated — the first tool call of most tasks. normalizeForCompare resolves the deepest existing ancestor and re-attaches the rest. Found by the test written for the previous Windows fix, which failed on macOS and Windows; reproduced on Linux with a symlinked root. Done when a Write to a non-existent file under a symlinked root is gated, and all three OSes are green.","deps":[],"evidence":[{"text":"cd6b1be","stage":null},{"text":"test/paths.test.js","stage":null},{"text":"499 tests green","stage":null}],"notes":"","refs":[],"parent":"P2-10","created_by":"agent:claude","gh":null,"created":"2026-09-17T11:35:46.262Z","updated":"2026-09-17T11:35:52.357Z"},{"id":"P0-10","title":"brag-output was committed by an over-broad git add","phase":"P0","priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"38 files and 7.8 MB of generated video output, including a 1.4 MB mp4 and font binaries, were committed in d86816f by a git add -A that swept in an untracked directory I had already noticed and flagged. It belongs in .gitignore, not the repository.","deps":[],"evidence":[{"text":"5e16dad","stage":null},{"text":".gitignore","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T14:25:19.198Z","updated":"2026-09-17T15:59:05.820Z"},{"id":"P0-11","title":"Capture must cost one command","phase":"P0","priority":"P0","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"gw add 'Fix the login bug' yields an item that cannot be worked on: five commands and a mandatory scope stand between an idea and 'I am working on it'. Capture should be one command that always produces a valid item, with phase, type and priority left null because they are genuinely unknown, not guessed as P0.","deps":[],"evidence":[{"text":"lib/commands/add.js","stage":null},{"text":"verified: gw add 'Fix the login bug' -> T-0001, workable in 3 commands","stage":null},{"text":"141383c","stage":null},{"text":"lib/commands/add.js","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T15:59:22.836Z","updated":"2026-09-17T16:22:16.000Z"},{"id":"P0-12","title":"Default id scheme becomes seq so phase can be unknown","phase":"P0","priority":"P0","type":"decision","stage":"built","flag":null,"owner":"human:rahil","scope":"phase-seq mints ids as \u003cphase>-\u003cNN>, so an item cannot exist without a phase and nextId refuses null. That is why an unlabelled GitHub issue and a bare gw add both land in P0: it is structurally forced, not a judgement. seq ids (T-0001) let phase be genuinely absent. phase-seq stays available for boards that want it; existing boards keep theirs.","deps":[],"evidence":[{"text":"templates/config.json","stage":null},{"text":"verified: seq default, phase null, phase-seq still refuses null","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T15:59:22.896Z","updated":"2026-09-17T16:21:53.927Z"},{"id":"P0-13","title":"Unclassified intake is a visible state, not a silent default","phase":"P0","priority":"P0","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"A bare gw add, a GitHub issue with no mapped labels, and an import all currently produce a fully-triaged-looking item. They should carry needs-triage, the way agent-created work already does, and gw check should report untriaged intake instead of staying silent.","deps":[],"evidence":[{"text":"lib/commands/check.js","stage":null},{"text":"verified: INBOX at exit 0, NEEDS TRIAGE at exit 1 past stale_days","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T15:59:22.974Z","updated":"2026-09-17T16:21:53.988Z"},{"id":"P0-14","title":"Drop the scope gate and collapse the specified stage","phase":"P0","priority":"P1","type":"decision","stage":"built","flag":null,"owner":"human:rahil","scope":"specified requires a scope before work can start, which puts a gate at capture time where the user knows least. Rigor belongs at the evidence gate. The shipped pipeline becomes backlog -> building -> built, and scope is required at built alongside evidence, where completion is actually claimed. Existing boards keep their pipeline.","deps":[],"evidence":[{"text":"templates/stages.json","stage":null},{"text":"verified: built requires scope AND evidence; specified gone","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T15:59:23.061Z","updated":"2026-09-17T16:21:54.048Z"},{"id":"P0-15","title":"Delete item.gate and free the word for real gates","phase":"P0","priority":"P0","type":"decision","stage":"built","flag":null,"owner":"human:rahil","scope":"item.gate is read by zero rules — grep of lib/ finds it written, displayed, filtered and glossed, never evaluated. Its vocabulary duplicates priority: G0 'the phase cannot be called done while this is open' against P1 'do it in this phase'; G2 'picked up only if there is room' against P3 'do it if there is room'. On this board 134 items carry both, 124 of them G0 regardless of priority, and G2 is never used once — only one item would lose information. So every item carries two overlapping taxonomies, and the one that enforces nothing owns the product's core noun. Delete the field, let priority carry commitment, and let 'gate' mean exactly one thing: the requires rule on a stage, which is what Gatewright is named after. Nobody is using the tool yet, so the migration is free now and expensive later.","deps":[],"evidence":[{"text":"3467495","stage":null},{"text":"verified: mechanism refuses and describes; --gate rejected; legacy key invisible","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T16:03:13.464Z","updated":"2026-09-17T20:32:02.186Z"},{"id":"P0-16","title":"Release v0.11.0","phase":"P0","priority":"P1","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"","deps":[],"evidence":[{"text":"ce0fd7d","stage":null},{"text":"516 tests green on main","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T23:07:29.797Z","updated":"2026-09-17T23:07:40.454Z"},{"id":"P0-17","title":"The test suite leaked a temp board per test","phase":"P0","priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Almost every test mkdtemps a scratch board and 40 of 46 files never remove it. One run stranded 347 gw-* directories at ~7 inodes each, plus gatewright-* from preflight and upgrade. A few hundred runs exhausted a 1,048,576-inode tmpfs at 11 percent disk use, after which nothing on the machine could create a file — including the test runner itself.","deps":[],"evidence":[{"text":"7c8d513","stage":null},{"text":"verified: net zero growth across runs; /tmp inodes 97% -> 1%","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T23:40:17.815Z","updated":"2026-09-17T23:40:25.766Z"},{"id":"T-0001","title":"migration smoke test","phase":null,"priority":null,"type":null,"stage":"dropped","flag":"needs-triage","owner":null,"scope":"","deps":[],"evidence":[],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T23:58:19.175Z","updated":"2026-09-17T23:58:23.885Z"},{"id":"T-0002","title":"The digest protects items.jsonl only, so the gates themselves can be silently disabled","phase":null,"priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"store.js hashes only items.jsonl into .digest — the object has a single 'items' key. stages.json and config.json are unprotected, so anyone can delete a stage's requires block and gw check still reports 'Board is clean.' Reproduced: a move to built refused for missing evidence; after hand-deleting requires from stages.json, check reported clean at exit 0 and the same move succeeded with zero evidence. The instruction block tells every agent 'Never edit files in .gatewright/ directly' and check is what makes that rule enforceable, but it only enforces it for one of the four files. For a product whose entire value is gates that cannot be bypassed, the rules defining those gates are the one thing nothing watches. Hash stages.json and config.json into the digest too, and report a change to either as an out-of-band write.","deps":[],"evidence":[{"text":"test/store.test.js","stage":null},{"text":"test/check.test.js","stage":null},{"text":"lib/store.js","stage":null},{"text":"test/store.test.js","stage":null},{"text":"verified: 6 gw write paths + 2 serve endpoints leave check clean; stages tamper exits 1; events append ignored; 537 tests x3","stage":null}],"notes":"[2026-09-18T00:37:12.254Z] Plan: digest items+stages+config in store.js (events.jsonl stays undigested, append-only); verifyDigest reports per-file out-of-band writes; old digests without per-file keys baseline silently; writeConfig and serve's replaceStages rebaseline; tests in store/check tests.\n[2026-09-18T00:45:10.406Z] Agent marked this built prematurely. Verification found a regression: gw config now trips its own tamper alarm because it persists outside store.writeConfig. Returned to the agent with a per-write-path audit required.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-17T23:59:48.166Z","updated":"2026-09-18T00:52:27.067Z"},{"id":"T-0003","title":"gw resume dispatches any item and silently strips its owner","phase":null,"priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"resume() in lib/run/lifecycle.js never checks the item is paused, has a prev_stage, or has a worktree. Verified: gw resume on a built, owned, never-paused item printed 'dispatched.' at exit 0 and set owner to null. Its own help says 'resume a paused item using its existing worktree'. This can silently release another person's or agent's active claim.","deps":[],"evidence":[{"text":"test/run-lifecycle.test.js","stage":null}],"notes":"[2026-09-18T00:37:12.308Z] Plan: resume() requires exactly what stop produces (flag 'paused' + prev_stage), refuses otherwise in house style via UsageError, never touches owner; tests in run-lifecycle tests.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:40.376Z","updated":"2026-09-18T00:42:11.024Z"},{"id":"T-0004","title":"gw show and gw list print 'undefined' as their help summary","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Verified: 'gw show — undefined' and 'gw list — undefined'. Their specs in lib/commands/ are the only two missing a summary field, and router.js interpolates it with no fallback. Two of the most-used commands, broken for exactly the read-the-help workflow per-command help was added for.","deps":[],"evidence":[{"text":"lib/commands/show.js","stage":null},{"text":"verified: 'gw show — show one item and its events'","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:40.491Z","updated":"2026-09-18T01:05:48.106Z"},{"id":"T-0005","title":"gw config still cannot reach most of config.json","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"guard.*, check.stale_days, brief.max_lines, github.dispatch_label and memory.provider are all real keys in config.json and all return 'unknown setting'. The guard block — the newest safety-critical feature — is entirely unreachable, so tuning it means hand-editing the file that every gw brief tells you never to edit by hand. config.js's own header says it exists to remove that contradiction; it removes half of it.","deps":[],"evidence":[{"text":"lib/settings.js","stage":null},{"text":"verified: guard.mode, check.stale_days, brief.max_lines, github.dispatch_label, memory.provider all reachable; mirror deep-equal intact","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:40.594Z","updated":"2026-09-18T01:05:48.164Z"},{"id":"T-0006","title":"gw brief --json does not answer the question brief exists to answer","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"It returns items, events, stages, config, git and output — the whole raw board plus the rendered text blob including its '(+32 more)' truncation baked into a string. There is no blocked, needs_triage or next_unblocked array, so a script wanting 'what is blocked' must reimplement the logic or regex the human text.","deps":[],"evidence":[{"text":"lib/brief.js","stage":null},{"text":"verified: brief.{dispatched,in_flight,blocked,needs_triage,next_unblocked}","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:40.698Z","updated":"2026-09-18T01:05:48.223Z"},{"id":"T-0007","title":"import accepts vocab values that add and edit refuse","phase":null,"priority":"P2","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw add --phase ZZZ is refused at exit 2. The same value through gw import csv is accepted silently at exit 0 and only surfaces later as a check VOCABULARY problem. Bulk intake is the path least likely to be watched.","deps":[],"evidence":[{"text":"lib/commands/import.js","stage":null},{"text":"verified: skips a bad-vocab row with line and reason, all-bad exits 2","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:40.808Z","updated":"2026-09-18T01:24:49.503Z"},{"id":"T-0008","title":"JSON import reports success when every row failed","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"A JSON array whose rows lack an id returns exit 0 with 'imported 0, skipped 1'. The identical failure in CSV exits 2. A CI script checking the exit code sees success while not :"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw gc --dry-run in a non-git directory dumps 'fatal: not a git repository ... GIT_DISCOVERY_ACROSS_FILESYSTEM not set' verbatim. Exit 3 is right; the message is a child-process dump rather than the tool naming the problem and the fix, which the rest of the CLI does well.","deps":[],"evidence":[{"text":"lib/commands/gc.js","stage":null},{"text":"verified: names the problem and the fix instead of dumping git stderr","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:41.241Z","updated":"2026-09-18T01:24:49.685Z"},{"id":"T-0012","title":"brief cannot tell an empty board from a finished one","phase":null,"priority":"P3","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"A board where every item reached verified prints exactly what an untouched board prints: 'No open work. Add one with gw add.' A project that just shipped everything is told nothing is here.","deps":[],"evidence":[{"text":"lib/brief.js","stage":null},{"text":"verified: All 1 item(s) are finished","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:41.353Z","updated":"2026-09-18T01:24:49.738Z"},{"id":"T-0013","title":"claim and note accept empty input without complaint","phase":null,"priority":"P3","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw note \u003cid> \"\" records an empty note event. Almost always a paste error.","deps":[],"evidence":[{"text":"lib/commands/note.js","stage":null},{"text":"verified: note text must not be empty","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:04:41.464Z","updated":"2026-09-18T01:24:49.791Z"},{"id":"T-0014","title":"Removing a stage is one unconfirmed click and cannot be undone","phase":null,"priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Stages & rules removes any empty stage immediately on click. Verified: the viewer contains zero confirm() calls anywhere, so nothing destructive asks. A misclick permanently reshapes the gate pipeline and gw check reports nothing wrong afterwards. The guard rail that does exist — refusing to remove a stage holding items, with a good message — protects the wrong condition: the dangerous case is the empty stage nobody notices going.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified in Chrome: confirm asked \"Remove stage Merged (merged)... Deleting it loses its gate rules\", declining left the stage in place","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:16:30.370Z","updated":"2026-09-18T00:42:56.791Z"},{"id":"T-0015","title":"The item panel is wiped mid-edit by the 2-second poll","phase":null,"priority":"P0","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Typing into a note or scope field and pausing for three seconds reverts it to server state with no warning. formDirty guards renderView at board.html:2733 but renderPanel is called at 2152, 2180 and 2383 with no such check, so the guard covers the Stages and Settings editors and not the panel a human actually types in most.","deps":[],"evidence":[{"text":"viewer/board.html","stage":null},{"text":"verified in Chrome: typed text survived two poll cycles intact","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:16:30.481Z","updated":"2026-09-18T00:42:56.738Z"},{"id":"T-0016","title":"The snapshot's + new item button lies","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"gw open writes a static board where every other write control degrades correctly, naming the gw command to run instead. + new item still opens a live-looking create form and submitting shows a raw 'Failed to fetch' with no
