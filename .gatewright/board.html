d or overview overflow","stage":null}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:16:31.143Z","updated":"2026-09-18T01:46:31.898Z"},{"id":"T-0022","title":"T-0014: add explicit confirmation before destructive board actions (stage removal at minimum)","phase":"P0","priority":null,"gate":null,"type":null,"stage":"dropped","flag":null,"owner":"human:rahil","scope":"","deps":[],"evidence":[],"notes":"[2026-09-18T00:41:11.867Z] Not filed by Rahil. An agent working T-0014/T-0015 wrote its own plan steps to the live board, breaching its brief. Dropped as litter.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:34:52.005Z","updated":"2026-09-18T00:41:11.924Z"},{"id":"T-0023","title":"T-0014: audit other destructive controls in viewer/board.html and confirm-guard them","phase":"P0","priority":null,"gate":null,"type":null,"stage":"dropped","flag":null,"owner":"human:rahil","scope":"","deps":[],"evidence":[],"notes":"[2026-09-18T00:41:11.973Z] Not filed by Rahil. An agent working T-0014/T-0015 wrote its own plan steps to the live board, breaching its brief. Dropped as litter.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:34:52.070Z","updated":"2026-09-18T00:41:12.031Z"},{"id":"T-0024","title":"T-0015: make poll respect in-progress panel editing via dirty check, with re-render on item switch","phase":"P0","priority":null,"gate":null,"type":null,"stage":"dropped","flag":null,"owner":"human:rahil","scope":"","deps":[],"evidence":[],"notes":"[2026-09-18T00:41:12.099Z] Not filed by Rahil. An agent working T-0014/T-0015 wrote its own plan steps to the live board, breaching its brief. Dropped as litter.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:34:52.134Z","updated":"2026-09-18T00:41:12.158Z"},{"id":"T-0025","title":"Verify: hand-test in real browser on scratch board + npm test + preflight:ci green","phase":"P0","priority":null,"gate":null,"type":null,"stage":"dropped","flag":null,"owner":"human:rahil","scope":"","deps":[],"evidence":[],"notes":"[2026-09-18T00:41:12.214Z] Not filed by Rahil. An agent working T-0014/T-0015 wrote its own plan steps to the live board, breaching its brief. Dropped as litter.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T00:34:52.197Z","updated":"2026-09-18T00:41:12.274Z"},{"id":"T-0026","title":"GW_ROOT takes the .gatewright dir, not the project root, and says so nowhere a user looks","phase":null,"priority":"P2","type":"defect","stage":"built","flag":null,"owner":"agent:roundtrip","scope":"root.js does 'return dirname(resolve(env.GW_ROOT))', so GW_ROOT must point at the .gatewright directory itself and the CLI uses its parent. Setting GW_ROOT=/path/to/project — the obvious reading, and the one I used while directing agents — silently resolves to the project's PARENT and writes a board there. specs.md documents it only inside the runner section (GW_ROOT=\u003crepo>/.gatewright) as an implementation note for spawned agents; README and gw --help never mention it. A variable whose obvious reading silently creates a board in the wrong directory needs either the forgiving behaviour (accept a project root that contains .gatewright) or a clear error naming what it expected.","deps":[],"evidence":[{"text":"verified by driving the CLI: verified-stage item round-trips with owner and all four stage-tagged evidence entries; three smuggling attempts (wrong tag, built-evidence-for-verified, no evidence) all refused to backlog; GW_ROOT project root works, .gatewright form warns, boardless path refuses rc=3 without creating a board","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:45:40.025Z","updated":"2026-09-18T03:36:13.487Z"},{"id":"T-0027","title":"The Table view still overflows a phone, from its nowrap action columns","phase":null,"priority":"P3","type":"defect","stage":"built","flag":null,"owner":"agent:viewer4","scope":"Reported honestly by the agent that fixed T-0021, with A/B evidence: with overflow-wrap reverted the table balloons to 1528px with a 779px title cell; fixed it is 759px with the title cell at 47px. So titles are no longer the cause. What remains is the nowrap columns — Actions about 225px, Updated about 82px, plus id/type/phase/priority/stage/flag/owner. Narrowing or collapsing those on a narrow viewport is a design decision, not a bug fix.","deps":[],"evidence":[{"text":"verified in a real browser (chromium/puppeteer) on a 61-item scratch board: evidence chips read 'commit abc123 Built' with no [object Object] anywhere; #board 15935px -> 724px; 0 bare ? pills; docScrollWidth 390 at phone width; +53 more is a real BUTTON expanding 8 -> 61 rows; panel labels human; dropped row offers no Claim or move picker","stage":"built"},{"text":"verified in a real browser: table container scrolls 893 vs 350 at 390px with a 208px title cell in word-lines; every gate reason bounded inside its own button wrap; zero console errors; glass applied with a solid @supports fallback and no external assets","stage":"built"}],"notes":"[2026-09-18T04:14:49.432Z] REOPENED. My earlier verification was wrong. I measured docScrollWidth=390 at a 390px viewport and read it as 'no overflow, fixed'. A round-3 reviewer drove the same view and found what that number actually means: the table COMPRESSES to fit instead of scrolling, so the Title column collapses to ~30px and renders one character per line (B/l/o/c/k/e/d, featur/e). The absence of page overflow was the symptom of the bug, not evidence of the fix. The fix's own comment in board.html says the overflow belongs to the table container, not the document - either that never took effect or it loses to the column min-widths. Verify the NEXT fix by reading the rendered column widths and the table container's scrollWidth vs clientWidth, not the document's.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:46:31.956Z","updated":"2026-09-18T05:07:10.196Z"},{"id":"T-0028","title":"The guard has no answer for a rollup commit of already-built work","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:gates","scope":"A commit landing N already-built items is refused: guard demands each named item be in flight, and the only escape is --no-verify, which disables the check entirely rather than satisfying it. A built item whose evidence is this commit should satisfy the guard.","deps":[],"evidence":[{"text":"verified by driving guard: CVE and HTTP tokens alongside a real item pass silently rc=0; an actor claiming nothing but naming a real item passes via id match; unmatched-tokens-only and nothing-named both refuse rc=1 with the tokens listed","stage":"built"}],"notes":"[2026-09-18T02:45:07.625Z] DECISION (product owner): guard accepts a commit that names any real item, and warns rather than refuses when that item is already finished.\n\nGuard's question is 'is this change accounted for on the board'. An item that is built IS accounted for. Requiring it to be in flight conflates 'accounted for' with 'in progress', and leaves --no-verify - which disables the check entirely - as the only path for a rollup commit. A check whose only escape hatch is to turn it off will get turned off habitually, and then it protects nothing.\n\nFix: refuse only when nothing is named and nothing is claimed, or when the named id does not exist on the board. When the named item exists but is finished, pass with a one-line warning naming the item and its stage. Multiple ids in one message: all must exist; warn for each finished one.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:55:06.735Z","updated":"2026-09-18T03:16:47.973Z"},{"id":"T-0029","title":"The final evidence gate cannot fail: evidence_min counts lifetime evidence, not evidence for this move","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:evidence","scope":"Verified requires evidence_min 2; evidence [\"commit abc1234\",\"pr-url\",\"commit abc1234\"] passed. Count DISTINCT evidence entries, and decide whether entries already present before the move should count at all. Also: reviewed and merged accepted zero new evidence while the brief footer advertises 'needs evidence past Building'.","deps":[],"evidence":[{"text":"acceptance matrix run by hand: bare/duplicate/repeated-flag all refuse, two fresh entries pass; migration verified clean against check, config and brief","stage":"built"}],"notes":"[2026-09-18T01:58:32.826Z] ESCALATED after driving it myself. The duplicate-counting is a symptom; the structural defect is that evidence_min counts the item's LIFETIME evidence array (lib/rules.js:34), not evidence supplied for this move. In the shipped templates/stages.json: built requires evidence_min 1, in_review requires a PR link (adding a 2nd entry), verified requires evidence_min 2. So by the time an item reaches verified it ALWAYS has >=2 entries. Verified accepted the move with NO new evidence, rc=0. The final gate of the default pipeline cannot fail in any normal walk - it is dead code as shipped. evidence_match has the same shape (rules.js:44 .some() over lifetime evidence), so a PR link supplied once satisfies every later evidence_match stage forever. Fix must decide per-move vs cumulative semantics, not just de-duplicate.\n[2026-09-18T01:59:47.370Z] DECISION (product owner): evidence_min and evidence_match take PER-MOVE semantics, not lifetime.\n\nWhy not the cheaper fix. De-duplicating the lifetime array fixes the symptom and leaves the defect: built(1) + in_review(PR link) already puts 2 DISTINCT entries on the item, so verified's evidence_min 2 stays pre-satisfied. Any fix that still counts lifetime evidence leaves the last gate dead.\n\nWhat a gate means. Standing in stage N asserts 'the evidence for N exists'. Verification evidence is categorically not the commit that satisfied built - it is a test run, a deploy check, a reviewer's sign-off. A threshold that an earlier stage already met is not a gate, it is decoration.\n\nSemantics: evidence_min N = at least N distinct entries supplied WITH THIS MOVE. evidence_match = at least one entry supplied WITH THIS MOVE matches the pattern. Distinct means after trimming and exact de-duplication against both the other entries in this move and the entries already on the item.\n\nData shape: item.evidence becomes entries carrying the stage they were supplied for, so the board can show what justified each gate and so this rule is checkable after the fact. Existing flat strings migrate with stage null. Breaking change, and migrations are in scope.\n\nConsequence accepted: forcing an item backward and re-moving it forward will demand fresh evidence. That is correct - if the work was redone, the old evidence no longer describes it.\n\nStages with an empty requires block (reviewed, merged in the shipped template) are unaffected and still advance by hand; that is a separate question about whether the default pipeline asks for enough, filed separately.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:30.766Z","updated":"2026-09-18T02:37:34.909Z"},{"id":"T-0030","title":"An agent has no documented way to be recorded as itself","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:identity","scope":"Every agent write lands as created_by 'human' and by 'human:rahil'. GW_ACTOR works but is named nowhere in gw --help or templates/agents-block.md. Consequences: false audit trail, and triage_required_for:['agent'] can never fire. Document GW_ACTOR/--by in the agents block and root help.","deps":[],"evidence":[{"text":"verified by driving the CLI on a scratch board, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:30.820Z","updated":"2026-09-18T02:21:23.061Z"},{"id":"T-0031","title":"The agents block contradicts itself on where plan steps go","phase":null,"priority":null,"type":"doc","stage":"built","flag":null,"owner":"agent:identity","scope":"templates/agents-block.md line 5 says plan steps are items (gw add --parent); line 7 says 'Your own plan steps: gw note \u003cid>'. This is the only instruction a real agent gets. Pick one and state it once.","deps":[],"evidence":[{"text":"verified by driving the CLI on a scratch board, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:30.880Z","updated":"2026-09-18T02:21:23.122Z"},{"id":"T-0032","title":"brief --json ships the whole board and costs 33x the human brief","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:identity","scope":"brief --json returns items, events, stages, config, git, output AND brief - the full event log, the full config, plus a duplicate of the human string. Measured 54,471 chars vs 1,635 on a 103-item board (~13.6k tokens per poll) for the exact audience that is told to prefer JSON. Return the brief, not the database.","deps":[],"evidence":[{"text":"verified by driving the CLI on a scratch board, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:30.937Z","updated":"2026-09-18T02:21:23.183Z"},{"id":"T-0033","title":"A gate refusal names the rule but not the pattern it wants","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:messages","scope":"move ... --evidence 'PR #42' refuses with 'needs matching evidence: run gw move ... --evidence \u003ce>' while gw next on the same item says 'Evidence must include a link to a pull request'. lib/gates/describe.js already produces the sentence; the refusal path does not use it. Route refusals through the same describer.","deps":[],"evidence":[{"text":"acceptance matrix run by hand: bare/duplicate/repeated-flag all refuse, two fresh entries pass; migration verified clean against check, config and brief","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:30.998Z","updated":"2026-09-18T02:37:34.970Z"},{"id":"T-0034","title":"dropped is one keystroke away and the recovery message names no real stage","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:messages","scope":"gw move \u003cid> dropped from any stage succeeds with no evidence and no force, exit 0. Recovery prints 'run gw move \u003cid> \u003cside-stage> --force' - a literal placeholder; the working path (paused --force, then building --force) is only discoverable via gw next. Name the real stages in the message.","deps":[],"evidence":[{"text":"re-verified by driving the CLI on scratch boards: advice run verbatim and outcome asserted, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:31.056Z","updated":"2026-09-18T02:31:44.993Z"},{"id":"T-0035","title":"The definition of done can be rewritten after an item is verified","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:identity","scope":"gw edit \u003cid> --scope 'rewritten after the fact' succeeds silently, exit 0, on a verified item. Scope is what the evidence was judged against; changing it after the fact invalidates the judgement without a trace.","deps":[],"evidence":[{"text":"verified by driving the CLI on a scratch board, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:31.121Z","updated":"2026-09-18T02:21:23.243Z"},{"id":"T-0036","title":"NEEDS TRIAGE fills the brief but gates nobody","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:gates","scope":"15 of 25 brief lines were triage rows on a 103-item board, with no instruction attached - the agents block never mentions triage and brief does not explain it. And gw triage \u003cid> --approve succeeds for the same actor that created the item, so it is not a review gate.","deps":[],"evidence":[{"text":"verified by driving the CLI: creator refused rc=1 with a named reason, another actor approves rc=0, creator --drop still allowed; repair dry-run/--write/quarantine/digest all confirmed","stage":"built"}],"notes":"[2026-09-18T02:45:07.570Z] DECISION (product owner): triage must refuse self-approval.\n\nThe hold exists to keep unreviewed agent-created work off the scheduler until a human looks at it. Today gw triage \u003cid> --approve succeeds for the same actor that created the item, so the reviewed party reviews itself and the hold gates nobody.\n\nFix: refuse --approve when the approving actor matches created_by (use sameOwner from lib/owner.js so human:rahil and rahil are the same person). The refusal must name who created it and say that someone else must approve, or that --force is the deliberate override. --drop stays available to the creator: discarding your own work needs no second pair of eyes.\n\nAlso: brief shows NEEDS TRIAGE rows with no instruction attached, and the agents block never mentions triage at all. Whatever brief prints for those rows must name the command that clears them, the same way check now does.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:31.186Z","updated":"2026-09-18T03:09:01.274Z"},{"id":"T-0037","title":"'other moves: ready -> dropped' reads like a stage named ready","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:messages","scope":"In gw next output, 'ready ->' means 'available now' but parses as a stage name next to real stage names. Reword.","deps":[],"evidence":[{"text":"re-verified by driving the CLI on scratch boards: advice run verbatim and outcome asserted, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:56:31.246Z","updated":"2026-09-18T02:31:45.051Z"},{"id":"T-0038","title":"The default pipeline asks for nothing at reviewed and merged","phase":null,"priority":null,"type":"decision","stage":"built","flag":null,"owner":"agent:evidence","scope":"templates/stages.json gives reviewed {} and merged {deps_at_least} - no evidence, no owner, no scope. The brief footer says 'needs evidence past Building', which is false for two of the four stages past Building. Either the template should ask for something at those stages or the footer should stop claiming it does. Decide which.","deps":[],"evidence":[{"text":"verified by driving the CLI: footer matches specs 497 byte-for-byte; --by rahil stores human:rahil and guard matches; non-string dep skips the row with its line number","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T01:59:47.430Z","updated":"2026-09-18T02:47:24.840Z"},{"id":"T-0039","title":"gw check's INBOX advice is a dead end: neither suggested command clears the flag","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:messages","scope":"check tells you to classify with gw edit --phase/--type/--priority or to gw claim it. Verified: after either, flag stays needs-triage. Only gw triage \u003cid> --approve clears it, and check never names it. A user follows the printed instruction, it succeeds, and the problem is still reported.","deps":[],"evidence":[{"text":"re-verified by driving the CLI on scratch boards: advice run verbatim and outcome asserted, 2026-09-18","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T02:04:07.574Z","updated":"2026-09-18T02:31:45.113Z"},{"id":"T-0040","title":"A dependency cannot be removed from the CLI","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:identity","scope":"gw edit \u003cid> --deps '' ","title":"The remedy for a corrupt board is the one action the tool forbids everywhere else","phase":null,"priority":null,"type":"decision","stage":"built","flag":null,"owner":"agent:gates","scope":"A malformed items.jsonl prints 'Repair it by hand or restore it from git', while brief prints 'Never edit .gatewright/ by hand' and the agents block forbids it. There is no gw repair. Decide the supported recovery for the tool's worst failure.","deps":[],"evidence":[{"text":"verified by driving the CLI: creator refused rc=1 with a named reason, another actor approves rc=0, creator --drop still allowed; repair dry-run/--write/quarantine/digest all confirmed","stage":"built"}],"notes":"[2026-09-18T02:45:07.681Z] DECISION (product owner): add gw repair, so the tool's worst failure has a supported remedy.\n\nToday a malformed items.jsonl prints 'Repair it by hand or restore it from git' while brief prints 'Never edit .gatewright/ by hand' and the agents block forbids it outright. The only remedy is the one action every other surface prohibits.\n\ngw repair must: validate every line of items.jsonl and events.jsonl; report each bad line with its number and what is wrong; move unparseable lines to .gatewright/quarantine.jsonl rather than deleting them; re-baseline the digest afterwards so the repair does not read as tampering; and print what it did. Default to a dry run, requiring --write to change anything. Then the corrupt-board message points at gw repair instead of at hand-editing.","refs":[],"parent":null,"created_by":"human","gh":null,"created":"2026-09-18T02:04:08.086Z","updated":"2026-09-18T03:09:01.332Z"},{"id":"T-0049","title":"A read-only board directory surfaces a raw Node EACCES about a lock file","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:messages","scope":"EACCES: permission denied, open '.../.gatewright/.lock.864845.tmp'. Exit code 3 is right; the message names a temp file the user never created and never says the di ard writes, and flagged the contradiction rather than guessing. The block needs a sentence covering the case where the board you would write to is the product under test - use a scratch board, or the human running you will track it.","deps":[],"evidence":[{"text":"verified: exception paragraph present in templates/agents-block.md line 7 and byte-matched in all four mirrors; names the scratch-board recipe and the cd-persistence trap; 689 tests pass","stage":"built"}],"notes":"[2026-09-18T04:00:45.565Z] LIVE EVIDENCE, 2026-09-18T03:58:42Z: a fix agent (agent:codex) wrote four plan items - T-0074 through T-0077 - directly to this repo's board while working on it, then continued. It was following templates/agents-block.md ('put the plan on the board yourself') over its brief's prohibition on touching .gatewright/. That is at least the fifth agent tonight to hit this. The four items were dropped. This is no longer a theoretical contradiction; it actively corrupts the board of the one project most likely to be worked on by agents.","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:35:10.176Z","updated":"2026-09-18T04:43:10.249Z"},{"id":"T-0066","title":"brief reports '0 in flight' for a claimed item that is actively building","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:brief3","scope":"Verified: add, claim by another actor, move to building - gw brief header still says '0 in flight'. The headline counter on the primary agent-facing command is wrong, so a second agent reading the board concludes nobody is working. Whatever 'in flight' is computed from does not match owner+pipeline-stage. Also: brief hides finished work entirely, so a fresh agent cannot tell what already happened without gw list --stage verified, which neither brief nor the agents block mentions.","deps":[],"evidence":[{"text":"verified by driving the CLI: claimed+building now counts in flight while claimed-unmoved does not; finished count and pointer appear; --me filters every bucket; the stranded-dep command was run verbatim and preserved the live dep","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:46:36.289Z","updated":"2026-09-18T04:23:56.750Z"},{"id":"T-0067","title":"The commit hook silently does nothing when the installed gw has no guard","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:gates3","scope":"templates/commit-msg.sh probes 'gw guard --help' and steps aside when it fails. On this machine the global gw is 0.7.0 with no guard command (rc=2), so every commit passes unguarded - including one naming no item - while the repo binary refuses the same message correctly. The fail-open is deliberate and the reasoning is right (a stale tool must not make a repo uncommittable), but it is SILENT: gw hook install prints 'commits must now name, claim, or branch on an item' when on this machine they will not. hook install and hook status must run the same probe and warn loudly when the guard would not fire.","deps":[],"evidence":[{"text":"verified by driving the CLI: hook install and status both warn the guard probe failed on this guardless machine; a held item is refused advancement and moves after another actor approves; check rc=1 INVALID STAGE even after repair re-baselined the digest; a non-owner move is refused naming both lawful exits","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:46:36.346Z","updated":"2026-09-18T04:30:41.291Z"},{"id":"T-0068","title":"needs-triage does not gate claim or move, only triage itself","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:gates3","scope":"Verified: an item flagged needs-triage was claimed by a different agent and moved to building, rc=0 both times, flag still set afterwards. templates/agents-block.md describes the flag as a hold that someone else must lift, which overstates it - the only thing it gates is triage --approve. Either enforce the hold on claim/move, or change the block and brief to describe what it actually does.","deps":[],"evidence":[{"text":"verified by driving the CLI: hook install and status both warn the guard probe failed on this guardless machine; a held item is refused advancement and moves after another actor approves; check rc=1 INVALID STAGE even after repair re-baselined the digest; a non-owner move is refused naming both lawful exits","stage":"built"}],"notes":"[2026-09-18T03:55:27.240Z] DECISION (product owner): the hold blocks ADVANCEMENT, not capture or claiming.\n\nneeds-triage means 'captured but not yet accepted onto the board'. Two independent reviewers found it blocks nothing except triage --approve itself, while the agents block and brief both describe it as a hold someone must lift.\n\nImplement: gw move refuses to advance a needs-triage item PAST the initial stage, naming the flag, who created it, and that someone other than the creator must run gw triage \u003cid> --approve. --force remains the recorded override, as everywhere else.\n- claim stays allowed: taking responsibility for unreviewed work is harmless and is a useful signal.\n- moves to side stages (dropped, paused) stay allowed: discarding or parking unreviewed capture needs no ceremony.\n- the flag must also not survive into a terminal stage. A verified item sitting in the brief's NEEDS TRIAGE list is nonsense; approving is implied once the work has been through the pipeline. Clear it on entry to a terminal stage if it somehow persists.\n\nThis keeps capture frictionless - the whole point of 'rigor at the evidence gate, not the capture gate' - while making the hold mean something.","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:46:36.403Z","updated":"2026-09-18T04:30:41.352Z"},{"id":"T-0069","title":"brief --me is a no-op","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:brief3","scope":"gw brief and gw brief --me \u003cowner> produce byte-identical output on the same board, including items owned by someone else. Either filter by owner or remove the flag.","deps":[],"evidence":[{"text":"verified by driving the CLI: claimed+building now counts in flight while claimed-unmoved does not; finished count and pointer appear; --me filters every bucket; the stranded-dep command was run verbatim and preserved the live dep","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:46:36.464Z","updated":"2026-09-18T04:23:56.811Z"},{"id":"T-0070","title":"The agents block never names the valid stages","phase":null,"priority":null,"type":"doc","stage":"built","flag":null,"owner":"agent:brief3","scope":"A reviewer following the block guessed 'in_progress' and burned a move on it. The refusal taught them immediately, but listing backlog/building/built/in_review/reviewed/merged/verified in the gw move bullet costs one line. Related: the block never mentions gw init, so how a board comes to exist is left to --help.","deps":[],"evidence":[{"text":"verified by driving the CLI: claimed+building now counts in flight while claimed-unmoved does not; finished count and pointer appear; --me filters every bucket; the stranded-dep command was run verbatim and preserved the live dep","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:46:36.526Z","updated":"2026-09-18T04:23:56.872Z"},{"id":"T-0071","title":"gw repair re-baselines the digest over surviving garbage, legitimising it forever","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:gates3","scope":"Verified: append a VALID-JSON line with stage 'nonsense' plus an invalid line, run repair --write. Only the invalid line is quarantined; the digest is re-baselined including the nonsense item; gw check then returns rc=0 reporting nothing wrong, and show/list happily display stage 'nonsense'. Fresh hand-edits ARE caught, so the hole is specifically anything out-of-band that predates the last repair. check must validate every item's stage against the stage vocabulary regardless of digest state - the tamper detector is currently blind to exactly the case repair exists for.","deps":[],"evidence":[{"text":"verified by driving the CLI: hook install and status both warn the guard probe failed on this guardless machine; a held item is refused advancement and moves after another actor approves; check rc=1 INVALID STAGE even after repair re-baselined the digest; a non-owner move is refused naming both lawful exits","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:51:58.690Z","updated":"2026-09-18T04:30:41.419Z"},{"id":"T-0072","title":"Claim exclusivity is enforced at claim and ignored at move","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:gates3","scope":"Verified: claim by agent:alpha, then a second claim by agent:beta is refused rc=1 offering --force - correct. But 'gw move T-0001 building --by agent:beta' succeeds rc=0 with the owner left as agent:alpha. requires.owner apparently means 'someone owns it' rather than 'you own it'. Either move should refuse a non-owner (offering the same --force escape claim does), or claim should stop pretending to be a lock.","deps":[],"evidence":[{"text":"verified by driving the CLI: hook install and status both warn the guard probe failed on this guardless machine; a held item is refused advancement and moves after another actor approves; check rc=1 INVALID STAGE even after repair re-baselined the digest; a non-owner move is refused naming both lawful exits","stage":"built"}],"notes":"[2026-09-18T03:55:27.294Z] DECISION (product owner): move refuses a non-owner, with the same --force escape claim offers.\n\nclaim already refuses a second claimant and names 'gw claim \u003cid> --force' as the way to take it over. move ignoring ownership entirely makes that refusal theatre. Either both enforce or neither should, and for a multi-agent tool the lock is worth having.\n\nImplement: gw move refuses when the item has an owner and the acting actor is not that owner (use sameOwner from lib/owner.js). The refusal must name the current owner and offer 'gw claim \u003cid> --force' to take it over first, which is the honest sequence - taking the work over is a recorded act, and then the move is yours. --force on move itself remains available as the deliberate one-off.\n\nAn unowned item is unaffected: anyone may move it, subject to the gates.","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:51:58.748Z","updated":"2026-09-18T04:30:41.480Z"},{"id":"T-0073","title":"A dropped dependency strands its dependents with no fix named","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:brief3","scope":"Verified: drop T-0002, and T-0003 shows 'waiting on T-0002 (dropped)' in both next and brief - correctly naming the blocker, but this is the one failure state in the product that prints no command to resolve it. The fix (gw edit T-0003 --deps '') has to be guessed. Everywhere else a refusal names a working next command; this state is the exception.","deps":[],"evidence":[{"text":"verified by driving the CLI: claimed+building now counts in flight while claimed-unmoved does not; finished count and pointer appear; --me filters every bucket; the stranded-dep command was run verbatim and preserved the live dep","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T03:51:58.807Z","updated":"2026-09-18T04:23:56.933Z"},{"id":"T-0074","title":"T-0067: hook install/status run the guard probe and warn loudly when it fails","phase":null,"priority":null,"type":null,"stage":"dropped","flag":null,"own external assets","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T04:14:49.742Z","updated":"2026-09-18T05:07:10.508Z"},{"id":"T-0083","title":"A parent reaches verified with its children untouched, and check calls the board clean","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:integrity","scope":"Verified: an epic with two children in backlog walked the full pipeline to verified. Evidence at built was literally 'trust me, children done' and was accepted; gw check then printed 'Board is clean.' The cheapest route to done is to finish the parent and abandon the children - precisely the shortcut this product exists to prevent. brief does show '· 2 open children', so the lie is visible but not prevented. DECISION: a parent must not enter a done-role stage while any child is open. Implement as a stage rule (children_done) so a board can opt out, default it on in templates/stages.json for the done stage, and have check report a verified parent with open children as a violation even on boards that predate the rule.","deps":[],"evidence":[{"text":"verified by driving the CLI: parent refused verified naming the open child and its stage; agent creator refused even with --force while a different human and a solo human both approve; the three-command laundering sequence now ends with check rc=1 OUT-OF-BAND WRITE and repair refusing to re-baseline","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:22:18.343Z","updated":"2026-09-18T06:03:10.976Z"},{"id":"T-0084","title":"release lets any actor silently drop another agent's claim","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:advice","scope":"Verified: an item owned by agent:alpha and in building was released by 'gw release --by agent:beta' with rc=0 and NO OUTPUT AT ALL; the owner became null. Meanwhile claim takeover by beta is refused rc=1 and demands --force. The front door is locked and the side door is open. DECISION: release refuses a non-owner the way move now does, names the current owner, and offers --force as the recorded override. It should also print a line on success - a silent state change to someone else's work is the wrong default.","deps":[],"evidence":[{"text":"verified by driving the CLI: the refusal's printed command was copied verbatim and succeeded; non-owner release refused naming both exits; claim discloses the hold in one line; tamper banner on brief and list with JSON left clean","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:22:18.401Z","updated":"2026-09-18T05:56:38.176Z"},{"id":"T-0085","title":"The triage self-approval guard advertises its own bypass","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:integrity","scope":"Verified: the creator cannot approve its own item (rc=1, correct), but the refusal ends with 'Pass --force to approve it yourself as a deliberate override' - and 'gw triage \u003cid> --approve --force' by that same creator succeeds, rc=0. So the only human-review gate in the product is defeated by the exact command its own refusal recommends, and templates/agents-block.md simultaneously says --force is 'never to get past a gate' and 'only when the refusal itself prints it'. An agent under deadline follows the printed hint. DECISION: triage exists to hold AGENT work for HUMAN review, so split the rule by actor kind - an agent:\u003cname> may never approve an item it created, with or without --force (its options are --drop, or wait for a human); a human:\u003cname> may approve their own item with no --force needed, because solo users exist and self-review is meaningless for them. Remove the --force hint from the agent-facing refusal so the product stops advertising a bypass it does not mean.","deps":[],"evidence":[{"text":"verified by driving the CLI: parent refused verified naming the open child and its stage; agent creator refused even with --force while a different human and a solo human both approve; the three-command laundering sequence now ends with check rc=1 OUT-OF-BAND WRITE and repair refusing to re-baseline","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:22:18.458Z","updated":"2026-09-18T06:03:11.039Z"},{"id":"T-0086","title":"gw repair launders tamper evidence: three commands turn a forged item into a clean board","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:integrity","scope":"Verified end to end. Hand-edit an item to verified with per-stage evidence tags that satisfy every cumulative gate; gw check correctly reports OUT-OF-BAND WRITE rc=1. Then append any corrupt line and run the remedy the tool itself recommends, gw repair --write: the digest is re-baselined, gw check returns rc=0 'Board is clean', and the forged item counts as verified. The remedy for corruption is also the launderer for tampering. Note the stage-rule cross-validation added for T-0071 does catch a SLOPPY forgery (wrong evidence tags), so this needs a careful forger - but three commands is not a high bar. DECISION: repair must not silently re-baseline a digest that was already stale for reasons it did not cause. After quarantining, if the remaining content still does not match the prior digest, repair must say so and refuse to re-baseline without --force, naming gw check.","deps":[],"evidence":[{"text":"verified by driving the CLI: parent refused verified naming the open child and its stage; agent creator refused even with --force while a different human and a solo human both approve; the three-command laundering sequence now ends with check rc=1 OUT-OF-BAND WRITE and repair refusing to re-baseline","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:26:59.182Z","updated":"2026-09-18T06:03:11.102Z"},{"id":"T-0087","title":"The evidence gate prints a command that does not work","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:advice","scope":"Verified: the refusal reads 'Needs at least two new pieces of evidence, distinct from anything already recorded: run gw move T-0001 verified --evidence \u003ce>'. Running exactly that with one --evidence produces the identical refusal. What works is repeating the flag: --evidence a --evidence b. The message never says so. This is the same defect class we fixed three times tonight (T-0039, T-0034, T-0041 - advice that does not fix what it claims), reintroduced by tonight's own evidence-gate fix, on the product's central gate. The printed command must be runnable as printed: show one --evidence per required piece, and match the plural in the sentence to the count.","deps":[],"evidence":[{"text":"verified by driving the CLI: the refusal's printed command was copied verbatim and succeeded; non-owner release refused naming both exits; claim discloses the hold in one line; tamper banner on brief and list with JSON left clean","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:26:59.247Z","updated":"2026-09-18T05:56:38.114Z"},{"id":"T-0088","title":"Only gw check knows the board was tampered with; every other surface reads normally","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:advice","scope":"After a hand-edit, check reports OUT-OF-BAND WRITE while brief lists normally with '0 blocked', list --stage verified presents the forged item as legitimate, and next says 'terminal stage' with no hint. Nothing points a user at check. brief and list should carry a one-line banner when the digest does not match - 'this board was modified outside gw; run gw check' - so the one surface that knows is not the one surface nobody runs.","deps":[],"evidence":[{"text":"verified by driving the CLI: the refusal's printed command was copied verbatim and succeeded; non-owner release refused naming both exits; claim discloses the hold in one line; tamper banner on brief and list with JSON left clean","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:26:59.305Z","updated":"2026-09-18T05:56:38.240Z"},{"id":"T-0089","title":"claim succeeds silently on a triage-held item while move refuses it","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:advice","scope":"gw claim on a needs-triage item returns rc=0 with no output and sets the owner, but gw move on the same item refuses naming the hold. That asymmetry was a deliberate decision (claiming unreviewed work is harmless and a useful signal), but claim should say the item is held rather than staying silent, or an agent claims it and only discovers the hold one command later. Related: with GW_ACTOR unset an agent silently becomes human:\u003cuser> and can then approve its own agent-created item, so the guard collapses exactly when an agent forgets the export - see T-0085.","deps":[],"evidence":[{"text":"verified by driving the CLI: the refusal's printed command was copied verbatim and succeeded; non-owner release refused naming both exits; claim discloses the hold in one line; tamper banner on brief and list with JSON left clean","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:26:59.365Z","updated":"2026-09-18T05:56:38.302Z"},{"id":"T-0090","title":"The board's error messages vanish before they can be read","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:viewer5","scope":"Verified by the round-4 web reviewer with a timing probe: clicking Approve on your own needs-triage item returns a 409 whose full text is 'item T-0121 was created by human:rahil, and needs-triage exists so someone else reviews it: you cannot approve your own item.' showPanelError writes it into #panel-error correctly - and then the next poll's renderPanel re-renders the panel and clears it, within about 1.2 seconds. A human needs roughly four seconds to read that sentence. A first probe at 1500ms found the element already empty, which is how the reviewer initially mistook it for 'the UI shows nothing'. So every refused write in the drawer is effectively silent. The move-refusal stage-reason boxes persist because they render from State.transitions, and the board drop toast persists; it is only panel errors that are wiped. Fix: a panel error must survive re-render until dismissed or superseded.","deps":[],"evidence":[{"text":"verified by driving the product: children_done checkboxes present per stage with verified checked and prose from describe.js; released mid-pipeline item drops out of in flight and appears under STRANDED; panel refusal measured at 6378ms across three 2.1s poll samples","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:47:11.099Z","updated":"2026-09-18T06:15:30.123Z"},{"id":"T-0091","title":"brief counts an abandoned item as in flight","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:viewer5","scope":"Verified: claim an item, move it to building, then release it. Owner becomes null, stage stays building, and gw brief still reports '1 in flight' with brief --json listing {stage: building, owner: null}. The T-0066 decision was explicit - an item with an OWNER in a non-initial non-terminal stage is in flight - so an unowned item in mid-pipeline is not in flight, it is abandoned work that nobody is doing. This is the inverse of the bug T-0066 fixed (it under-reported; now it over-reports) and it surfaced only because T-0084 gave release a success line worth reading. Consider whether an unowned mid-pipeline item deserves its own line in brief: it is arguably the most actionable state on the board and currently has no home.","deps":[],"evidence":[{"text":"verified by driving the product: children_done checkboxes present per stage with verified checked and prose from describe.js; released mid-pipeline item drops out of in flight and appears under STRANDED; panel refusal measured at 6378ms across three 2.1s poll samples","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T05:56:38.050Z","updated":"2026-09-18T06:15:30.063Z"},{"id":"T-0092","title":"The board's gate editor does not know about children_done","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:viewer5","scope":"test/viewer.test.js 'the gate builder edits exactly the rule keys lib/rules.js reads' fails: children_done was added to lib/rules.js and templates/stages.json but viewer/board.html's Stages and rules editor cannot set it. A user editing gates in the browser silently cannot turn the new rule on or off, and the board's rule list disagrees with the CLI's. This is the test doing its job - it exists to catch a rule added in one place and not the other.","deps":[],"evidence":[{"text":"verified by driving the product: children_done checkboxes present per stage with verified checked and prose from describe.js; released mid-pipeline item drops out of in flight and appears under STRANDED; panel refusal measured at 6378ms across three 2.1s poll samples","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:03:31.892Z","updated":"2026-09-18T06:15:30.001Z"},{"id":"T-0093","title":"check tells an agent to run a command the agent is now forbidden to run","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:triage","scope":"Verified on a 60-item all-agent board: gw check prints 'T-0001: run `gw triage T-0001 --approve` to clear the hold' for every untriaged item. An agent running exactly that gets rc=1 - 'held for needs-triage because it was created by agent:a and needs a different human' - because the T-0085 fix made agent self-approval impossible. check's advice was never updated to match, so the advice-that-does-not-work class is live again, caused by our own fix. check should name the command the CURRENT actor can actually run: for an agent looking at its own item that is --drop, or waiting for a human, not --approve.","deps":[],"evidence":[{"text":"verified: printed command pasted into a real shell released the hold and the item advanced; board POST /api/config saves unrelated settings (200) and releases holds when triage is turned off (released:1); agent B approves agent A's item; --approve never offered to a creator","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:27:48.312Z","updated":"2026-09-19T00:14:13.016Z"},{"id":"T-0094","title":"check does not truncate while brief does","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:round5","scope":"On a 60-item untriaged board gw check emits 61 lines and 6390 chars with one near-identical line per item and no truncation, while gw brief caps at 25 lines and prints '(+42 more)'. A reviewer measured 153 lines on a 157-item board. The two surfaces scale inconsistently, and check is the one an agent is told to run when something is wrong. Truncate it the way brief does, and state the per-item instruction once above the list rather than repeating a 100-char suffix per row.","deps":[],"evidence":[{"text":"verified by driving the product: repair's printed remedy runs verbatim and check goes clean; check truncates 61 lines to 28 with (+35 more); next leads with the triage hold; Escape closes the drawer 9769 chars to 0 and the create dialog 1346 to 0; Enter on Close works; Release present for the owner","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:27:48.369Z","updated":"2026-09-18T06:50:03.316Z"},{"id":"T-0095","title":"An all-agent session cannot finish its own work by any honest path","phase":null,"priority":"P0","type":"decision","stage":"built","flag":null,"owner":"agent:triage","scope":"Verified: agent:solo adds a plan item (auto-held needs-triage), then every route out is refused - move rc=1 (held), triage --approve rc=1 (own item), triage --approve --force rc=1, move --force rc=1. The item is permanently stuck in backlog. This is a direct consequence of the T-0085 decision I made tonight: agents may never approve their own items, --force included. That is right for a mixed human/agent team and wrong for this product's stated audience, which is coding agents. The only escapes are to impersonate a human via GW_ACTOR or to disable triage in config, and nothing names either. A reviewer following the agents block literally reported it could not complete a normal task without impersonation or force.","deps":[],"evidence":[{"text":"verified: printed command pasted into a real shell released the hold and the item advanced; board POST /api/config saves unrelated settings (200) and releases holds when triage is turned off (released:1); agent B approves agent A's item; --approve never offered to a creator","stage":"built"}],"notes":"[2026-09-18T06:29:01.825Z] DECISION NEEDED FROM ME, not an agent. Options as I see them:\n(a) triage_required_for defaults to [] rather than ['agent'], so the hold is opt-in for teams that want it. Capture stays frictionless and the all-agent case works out of the box; the cost is the hold protects nobody by default.\n(b) an agent may approve another AGENT's item, just never its own. Two agents on a board can proceed; a solo agent still cannot. Honest for multi-agent, still deadlocks the single-agent case that a user running one coding agent will hit first.\n(c) keep the rule and make the deadlock navigable: the refusal names the two real escapes (a human approves, or gw config triage_required_for '[]' turns the policy off) instead of leaving an agent to guess.\nLeaning (c) plus (b): the gate keeps meaning something, a second agent unblocks the common multi-agent case, and the solo case gets told exactly what to do rather than discovering a dead end. Wants Rahil's call because it changes what the product asserts about agent work.\n[2026-09-18T23:51:15.890Z] DECIDED 2026-09-18 (Rahil approved the recommended order; implementing my stated lean):\n1. An agent may approve ANOTHER agent's item, never its own. Two agents on a board can proceed without a human.\n2. The solo preset from T-0102.2 sets triage_required_for to [] - a single user with one agent gets no hold at all, which is where the deadlock actually bit. The team preset keeps the hold.\n3. Every triage refusal names the real ways forward: a human approves, a different agent approves, or turn the policy off with the exact gw config command. No dead end without a signpost.\n4. check, brief and next only ever advise a command the current actor can actually run (closes T-0093).\n5. T-0097 (env -u GW_ACTOR walks through): identity is self-asserted and the product must say so rather than imply a guarantee. Mitigations: record approver provenance visibly in show/brief, and best-effort detect a known agent harness in the environment - if one is present and the actor falls back to the default human, refuse the approval and tell the agent to set GW_ACTOR. Only if a reliable signal exists; otherwise warn, and document the limit.","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:29:01.704Z","updated":"2026-09-19T00:14:12.955Z"},{"id":"T-0096","title":"next and move disagree about why an item is stuck","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:round5","scope":"Verified: for a triage-held item, gw next prints 'building (blocked) - Someone must have claimed it' and never mentions the hold, while gw move on the same item refuses with 'held for triage'. next is the command the agents block tells an agent to run when unsure what is next, so it is the surface most likely to be trusted and currently the one that omits the real blocker.","deps":[],"evidence":[{"text":"verified by driving the product: repair's printed remedy runs verbatim and check goes clean; check truncates 61 lines to 28 with (+35 more); next leads with the triage hold; Escape closes the drawer 9769 chars to 0 and the create dialog 1346 to 0; Enter on Close works; Release present for the owner","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:29:01.767Z","updated":"2026-09-18T06:50:03.381Z"},{"id":"T-0097","title":"The triage guard punishes honesty and rewards omission","phase":null,"priority":"P0","type":"defect","stage":"built","flag":null,"owner":"agent:triage","scope":"Verified: an agent that identifies itself (GW_ACTOR=agent:codex) cannot approve its own item - correct. The SAME process running 'env -u GW_ACTOR gw triage T-0001 --approve' succeeds rc=0, because dropping the variable makes it human:rahil, and lib/commands/triage.js:33 only rejects agents and a human whose suffix matches the agent creator's name. So the guard blocks the agent that declares itself and waves through the one that does not. Combined with T-0095 (an honest all-agent session deadlocks with no route out) the incentive is exactly backwards: the cheapest way past the gate is to stop identifying yourself. Whatever policy we land on for T-0095, the check must not be defeatable by unsetting an environment variable - at minimum, an item created by agent:\u003cname> should require an approver that is not the same process, and if we cannot prove that, the product should say so rather than implying a guarantee.","deps":[],"evidence":[{"text":"verified by driving the CLI: team-preset agent A refused self-approval with --force and offered --approve zero times across check/brief/next; agent B approved and moved it with approved_by recorded; fresh repo with .claude/ wrote CLAUDE.md, chose solo, installed the hook, and an agent took an item backlog to done with no force, human or config edit","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:29:55.253Z","updated":"2026-09-19T00:04:34.385Z"},{"id":"T-0098","title":"repair prints a remedy that cannot run after its own preceding step","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:round5","scope":"Verified: hand-edit an item to verified, append a corrupt line, run 'gw repair --write'. It quarantines the line, refuses to re-baseline, and prints 'After deliberate review, run gw repair --write --force to re-baseline.' Running exactly that returns 'Board files are clean. Nothing to repair.' rc=0 and re-baselines nothing; gw check still reports OUT-OF-BAND WRITE. lib/commands/repair.js:101 returns early when no corrupt lines remain, so the --force path is only reachable while corruption is still present - which is never, after the step that printed the advice. This is the fifth instance tonight of the tool naming a fix that does not fix, and it is in the T-0086 fix written three hours ago.","deps":[],"evidence":[{"text":"verified by driving the product: repair's printed remedy runs verbatim and check goes clean; check truncates 61 lines to 28 with (+35 more); next leads with the triage hold; Escape closes the drawer 9769 chars to 0 and the create dialog 1346 to 0; Enter on Close works; Release present for the owner","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:29:55.314Z","updated":"2026-09-18T06:50:03.130Z"},{"id":"T-0099","title":"Escape no longer closes the item drawer","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:round5","scope":"Verified in Chromium with the real selector (#gw-panel): open a card, panel innerHTML is 9653 chars; press Escape; still 9653 chars. The handler exists at viewer/board.html:3504 - if (e.key === 'Escape') { closePanel(); hideBoardRefusal(); } - so it is wired but not firing, most likely a focus-target problem since the listener never receives the key. Round 3's web reviewer explicitly verified 'Escape closes both panel and create dialog and returns focus to the card', so this is a regression introduced by later work tonight: the glass restyle or the panel-error persistence change are the candidates. Enter on the focused Close button also does not close it.","deps":[],"evidence":[{"text":"verified by driving the product: repair's printed remedy runs verbatim and check goes clean; check truncates 61 lines to 28 with (+35 more); next leads with the triage hold; Escape closes the drawer 9769 chars to 0 and the create dialog 1346 to 0; Enter on Close works; Release present for the owner","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:35:20.002Z","updated":"2026-09-18T06:50:03.191Z"},{"id":"T-0100","title":"The board offers no way to release a claimed item","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"agent:round5","scope":"Verified: an item owned by human:rahil opened in the drawer offers x, Queue for an agent, the stage buttons, add evidence, save fields, add note - and no Release. The only way to hand work back is the CLI. This matters more after T-0084 hardened release so a non-owner cannot silently drop a claim: the guard got stricter while the board still offers the owner no honest path at all. Same shape as T-0095 - the gate tightened, the legitimate route did not appear.","deps":[],"evidence":[{"text":"verified by driving the product: repair's printed remedy runs verbatim and check goes clean; check truncates 61 lines to 28 with (+35 more); next leads with the triage hold; Escape closes the drawer 9769 chars to 0 and the create dialog 1346 to 0; Enter on Close works; Release present for the owner","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:35:20.064Z","updated":"2026-09-18T06:50:03.252Z"},{"id":"T-0101","title":"The test sweep only runs on a clean exit, so an interrupted run leaks every board","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"2041 /tmp/gw-* directories accumulated tonight between 00:03 and 02:47, each containing a .gatewright board. scripts/test.mjs sweeps after spawnSync returns, so any run killed by a signal - an agent interrupted, a provider dying, a TaskStop - skips the sweep entirely and leaks its ~347 boards. The P0-17 fix works for a clean run and does nothing for an interrupted one, which is the common case when agents drive the suite. Fix: install SIGINT/SIGTERM handlers that sweep before exiting, and additionally sweep at the START of a run for gw-*/gatewright-* dirs older than a threshold, so a leak from a crashed run is reclaimed by the next one rather than surviving forever. Inode usage reached only 4% here, so this is housekeeping rather than an outage - but it is the same defect that exhausted the tmpfs once already.","deps":[],"evidence":[{"text":"scripts/test.mjs gives each run its own TMPDIR/TEMP/TMP dir, sweeps it on exit and SIGINT/SIGTERM, reclaims >24h scratch at startup; two concurrent npm test runs both 772/772 (test/test-runner.test.js)","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T06:56:10.917Z","updated":"2026-09-19T14:07:22.969Z"},{"id":"T-0102","title":"Onboarding: a new user's first session works with no dead ends","phase":null,"priority":"P0","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"One command sets a project up correctly for however the user already works, and the first agent session completes real work without hitting a wall. Done when: a fresh user runs init, answers at most one question, and their agent can take a task from backlog to done on the board without impersonation, --force, or editing config.","deps":[],"evidence":[{"text":"all five children T-0102.1-.5 verified by driving the product; fresh-repo walk backlog to done with no dead end","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-18T23:51:03.787Z","updated":"2026-09-19T00:14:38.561Z"},{"id":"T-0102.1","title":"init writes agent instructions where each detected tool actually reads them","phase":null,"priority":"P0","type":"feature","stage":"built","flag":null,"owner":"agent:onboarding","scope":"Today init writes AGENTS.md and skips Claude, Cursor and Copilot when their files do not exist, so a Claude Code user can finish setup with an agent that never sees the rules. Detect the tools present (.claude/, CLAUDE.md, .cursor/, .github/copilot-instructions.md, etc.) and write the block where each reads it by default; say what was written.","deps":[],"evidence":[{"text":"verified by driving the CLI: team-preset agent A refused self-approval with --force and offered --approve zero times across check/brief/next; agent B approved and moved it with approved_by recorded; fresh repo with .claude/ wrote CLAUDE.md, chose solo, installed the hook, and an agent took an item backlog to done with no force, human or config edit","stage":"built"}],"notes":"","refs":[],"parent":"T-0102","created_by":"human:rahil","gh":null,"created":"2026-09-18T23:51:03.848Z","updated":"2026-09-19T00:04:34.440Z"},{"id":"T-0102.2","title":"init offers a pipeline that matches how the user works","phase":null,"priority":"P0","type":"feature","stage":"built","flag":null,"owner":"agent:onboarding","scope":"The shipped pipeline requires a GitHub PR URL to reach in_review, so a solo user, a commit-to-main user, or a non-GitHub user cannot get past built without editing stages.json. Offer presets - at minimum solo (no PR stage, no triage hold) and team (PR review, triage on) - chosen by one question, defaulting sensibly under --yes.","deps":[],"evidence":[{"text":"verified by driving the CLI: team-preset agent A refused self-approval with --force and offered --approve zero times across check/brief/next; agent B approved and moved it with approved_by recorded; fresh repo with .claude/ wrote CLAUDE.md, chose solo, installed the hook, and an agent took an item backlog to done with no force, human or config edit","stage":"built"}],"notes":"","refs":[],"parent":"T-0102","created_by":"human:rahil","gh":null,"created":"2026-09-18T23:51:03.905Z","updated":"2026-09-19T00:04:34.498Z"},{"id":"T-0102.3","title":"init installs enforcement by default instead of leaving it to a separate step","phase":null,"priority":"P1","type":"feature","stage":"built","flag":null,"owner":"agent:onboarding","scope":"The commit hook is the differentiator and currently a separate optional command most users will skip. init should install it (with a clear one-line explanation and how to remove it), and skip cleanly outside a git repo or with --no-hook.","deps":[],"evidence":[{"text":"verified by driving the CLI: team-preset agent A refused self-approval with --force and offered --approve zero times across check/brief/next; agent B approved and moved it with approved_by recorded; fresh repo with .claude/ wrote CLAUDE.md, chose solo, installed the hook, and an agent took an item backlog to done with no force, human or config edit","stage":"built"}],"notes":"","refs":[],"parent":"T-0102","created_by":"human:rahil","gh":null,"created":"2026-09-18T23:51:03.963Z","updated":"2026-09-19T00:04:34.559Z"},{"id":"T-0102.4","title":"init connects GitHub automatically when there is a remote and gh is authenticated","phase":null,"priority":"P1","type":"feature","stage":"built","flag":null,"owner":"agent:onboarding","scope":"Today GitHub linking needs --gh. If origin is a GitHub remote and gh auth status succeeds, offer or perform the link and a first sync; otherwise say how to do it later.","deps":[],"evidence":[{"text":"verified by driving the CLI: a GitHub origin selects the team pipeline and names gw init --gh; gw open finds a live server for this board on the serve default port or --port and falls back to the snapshot otherwise","stage":"built"}],"notes":"","refs":[],"parent":"T-0102","created_by":"human:rahil","gh":null,"created":"2026-09-18T23:51:04.025Z","updated":"2026-09-19T00:05:36.516Z"},{"id":"T-0102.5","title":"init ends on the live board, not a snapshot","phase":null,"priority":"P2","type":"feature","stage":"built","flag":null,"owner":"agent:onboarding","scope":"Two viewing concepts (gw open snapshot, gw serve live) confuse new users. init should end by pointing at, or starting, the live board, and gw open should prefer live when a server is reachable.","deps":[],"evidence":[{"text":"verified by driving the CLI: a GitHub origin selects the team pipeline and names gw init --gh; gw open finds a live server for this board on the serve default port or --port and falls back to the snapshot otherwise","stage":"built"}],"notes":"","refs":[],"parent":"T-0102","created_by":"human:rahil","gh":null,"created":"2026-09-18T23:51:04.084Z","updated":"2026-09-19T00:05:36.575Z"},{"id":"T-0095.1","title":"The triage refusal's 'turn off holds' advice does not unblock the held item","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"agent:triage2","scope":"Verified: an agent-created item on the team preset is refused with advice to run 'gw config policy.triage_required_for human'. Run verbatim: rc=0, new agent items stop being held, but the item that printed the advice is STILL needs-triage. Also 'gw config policy.triage_required_for []' is refused (the list validator demands non-empty strings), so there is no CLI way to turn the hold off at all - the solo preset only gets [] by writing config directly - and the advice substitutes 'human', which moves the hold onto human-created items rather than removing it. Fix: allow an empty list where empty is meaningful, print '[]' in the advice, and when the policy stops covering a creator kind, release existing holds for that kind (recorded as an event), so the printed command unblocks the item in front of you.","deps":[],"evidence":[{"text":"verified: printed command pasted into a real shell released the hold and the item advanced; board POST /api/config saves unrelated settings (200) and releases holds when triage is turned off (released:1); agent B approves agent A's item; --approve never offered to a creator","stage":"built"}],"notes":"","refs":[],"parent":"T-0095","created_by":"human:rahil","gh":null,"created":"2026-09-19T00:04:34.162Z","updated":"2026-09-19T00:14:12.893Z"},{"id":"T-0103","title":"Every refusal's printed command must be tested by running it verbatim","phase":null,"priority":"P1","type":"test","stage":"built","flag":null,"owner":"human:rahil","scope":"Six times tonight the product printed advice that did not fix the thing in front of the user (T-0039, T-0034, T-0041, T-0087, T-0098, T-0095.1). Each was caught only because a specific ticket demanded a run-it-verbatim test. Make it a standing test instead: enumerate the refusals the CLI can print (triage, move, claim, release, guard, repair, check, next), drive each into its refusal state on a scratch board, extract every backtick-quoted gw command from the text, run it through a real shell exactly as printed, and assert the refusal no longer applies. A new refusal should fail CI until it is covered.","deps":[],"evidence":[{"text":"test/refusal-advice.test.js 4/4: runs every refusal's printed advice through the platform shell and inventories 85 refusal constructors plus 7 rule emitters so an uncovered addition fails; found the dependency-advice defect","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T00:14:25.437Z","updated":"2026-09-19T13:45:22.368Z"},{"id":"T-0104","title":"The agent pre-edit hook blocks every edit when the gw on PATH is stale","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Verified in this repo: .claude/settings.json runs 'gw guard --pretool' before Edit/Write. The global gw here is 0.7.0 with no guard command, so the hook fails with \"unknown command 'guard'\" and Claude Code BLOCKS the edit - every edit, regardless of whether it is on the board. The commit-msg hook deliberately fails OPEN in the same situation (a stale tool must never make a repo uncommittable); the pre-edit hook fails CLOSED and makes the editor unusable. Make them consistent: when gw cannot answer 'guard --help', the pretool hook should step aside and say so once, and gw hook install --agent / status should warn about it the same way the commit hook now does (T-0067).","deps":[],"evidence":[{"text":"Installed PRETOOL_COMMAND driven under sh: stale gw (guard exits 2) -> rc 0, edits not blocked; current gw -> PreToolUse deny JSON for unclaimed edit (test/hook.test.js runs it on win32 via gw.cmd shim, no skips)","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T01:53:42.597Z","updated":"2026-09-19T14:07:22.906Z"},{"id":"T-0105","title":"On Windows a write fails with EPERM when a watching board has the file open","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Seen on windows-latest CI (flaky, timing-dependent): open.test.js 'gw open --watch debounces rapid changes' failed with EPERM: operation not permitted, rename '.gatewright/.digest.5716.tmp' -> '.gatewright/.digest' at writeAtomic (lib/store.js:62). store.js writes atomically via temp-file + rename; on Windows, renaming over a file another process holds open fails with EPERM/EACCES/EBUSY. gw open --watch and gw serve watch these files, so a CLI write racing a running board can fail with a raw EPERM - the everyday setup of an agent writing while a human watches the live board. Pre-existing, not introduced by onboarding. Fix: bounded retry of the rename on EPERM/EACCES/EBUSY with short backoff (zero deps), then surface a clear error if it still fails.","deps":[],"evidence":[{"text":"f092151: rename retry on EPERM/EACCES/EBUSY with a clear IOError on exhaustion; windows-latest 22 and 24 green","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T01:55:44.437Z","updated":"2026-09-19T02:04:44.653Z"},{"id":"T-0106","title":"Release v0.12.0","phase":null,"priority":"P0","type":"feature","stage":"built","flag":null,"owner":"human:rahil","scope":"Publish the four review rounds, onboarding, and the Windows fixes to npm. Done when: package.json and README say 0.12.0 with an accurate v0.12 section, CI is green on every platform, the tag is pushed, npm shows 0.12.0, and a fresh global install from the registry runs gw init and walks an item to done.","deps":[],"evidence":[{"text":"gatewright@0.12.0 on npm, tag v0.12.0; fresh registry install ran init and walked an item to done","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T02:08:22.912Z","updated":"2026-09-19T02:21:39.704Z"},{"id":"T-0107","title":"Cards say 'no agent run' for work agents are actively doing","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"On the live board, every in-flight card shows a 'no agent run' chip and a 'Queue for an agent' button, even while agents are working the item - because those reflect only Gatewright's built-in runner, and here the runner is off (runner.enabled false) and the agents run outside it. When the runner is disabled, the per-card run chip and Queue button are noise that contradicts reality; show them only when the runner is on, or phrase the chip so it cannot read as 'nobody is working on this'.","deps":[],"evidence":[{"text":"Viewer verified in browser: idle run chip and Queue hidden when runner off; queued card keeps Cancel (/tmp/gw-t0107-phone.png, /tmp/gw-t0107-desktop.png)","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T13:38:35.131Z","updated":"2026-09-19T13:52:06.072Z"},{"id":"T-0108","title":"In-flight cards do not show who owns the item","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"A Building card shows id, title, type, run chip and ev:N, but not its owner. For in-flight work the owner is the most important fact - it is what 'in flight' means. Show the owner on every card that has one.","deps":[],"evidence":[{"text":"Viewer verified: owner chip renders as 'agent · codex' on cards; header flagged count includes only open items (test/viewer.browser.test.js)","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T13:38:35.192Z","updated":"2026-09-19T13:52:22.626Z"},{"id":"T-0109","title":"The header 'flagged' count includes finished work with stale triage holds","phase":null,"priority":null,"type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"The live board header says '9 flagged' with 4 open items; all 9 are built or dropped items still carrying needs-triage from before holds were cleared on terminal entry. A flag on finished work is not a problem anyone needs to act on. Count only open items, and have gw repair or check offer to clear stale holds on finished items.","deps":[],"evidence":[{"text":"Stale terminal needs-triage holds cleared by gw repair --write on team (dropped) and solo (done) scratch boards; flag null afterwards (test/repair.test.js, test/check.test.js)","stage":"built"}],"notes":"","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T13:38:35.254Z","updated":"2026-09-19T13:52:22.692Z"},{"id":"T-0110","title":"The live board may not recover after its server restarts","phase":null,"priority":null,"type":"defect","stage":"dropped","flag":null,"owner":null,"scope":"After gw serve was restarted, a phone with the board open showed 'live - reconnecting (Load failed)' while the new server was up and answering 200. Verify in a real browser: open the board, stop and restart the server, and confirm the page reconnects on its own within a few polls. If it stays stuck, fix the reconnect.","deps":[],"evidence":[],"notes":"[2026-09-19T13:38:55.087Z] Not a defect: the phone board showed 'reconnecting (Load failed)' only during the gap while gw serve was restarted, then recovered on its own to 'live - updated 6s ago' within about a minute, with no refresh (Rahil's screenshot, 09:38).","refs":[],"parent":null,"created_by":"human:rahil","gh":null,"created":"2026-09-19T13:38:35.320Z","updated":"2026-09-19T13:38:55.209Z"},{"id":"T-0111","title":"The dependency refusal prints a placeholder id it already knows, and omits the evidence the move needs","phase":null,"priority":"P1","type":"defect","stage":"built","flag":null,"owner":"human:rahil","scope":"Verified: 'built: dependencies must be at least built: T-0001. Move them with gw move \u003cid> built.' The refusal names T-0001 and then prints \u003cid>; run verbatim it fails 'unknown item: \u003cid>'. With the id filled in, it still fails, because the dependency's own built gate needs evidence, which the advice omits. Print the real id(s), and route the advice through the same helper that builds runnable evidence advice (T-0087), so the command works as printed. Found by T-0103's standing test, which currently works around it by substituting the placeholder and running commands in dependency-first order - once fixed, drop that substitution so the test enforces it.","deps":[],"evidence":[{"text":"Dependency refusal names real ids with per-dependency runnable commands; drove on scratch boar
