type":"add","item":"T-0032","by":"human:rahil","parent":null},{"ts":"2026-09-18T01:56:31.001Z","type":"add","item":"T-0033","by":"human:rahil","parent":null},{"ts":"2026-09-18T01:56:31.060Z","type":"add","item":"T-0034","by":"human:rahil","parent":null},{"ts":"2026-09-18T01:56:31.125Z","type":"add","item":"T-0035","by":"human:rahil","parent":null},{"ts":"2026-09-18T01:56:31.189Z","type":"add","item":"T-0036","by":"human:rahil","parent":null},{"ts":"2026-09-18T01:56:31.249Z","type":"add","item":"T-0037","by":"human:rahil","parent":null},{"ts":"2026-09-18T01:58:32.829Z","type":"note","item":"T-0029","by":"human:rahil","note":"ESCALATED after driving it myself. The duplicate-counting is a symptom; the structural defect is that evidence_min counts the item's LIFETIME evidence array (lib/rules.js:34), not evidence supplied for this move. In the shipped templates/stages.json: built requires evidence_min 1, in_review requires a PR link (adding a 2nd entry), verified requires evidence_min 2. So by the time an item reaches verified it ALWAYS has >=2 entries. Verified accepted the move with NO new evidence, rc=0. The final gate of the default pipeline cannot fail in any normal walk - it is dead code as shipped. evidence_match has the same shape (rules.js:44 .some() over lifetime evidence), so a PR link supplied once satisfies every later evidence_match stage forever. Fix must decide per-move vs cumulative semantics, not just de-duplicate."},{"ts":"2026-09-18T01:58:37.151Z","type":"edit","item":"T-0029","by":"human:rahil","fields":["title"]},{"ts":"2026-09-18T01:59:47.374Z","type":"note","item":"T-0029","by":"human:rahil","note":"DECISION (product owner): evidence_min and evidence_match take PER-MOVE semantics, not lifetime.\n\nWhy not the cheaper fix. De-duplicating the lifetime array fixes the symptom and leaves the defect: built(1) + in_review(PR link) already puts 2 DISTINCT entries on the item, so verified's evidence_min 2 stays pre-satisfied. Any fix that still counts lifetime evidence leaves the last gate dead.\n\nWhat a gate means. Standing in stage N asserts 'the evidence for N exists'. Verification evidence is categorically not the commit that satisfied built - it is a test run, a deploy check, a reviewer's sign-off. A threshold that an earlier stage already met is not a gate, it is decoration.\n\nSemantics: evidence_min N = at least N distinct entries supplied WITH THIS MOVE. evidence_match = at least one entry supplied WITH THIS MOVE matches the pattern. Distinct means after trimming and exact de-duplication against both the other entries in this move and the entries already on the item.\n\nData shape: item.evidence becomes entries carrying the stage they were supplied for, so the board can show what justified each gate and so this rule is checkable after the fact. Existing flat strings migrate with stage null. Breaking change, and migrations are in scope.\n\nConsequence accepted: forcing an item backward and re-moving it forward will demand fresh evidence. That is correct - if the work was redone, the old evidence no longer describes it.\n\nStages with an empty requires block (reviewed, merged in the shipped template) are unaffected and still advance by hand; that is a separate question about whether the default pipeline asks for enough, filed separately."},{"ts":"2026-09-18T01:59:47.434Z","type":"add","item":"T-0038","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:04:07.577Z","type":"add","item":"T-0039","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:04:07.628Z","type":"add","item":"T-0040","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:04:07.683Z","type":"add","item":"T-0041","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:04:07.742Z","type":"add","item":"T-0042","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:04:07.795Z","type":"add","item":"T-0043","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:04:07.852Z","type":"add","item":"T-0044","by":"human:rahil","parent":null},{"ts":"2 "T-0055","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:41:36.403Z","type":"add","item":"T-0056","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:41:36.456Z","type":"add","item":"T-0057","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:41:36.516Z","type":"add","item":"T-0058","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:41:36.574Z","type":"add","item":"T-0059","by":"human:rahil","parent":null},{"ts":"2026-09-18T02:41:38.293Z","type":"claim","item":"T-0038.1","by":"agent:opencode"},{"ts":"2026-09-18T02:41:38.349Z","type":"claim","item":"T-0052.1","by":"agent:opencode"},{"ts":"2026-09-18T02:41:38.412Z","type":"claim","item":"T-0053.1","by":"agent:opencode"},{"ts":"2026-09-18T02:41:38.472Z","type":"claim","item":"T-0053.2","by":"agent:opencode"},{"ts":"2026-09-18T02:45:07.573Z","type":"note","item":"T-0036","by":"human:rahil","note":"DECISION (product owner): triage must refuse self-approval.\n\nThe hold exists to keep unreviewed agent-created work off the scheduler until a human looks at it. Today gw triage \u003cid> --approve succeeds for the same actor that created the item, so the reviewed party reviews itself and the hold gates nobody.\n\nFix: refuse --approve when the approving actor matches created_by (use sameOwner from lib/owner.js so human:rahil and rahil are the same person). The refusal must name who created it and say that someone else must approve, or that --force is the deliberate override. --drop stays available to the creator: discarding your own work needs no second pair of eyes.\n\nAlso: brief shows NEEDS TRIAGE rows with no instruction attached, and the agents block never mentions triage at all. Whatever brief prints for those rows must name the command that clears them, the same way check now does."},{"ts":"2026-09-18T02:45:07.628Z","type":"note","item":"T-0028","by":"human:rahil","note":"DECISION (product owner): guard accepts a commit that names any real item, and warns rather than refuses when that item is already finished.\n\nGuard's question is 'is this change accounted for on the board'. An item that is built IS accounted for. Requiring it to be in flight conflates 'accounted for' with 'in progress', and leaves --no-verify - which disables the check entirely - as the only path for a rollup commit. A check whose only escape hatch is to turn it off will get turned off habitually, and then it protects nothing.\n\nFix: refuse only when nothing is named and nothing is claimed, or when the named id does not exist on the board. When the named item exists but is finished, pass with a one-line warning naming the item and its stage. Multiple ids in one message: all must exist; warn for each finished one."},{"ts":"2026-09-18T02:45:07.685Z","type":"note","item":"T-0048","by":"human:rahil","note":"DECISION (product owner): add gw repair, so the tool's worst failure has a supported remedy.\n\nToday a malformed items.jsonl prints 'Repair it by hand or restore it from git' while brief prints 'Never edit .gatewright/ by hand' and the agents block forbids it outright. The only remedy is the one action every other surface prohibits.\n\ngw repair must: validate every line of items.jsonl and events.jsonl; report each bad line with its number and what is wrong; move unparseable lines to .gatewright/quarantine.jsonl rather than deleting them; re-baseline the digest afterwards so the repair does not read as tampering; and print what it did. Default to a dry run, requiring --write to change anything. Then the corrupt-board message points at gw repair instead of at hand-editing."},{"ts":"2026-09-18T02:45:21.340Z","type":"move","item":"T-0038.1","from":"backlog","to":"building","by":"agent:opencode","evidence":[]},{"ts":"2026-09-18T02:45:21.402Z","type":"move","item":"T-0052.1","from":"backlog","to":"building","by":"agent:opencode","evidence":[]},{"ts":"2026-09-18T02:45:21.462Z","type":"move","item":"T-0053.1","from":"backlog","to":"building","by":"agent:opencode","evidence":[]},{"ts":"2026-09-18T02: man:rahil","parent":null},{"ts":"2026-09-18T03:51:58.751Z","type":"add","item":"T-0072","by":"human:rahil","parent":null},{"ts":"2026-09-18T03:51:58.810Z","type":"add","item":"T-0073","by":"human:rahil","parent":null},{"ts":"2026-09-18T03:55:27.243Z","type":"note","item":"T-0068","by":"human:rahil","note":"DECISION (product owner): the hold blocks ADVANCEMENT, not capture or claiming.\n\nneeds-triage means 'captured but not yet accepted onto the board'. Two independent reviewers found it blocks nothing except triage --approve itself, while the agents block and brief both describe it as a hold someone must lift.\n\nImplement: gw move refuses to advance a needs-triage item PAST the initial stage, naming the flag, who created it, and that someone other than the creator must run gw triage \u003cid> --approve. --force remains the recorded override, as everywhere else.\n- claim stays allowed: taking responsibility for unreviewed work is harmless and is a useful signal.\n- moves to side stages (dropped, paused) stay allowed: discarding or parking unreviewed capture needs no ceremony.\n- the flag must also not survive into a terminal stage. A verified item sitting in the brief's NEEDS TRIAGE list is nonsense; approving is implied once the work has been through the pipeline. Clear it on entry to a terminal stage if it somehow persists.\n\nThis keeps capture frictionless - the whole point of 'rigor at the evidence gate, not the capture gate' - while making the hold mean something."},{"ts":"2026-09-18T03:55:27.298Z","type":"note","item":"T-0072","by":"human:rahil","note":"DECISION (product owner): move refuses a non-owner, with the same --force escape claim offers.\n\nclaim already refuses a second claimant and names 'gw claim \u003cid> --force' as the way to take it over. move ignoring ownership entirely makes that refusal theatre. Either both enforce or neither should, and for a multi-agent tool the lock is worth having.\n\nImplement: gw move refuses when the item has an owner and the acting actor is not that owner (use sameOwner from lib/owner.js). The refusal must name the current owner and offer 'gw claim \u003cid> --force' to take it over first, which is the honest sequence - taking the work over is a recorded act, and then the move is yours. --force on move itself remains available as the deliberate one-off.\n\nAn unowned item is unaffected: anyone may move it, subject to the gates."},{"ts":"2026-09-18T03:55:27.352Z","type":"claim","item":"T-0067","by":"agent:gates3"},{"ts":"2026-09-18T03:55:27.409Z","type":"move","item":"T-0067","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:27.463Z","type":"claim","item":"T-0068","by":"agent:gates3"},{"ts":"2026-09-18T03:55:27.519Z","type":"move","item":"T-0068","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:27.575Z","type":"claim","item":"T-0071","by":"agent:gates3"},{"ts":"2026-09-18T03:55:27.632Z","type":"move","item":"T-0071","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:27.685Z","type":"claim","item":"T-0072","by":"agent:gates3"},{"ts":"2026-09-18T03:55:27.739Z","type":"move","item":"T-0072","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:27.793Z","type":"claim","item":"T-0066","by":"agent:brief3"},{"ts":"2026-09-18T03:55:27.851Z","type":"move","item":"T-0066","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:27.901Z","type":"claim","item":"T-0069","by":"agent:brief3"},{"ts":"2026-09-18T03:55:27.959Z","type":"move","item":"T-0069","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:28.013Z","type":"claim","item":"T-0070","by":"agent:brief3"},{"ts":"2026-09-18T03:55:28.070Z","type":"move","item":"T-0070","from":"backlog","to":"building","by":"human:rahil","evidence":[]},{"ts":"2026-09-18T03:55:28.125Z","type":"claim","item":"T-0073","by":"a
