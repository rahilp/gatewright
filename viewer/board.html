<!-- gatewright board v1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gatewright</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f3;
    --bg-raised: #ffffff;
    --bg-sunken: #ececea;
    --border: #d8d8d4;
    --text: #1a1a18;
    --text-dim: #63635c;
    --text-faint: #93938a;
    --accent: #1c5d8c;
    --accent-bg: #e4eef6;
    --danger: #9c3b28;
    --danger-bg: #f6e6e2;
    --warn: #8a6a1d;
    --warn-bg: #f6efdd;
    --ok: #2c6e3f;
    --ok-bg: #e5f1e8;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --bg-raised: #1f2124;
      --bg-sunken: #131415;
      --border: #33363a;
      --text: #e7e7e4;
      --text-dim: #a3a39c;
      --text-faint: #6e6e68;
      --accent: #6badde;
      --accent-bg: #1d3245;
      --danger: #e0806e;
      --danger-bg: #3a231f;
      --warn: #d8b458;
      --warn-bg: #3a3220;
      --ok: #7fc394;
      --ok-bg: #1f3527;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--sans);
    min-height: 100vh;
  }
  code, .mono, .ids, td.id, td.evidence, .evidence-list, .event-line time { font-family: var(--mono); }
  a { color: var(--accent); }
  button, select, input {
    font: inherit;
    color: inherit;
  }
  header#gw-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  header#gw-header h1 {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }
  header#gw-header .meta { color: var(--text-dim); font-size: 0.82rem; }
  header#gw-header .totals { display: flex; gap: 0.9rem; margin-left: auto; font-size: 0.82rem; color: var(--text-dim); }
  header#gw-header .totals b { color: var(--text); }
  .snapshot-pill {
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    border-radius: 1rem;
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn);
    white-space: nowrap;
  }
  .live-pill {
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    border-radius: 1rem;
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok);
    white-space: nowrap;
  }
  nav#gw-tabs {
    display: flex;
    gap: 0.25rem;
    padding: 0.4rem 1.25rem 0;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav#gw-tabs button {
    background: none;
    border: none;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  nav#gw-tabs button:hover { color: var(--text); }
  nav#gw-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  #gw-filters {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    padding: 0.6rem 1.25rem;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
  }
  #gw-filters select, #gw-filters input[type="search"] {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
  }
  #gw-filters input[type="search"] { min-width: 14rem; flex: 1 1 14rem; }
  #gw-filters .clear-filters {
    background: none;
    border: 1px solid var(--border);
    border-radius: 0.35rem;
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    cursor: pointer;
  }

  main#gw-view { padding: 1.1rem 1.25rem 3rem; }

  /* Overview */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .overview-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.9rem 1rem;
    box-shadow: var(--shadow);
  }
  .overview-card h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 0.6rem; }
  .count-row { display: flex; justify-content: space-between; padding: 0.2rem 0; font-size: 0.85rem; border-bottom: 1px dashed var(--border); }
  .count-row:last-child { border-bottom: none; }
  .count-row .bar { flex: 1; margin: 0 0.6rem; background: var(--bg-sunken); border-radius: 0.2rem; overflow: hidden; height: 0.5rem; align-self: center; }
  .count-row .bar span { display: block; height: 100%; background: var(--accent); }

  /* Board */
  #board { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; align-items: flex-start; }
  .column {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    min-width: 240px;
    max-width: 260px;
    flex: 0 0 auto;
  }
  .column-head {
    padding: 0.55rem 0.7rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: var(--bg-raised);
    border-radius: 0.5rem 0.5rem 0 0;
  }
  .column-head .count { color: var(--text-faint); font-weight: 400; }
  .column-body { padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; min-height: 2rem; }
  .card {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    padding: 0.5rem 0.6rem;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .card:hover { border-color: var(--accent); }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: 0.4; cursor: grabbing; }
  /* While a drag is in flight the columns say which of them would accept it.
     An invalid column is dimmed and carries the refusal as its tooltip; the
     drop itself is refused by dragover, not by the server round trip. */
  #board.dragging .column { transition: opacity 0.1s ease; }
  #board.dragging .column.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
  #board.dragging .column.drop-ok.drop-over { background: var(--accent-bg); }
  #board.dragging .column.drop-invalid { opacity: 0.4; cursor: not-allowed; }
  #board.dragging .column.drop-invalid .column-head::after { content: '✕'; color: var(--text-faint); margin-left: 0.35rem; }
  #board.dragging .column.drop-source { outline: 1px dashed var(--border); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { #board.dragging .column { transition: none; } }
  #gw-drop-refusal {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 120;
    max-width: 26rem;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 0.5rem;
    padding: 0.6rem 1.6rem 0.6rem 0.75rem;
    box-shadow: var(--shadow);
    font-size: 0.8rem;
  }
  #gw-drop-refusal h4 { margin: 0 0 0.3rem; font-size: 0.8rem; }
  #gw-drop-refusal ul { margin: 0; padding-left: 1.1rem; }
  #gw-drop-refusal .close-btn { position: absolute; top: 0.15rem; right: 0.4rem; background: none; border: none; color: inherit; cursor: pointer; font-size: 1rem; line-height: 1; }
  .card.card-child { margin-left: 0.8rem; border-left: 3px solid var(--border); }
  .card.card-moved { animation: card-moved 1.6s ease-out; }
  @keyframes card-moved { from { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); } to { border-color: var(--border); box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .card.card-moved { animation: none; border-color: var(--accent); } }
  .card .card-id { font-family: var(--mono); font-size: 0.74rem; color: var(--text-dim); }
  .card .card-title { margin: 0.15rem 0 0.35rem; font-weight: 500; }
  .card .card-meta { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; font-size: 0.7rem; color: var(--text-dim); }
  .tag {
    display: inline-block;
    padding: 0.05rem 0.35rem;
    border-radius: 0.25rem;
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }
  .tag.flag-blocked, .tag.flag-conflict { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
  .tag.flag-needs-triage, .tag.flag-paused { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }

  /* Table */
  table.gw-table { width: 100%; border-collapse: collapse; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; }
  table.gw-table th, table.gw-table td { text-align: left; padding: 0.45rem 0.65rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  table.gw-table th { cursor: pointer; user-select: none; color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  table.gw-table th.sorted { color: var(--text); }
  table.gw-table tbody tr:hover { background: var(--bg-sunken); cursor: pointer; }
  table.gw-table td.id { white-space: nowrap; }

  /* Stages & rules */
  .stage-rule {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    margin-bottom: 0.6rem;
  }
  .stage-rule h3 { margin: 0 0 0.25rem; font-size: 0.88rem; }
  .stage-rule .exit { color: var(--text-dim); font-size: 0.82rem; margin: 0 0 0.4rem; }
  .stage-rule .requires { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim); white-space: pre-wrap; margin: 0.35rem 0 0; }
  .stage-rule .flags { font-size: 0.72rem; color: var(--text-faint); margin-top: 0.3rem; }
  /* The sentences are the point of this view; the JSON is the footnote. */
  .stage-rule .gate-sentences { margin: 0.3rem 0 0.45rem; padding-left: 1.1rem; font-size: 0.85rem; }
  .stage-rule .gate-sentences li { margin: 0.12rem 0; }
  .stage-rule .gate-missing { font-size: 0.82rem; color: var(--text-dim); margin: 0.3rem 0 0.45rem; }
  details.machine-rule { margin-top: 0.35rem; }
  details.machine-rule > summary { cursor: pointer; font-size: 0.72rem; color: var(--text-faint); }
  details.machine-rule ul { margin: 0.3rem 0 0; padding-left: 1.1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim); }

  /* Export */
  .export-panel { max-width: 40rem; }
  .export-panel button { background: var(--accent); color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 0.4rem; cursor: pointer; font-size: 0.85rem; }

  /* Empty state */
  #gw-empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-dim);
  }
  #gw-empty h2 { color: var(--text); }
  #gw-empty code { background: var(--bg-sunken); padding: 0.1rem 0.4rem; border-radius: 0.3rem; }

  /* Item panel (drawer) */
  #gw-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    display: none;
    z-index: 100;
  }
  #gw-overlay.open { display: block; }
  #gw-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(480px, 100vw);
    background: var(--bg-raised);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.15s ease;
    z-index: 101;
    padding: 1rem 1.25rem 2.5rem;
  }
  #gw-overlay.open #gw-panel { transform: translateX(0); }
  #gw-panel .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  #gw-panel h2 { margin: 0; font-size: 1.05rem; }
  #gw-panel .close-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-dim); }
  #gw-panel .readonly-banner {
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 0.4rem;
    padding: 0.5rem 0.7rem;
    font-size: 0.78rem;
    margin: 0.6rem 0;
  }
  #gw-panel .readonly-banner code { font-family: var(--mono); }
  #gw-panel dl { display: grid; grid-template-columns: 6.5rem 1fr; gap: 0.3rem 0.6rem; font-size: 0.82rem; margin: 0.8rem 0; }
  #gw-panel dt { color: var(--text-dim); }
  #gw-panel dd { margin: 0; }
  #gw-panel .stage-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; align-items: flex-start; }
  #gw-panel .stage-button-wrap { display: flex; flex-direction: column; gap: 0.2rem; max-width: 13rem; }
  #gw-panel .stage-buttons button {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    border-radius: 0.35rem;
    padding: 0.3rem 0.55rem;
    font-size: 0.76rem;
    color: var(--text-faint);
    cursor: not-allowed;
  }
  #gw-panel .stage-buttons button:not([disabled]) {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    cursor: pointer;
  }
  #gw-panel .stage-reason { font-size: 0.72rem; color: var(--text-dim); }
  #gw-panel .stage-reason .reason-head { display: block; color: var(--text-faint); }
  #gw-panel .stage-reason ul { margin: 0.1rem 0 0; padding-left: 1rem; }
  #gw-panel .stage-reason li { margin: 0.1rem 0; }
  #gw-panel .stage-refusal:empty { display: none; }
  .refusal {
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 0.35rem;
    padding: 0.35rem 0.55rem;
    font-size: 0.76rem;
    margin: 0.3rem 0;
    font-family: var(--mono);
  }
  #gw-panel h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 1rem 0 0.35rem; }
  #gw-panel .event-line { display: flex; gap: 0.5rem; font-size: 0.76rem; padding: 0.2rem 0; border-bottom: 1px dashed var(--border); }
  #gw-panel .event-line time { color: var(--text-faint); white-space: nowrap; }
  #gw-panel .panel-actions { margin: 0.6rem 0; }
  #gw-panel .panel-actions button {
    border: 1px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 0.35rem;
    padding: 0.35rem 0.7rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #gw-panel .evidence-list { list-style: none; margin: 0.3rem 0; padding: 0; }
  #gw-panel .evidence-list li.evidence-chip { font-family: var(--mono); font-size: 0.78rem; padding: 0.15rem 0; }
  #gw-panel .evidence-add, #gw-panel .note-add { display: flex; gap: 0.4rem; margin: 0.4rem 0 0.8rem; }
  #gw-panel .evidence-add input, #gw-panel .note-add textarea {
    flex: 1;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
  }
  #gw-panel .evidence-add button, #gw-panel .note-add button, #gw-panel #save-fields-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 0.35rem;
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
    cursor: pointer;
    align-self: flex-start;
  }
  #gw-panel dd input { width: 100%; background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text); border-radius: 0.3rem; padding: 0.2rem 0.4rem; font-size: 0.8rem; }
  #gw-panel .field-refusal:empty { display: none; }
  #gw-panel .notes-body { white-space: pre-wrap; font-size: 0.8rem; background: var(--bg-sunken); border-radius: 0.35rem; padding: 0.5rem 0.6rem; margin: 0.3rem 0; }
  #gw-panel .run-log { white-space: pre-wrap; word-break: break-word; font-size: 0.74rem; background: var(--bg-sunken); border-radius: 0.35rem; padding: 0.5rem 0.6rem; margin: 0.3rem 0; max-height: 16rem; overflow-y: auto; }
  #gw-panel .panel-actions.triage button { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  #gw-panel #panel-error:empty { display: none; }
  .create-form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
  .create-form label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.78rem; color: var(--text-dim); }
  .create-form input, .create-form select, .create-form textarea {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.35rem 0.5rem;
    font-size: 0.85rem;
  }
  .create-form button[type="submit"] {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 0.4rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.85rem;
    cursor: pointer;
    align-self: flex-start;
  }
  .card-actions { margin-top: 0.4rem; }
  .card-actions button {
    border: 1px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 0.3rem;
    padding: 0.15rem 0.5rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .tag.badge-queued { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
  /* "Nothing is running" is information, not an absence: it gets a chip of its
     own so a card never leaves the question open. */
  .tag.badge-idle { color: var(--text-faint); border-style: dashed; }
  /* A Play that can only queue must not look like a Play that starts work. */
  .card-actions button.secondary, #gw-panel .panel-actions button.secondary {
    border-color: var(--border);
    background: var(--bg-sunken);
    color: var(--text-dim);
  }
  /* Running must be visually distinct from queued: one is costing money right
     now, the other is waiting for a scheduler tick. */
  .tag.badge-running { color: #7ee787; border-color: #2ea043; background: rgba(46,160,67,0.15); }
  #gw-pause-btn {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.25rem 0.6rem;
    font-size: 0.78rem;
    cursor: pointer;
  }
  #gw-pause-banner {
    background: var(--warn-bg);
    color: var(--warn);
    border-bottom: 1px solid var(--warn);
    padding: 0.45rem 1.25rem;
    font-size: 0.82rem;
    text-align: center;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header id="gw-header">
    <h1>gatewright</h1>
    <span class="meta" id="gw-snapshot-meta"></span>
    <span class="totals" id="gw-totals"></span>
    <button id="gw-pause-btn" class="hidden"></button>
  </header>
  <div id="gw-pause-banner" class="hidden" role="status"></div>

  <nav id="gw-tabs">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="board">Board</button>
    <button data-view="table">Table</button>
    <button data-view="stages">Stages &amp; rules</button>
    <button data-view="export">Export</button>
  </nav>

  <div id="gw-filters">
    <select id="f-phase"><option value="">phase: all</option></select>
    <select id="f-gate"><option value="">gate: all</option></select>
    <select id="f-type"><option value="">type: all</option></select>
    <select id="f-stage"><option value="">stage: all</option></select>
    <select id="f-flag"><option value="">flag: all</option></select>
    <input type="search" id="f-search" placeholder="search id / title / scope">
    <button class="clear-filters" id="f-clear">clear</button>
    <button class="clear-filters hidden" id="f-new">+ new item</button>
  </div>

  <main id="gw-view"></main>

  <div id="gw-empty" class="hidden">
    <h2>No items yet</h2>
    <p>Add your first item with <code>gw add "&lt;title&gt;"</code>, then <code>gw open</code> again to refresh this snapshot.</p>
  </div>

  <div id="gw-overlay">
    <div id="gw-panel" role="dialog" aria-label="Item detail"></div>
  </div>

  <div id="gw-drop-refusal" class="hidden" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  function readBlock(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const text = el.textContent.trim();
    if (!text) return null;
    try { return JSON.parse(text); } catch { return null; }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function stageList(stages) { return [...(stages.stages || []), ...(stages.extra || [])]; }
  function nextStageId(stages, id) {
    const i = (stages.stages || []).findIndex((s) => s.id === id);
    return i >= 0 ? (stages.stages[i + 1] ? stages.stages[i + 1].id : null) : null;
  }

  const STAGE_LABEL_FALLBACK = (id) => id;

  const State = {
    items: [], events: [], stages: { stages: [], extra: [] }, config: {}, sync: { status: 'off' }, generatedAt: null, live: false,
    runs: [], scheduler: { status: 'disabled' },
    lastLiveUpdate: null, liveError: null, pollingDelay: 2000, activePanelId: null,
    transitions: {}, transitionLoading: {}, transitionErrors: {},
    runLogs: {}, runLogLoading: {}, runLogErrors: {},
    view: 'overview',
    filters: { phase: '', gate: '', type: '', stage: '', flag: '', search: '' },
    sort: { key: 'updated', dir: 'desc' },
    pendingEvidence: {},
    creatingItem: false,
    drag: null,
  };

  // -- write path: every request goes through /api/*, then the existing poll
  // loop re-fetches /api/state. There is no second state model.
  const Inflight = new Set();
  let pollTimer = null;

  function schedulePoll(delay) {
    if (pollTimer) window.clearTimeout(pollTimer);
    pollTimer = window.setTimeout(poll, delay);
  }

  async function refreshNow() {
    if (pollTimer) { window.clearTimeout(pollTimer); pollTimer = null; }
    await poll();
  }

  async function apiWrite(path, body) {
    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      let data = null;
      try { data = await res.json(); } catch { /* no body */ }
      return { ok: res.ok, status: res.status, data };
    } catch (error) {
      return { ok: false, status: 0, data: { error: error.message || 'network error' } };
    }
  }

  // Mirrors isTerminalStage in lib/stages.js, and is the ONLY place this page
  // decides what "terminal" means. The viewer previously consulted only
  // stages.terminal, so a pipeline whose finish line is declared with
  // `role: "done"` -- which is what `gw init` now writes for trunk workflows --
  // had its finished column treated as ongoing: every completed card offered a
  // Play button with nothing left to play, and the header counted 109 items
  // "open" on a board `gw brief` reported 6 open for. Two notions of terminal
  // in one file is how that happened, so there is now one. Nothing else may
  // read that list directly; test/viewer.test.js enforces it.
  function terminalStageIds() {
    const all = (State.stages.stages || []).concat(State.stages.extra || []);
    const ids = new Set(State.stages.terminal || []);
    for (const stage of all) {
      if (stage.role === 'done' || stage.role === 'dropped') ids.add(stage.id);
    }
    if (!all.some((stage) => stage.role === 'dropped') && all.some((stage) => stage.id === 'dropped')) ids.add('dropped');
    return ids;
  }

  function isTerminalItem(it) {
    return terminalStageIds().has(it.stage);
  }

  // A live run, as opposed to a queued dispatch. /api/state has carried these
  // records all along; the buttons simply never asked.
  function runFor(id) {
    return (State.runs || []).find((record) => record.item === id) || null;
  }

  // Every surface that offers an action resolves it here, so a card and its
  // detail panel cannot disagree about what is happening to an item.
  function actionFor(it) {
    if (isTerminalItem(it)) return { kind: 'none' };
    const run = runFor(it.id);
    if (run) return { kind: 'running', run: run };
    if (isDispatched(it.id)) return { kind: 'queued' };
    return { kind: 'idle' };
  }

  function isDispatched(id) {
    const relevant = State.events.filter((e) => e.item === id && (e.type === 'dispatch' || e.type === 'cancel'));
    if (!relevant.length) return false;
    relevant.sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
    return relevant[relevant.length - 1].type === 'dispatch';
  }

  async function loadState() {
    const items = readBlock('gw-items');
    const events = readBlock('gw-events');
    const stages = readBlock('gw-stages');
    const config = readBlock('gw-config');
    const blocksInjected = stages !== null && config !== null;

    if (!blocksInjected && location.protocol.indexOf('http') === 0) {
      try {
        const res = await fetch('/api/state');
        if (res.ok) {
          const data = await res.json();
          return {
            items: data.items || [], events: data.events || [],
            stages: data.stages || { stages: [], extra: [] }, config: data.config || {},
            sync: data.sync || { status: 'off' },
            runs: data.runs || [], scheduler: data.scheduler || { status: 'disabled' },
            generatedAt: data.generatedAt || new Date().toISOString(), live: true,
          };
        }
      } catch { /* no server yet; fall through to whatever was injected */ }
    }

    return {
      items: items || [], events: events || [],
      stages: stages || { stages: [], extra: [] }, config: config || {},
      sync: { status: 'off' },
      generatedAt: (config && config.generatedAt) || null, live: false,
    };
  }

  function stageLabel(id) {
    const s = stageList(State.stages).find((s) => s.id === id);
    return s ? s.label : STAGE_LABEL_FALLBACK(id);
  }

  // The plain-English gate description for a stage. This page cannot import
  // lib/gates/describe.js -- it is a single file with no module loader -- so
  // the sentences are resolved in Node and travel inside the stages payload:
  // `gw serve` puts them there (withGateDescriptions in lib/serve/server.js)
  // and `gw open` puts them in the inlined gw-stages block, which is what
  // keeps the offline snapshot readable. Never restate the wording here: a
  // second copy would drift and the board would describe rules it does not
  // enforce.
  function gateFor(stageId) {
    const gates = State.stages && State.stages.gates;
    const gate = gates && gates[stageId];
    return gate && Array.isArray(gate.sentences) ? gate : null;
  }

  function sentenceList(sentences, className) {
    return '<ul' + (className ? ' class="' + className + '"' : '') + '>' +
      sentences.map((line) => '<li>' + escapeHtml(line) + '</li>').join('') + '</ul>';
  }

  // The raw rule stays one disclosure away: agents and anyone debugging
  // stages.json still need the literal JSON, it just stops being the headline.
  function machineRule(body) {
    return '<details class="machine-rule"><summary>machine rule</summary>' + body + '</details>';
  }

  function filteredItems() {
    const f = State.filters;
    const q = f.search.trim().toLowerCase();
    return State.items.filter((it) => {
      if (f.phase && it.phase !== f.phase) return false;
      if (f.gate && it.gate !== f.gate) return false;
      if (f.type && it.type !== f.type) return false;
      if (f.stage && it.stage !== f.stage) return false;
      if (f.flag && it.flag !== f.flag) return false;
      if (q) {
        const hay = ((it.id || '') + ' ' + (it.title || '') + ' ' + (it.scope || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function populateFilterOptions() {
    const vocab = (State.config && State.config.vocab) || {};
    function fill(select, values, current) {
      const keep = select.querySelector('option[value=""]');
      select.innerHTML = '';
      select.appendChild(keep);
      for (const v of values) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        if (v === current) opt.selected = true;
        select.appendChild(opt);
      }
    }
    fill(document.getElementById('f-phase'), vocab.phase || [...new Set(State.items.map((i) => i.phase).filter(Boolean))], State.filters.phase);
    fill(document.getElementById('f-gate'), vocab.gate || [...new Set(State.items.map((i) => i.gate).filter(Boolean))], State.filters.gate);
    fill(document.getElementById('f-type'), vocab.type || [...new Set(State.items.map((i) => i.type).filter(Boolean))], State.filters.type);
    fill(document.getElementById('f-stage'), stageList(State.stages).map((s) => s.id), State.filters.stage);
    fill(document.getElementById('f-flag'), ['blocked', 'needs-triage', 'paused', 'conflict'], State.filters.flag);
  }

  function renderHeader() {
    const sync = State.sync || { status: 'off' };
    const syncText = sync.status === 'off' ? ''
      : sync.status === 'success' ? 'github · synced ' + syncAge(sync.lastSuccessAt) + ' ago'
        : sync.status === 'stale' ? 'github · sync stale'
          : sync.status === 'failure' ? 'github · sync failing' : 'github · syncing';
    const syncPill = syncText ? ' <span class="live-pill">' + syncText + '</span>' : '';
    document.getElementById('gw-snapshot-meta').innerHTML = State.live
      ? '<span class="live-pill">' + (State.liveError ? 'live · reconnecting (' + escapeHtml(State.liveError) + ')' : 'live · updated ' + liveAge() + ' ago') + '</span>' + syncPill
      : '<span class="snapshot-pill">snapshot · ' + escapeHtml(fmtDate(State.generatedAt)) + '</span>' + syncPill;
    const total = State.items.length;
    const flagged = State.items.filter((i) => i.flag).length;
    const terminal = terminalStageIds();
    const open = State.items.filter((i) => !terminal.has(i.stage)).length;
    document.getElementById('gw-totals').innerHTML =
      '<span><b>' + total + '</b> items</span><span><b>' + open + '</b> open</span><span><b>' + flagged + '</b> flagged</span>';
    renderPauseUI();
    document.getElementById('f-new').classList.toggle('hidden', !State.live);
  }

  // One wording for the Play affordance, because a button that cannot start
  // anything must not say "Play" on the card and something else in the panel.
  function playLabel() {
    return schedulerIsOff() ? 'Queue for an agent' : 'Play';
  }

  function playTitle() {
    return schedulerIsOff()
      ? 'Queues this item. The scheduler is off, so nothing will run until it is turned on.'
      : 'Queues this item for an agent to pick up.';
  }

  function schedulerIsOff() {
    const status = State.scheduler && State.scheduler.status;
    return status === 'disabled' || status === 'unconfigured';
  }

  function activeRunFor(id) {
    return (State.runs || []).find((r) => r.item === id) || null;
  }

  function renderPauseUI() {
    const btn = document.getElementById('gw-pause-btn');
    const banner = document.getElementById('gw-pause-banner');
    if (!State.live) { btn.classList.add('hidden'); banner.classList.add('hidden'); return; }
    btn.classList.remove('hidden');
    const paused = Boolean(State.config && State.config.runner && State.config.runner.paused);
    btn.textContent = paused ? 'resume' : 'pause';
    btn.title = paused
      ? 'Resume: let the scheduler start eligible work again.'
      : 'Pause: stop the scheduler from starting new work.';
    const scheduler = State.scheduler || { status: 'disabled' };
    if (scheduler.status === 'disabled') {
      banner.classList.remove('hidden');
      banner.textContent = 'Scheduler is off (runner.enabled is false) — Play queues work but nothing will run.';
    } else if (scheduler.status === 'unconfigured') {
      banner.classList.remove('hidden');
      banner.textContent = 'Scheduler is off (no provider configured) — Play queues work but nothing will run.';
    } else if (paused) {
      banner.classList.remove('hidden');
      banner.textContent = 'Paused — no new work will be started until resumed.';
    } else {
      banner.classList.add('hidden');
    }
  }

  function liveAge() {
    if (!State.lastLiveUpdate) return 'waiting';
    return Math.max(0, Math.floor((Date.now() - State.lastLiveUpdate) / 1000)) + 's';
  }

  // How long a run has actually been going. A card re-renders only when its
  // item changes, so these labels are re-ticked by the one-second interval in
  // boot() rather than waiting for the item to move.
  function ageLabel(iso) {
    const started = Date.parse(iso);
    if (!Number.isFinite(started)) return '';
    const seconds = Math.max(0, Math.floor((Date.now() - started) / 1000));
    if (seconds < 60) return seconds + 's';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
    return Math.floor(seconds / 3600) + 'h ' + (Math.floor(seconds / 60) % 60) + 'm';
  }

  function runLabel(run) {
    const age = ageLabel(run.started);
    return 'running · ' + run.run + (age ? ' · ' + age : '');
  }

  function tickRunAges() {
    document.querySelectorAll('[data-run-started]').forEach((el) => {
      el.textContent = runLabel({ run: el.dataset.runId, started: el.dataset.runStarted });
    });
  }

  function syncAge(iso) {
    if (!iso) return 'never';
    const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
    return seconds < 60 ? seconds + 's' : Math.floor(seconds / 60) + 'm';
  }

  function renderOverview(container) {
    function counts(key) {
      const map = new Map();
      for (const it of State.items) {
        const k = it[key] || '(none)';
        map.set(k, (map.get(k) || 0) + 1);
      }
      return [...map.entries()].sort((a, b) => b[1] - a[1]);
    }
    function card(title, rows, labelFor) {
      const max = Math.max(1, ...rows.map((r) => r[1]));
      const body = rows.map(([k, n]) =>
        '<div class="count-row"><span>' + escapeHtml(labelFor ? labelFor(k) : k) + '</span>' +
        '<span class="bar"><span style="width:' + Math.round((n / max) * 100) + '%"></span></span>' +
        '<span>' + n + '</span></div>'
      ).join('');
      return '<div class="overview-card"><h2>' + title + '</h2>' + (body || '<p class="meta">none</p>') + '</div>';
    }
    const byStageOrdered = stageList(State.stages).map((s) => [s.id, State.items.filter((i) => i.stage === s.id).length]).filter((r) => r[1] > 0);
    container.innerHTML = '<div class="overview-grid">' +
      card('By stage', byStageOrdered, stageLabel) +
      card('By phase', counts('phase')) +
      card('By gate', counts('gate')) +
      card('By type', counts('type')) +
      '</div>';
  }

  function cardMarkup(it, moved) {
    const evCount = (it.evidence || []).length;
    const dispatched = isDispatched(it.id);
    const parent = it.parent ? State.items.find((candidate) => candidate.id === it.parent) : null;
    const parentState = it.parent && !parent ? 'orphaned parent' : parent && terminalStageIds().has(parent.stage) ? 'parent terminal' : null;
    const action = actionFor(it);
    var actionHtml = '';
    if (action.kind === 'running') {
      actionHtml = '<button data-stoprun="' + escapeHtml(it.id) + '" title="Stops the agent process for this run.">Stop run</button>';
    } else if (action.kind === 'queued') {
      actionHtml = '<button data-stop="' + escapeHtml(it.id) + '" title="Cancels the queued dispatch before it starts.">Cancel</button>';
    } else if (action.kind === 'idle') {
      actionHtml = '<button data-play="' + escapeHtml(it.id) + '"' + (schedulerIsOff() ? ' class="secondary"' : '') +
        ' title="' + escapeHtml(playTitle()) + '">' + escapeHtml(playLabel()) + '</button>';
    }
    // The stage says where the WORK is; this says whether an agent is actually
    // on it. They are different axes, and a card that collapses them into one
    // button cannot answer "is it actually doing the work?" -- a card sitting
    // in Building, owned by a human, with nothing running, used to look
    // identical to one an agent was burning money on.
    const runStatus = action.kind === 'running'
      ? '<span class="tag badge-running" data-run-id="' + escapeHtml(action.run.run) + '" data-run-started="' + escapeHtml(action.run.started || '') + '">' + escapeHtml(runLabel(action.run)) + '</span>'
      : action.kind === 'queued'
        ? '<span class="tag badge-queued">queued · no agent run yet</span>'
        : action.kind === 'idle'
          ? '<span class="tag badge-idle">no agent run · ' + escapeHtml(it.owner || 'unowned') + '</span>'
          : '';
    // action.kind === 'none' is a finished item: no button, because there is
    // nothing left to start, queue or stop.
    const actions = State.live && actionHtml ? '<div class="card-actions">' + actionHtml + '</div>' : '';
    // Draggable only when a server is there to accept the move. A snapshot has
    // nothing to POST to, and a card that drags but can never land is a lie.
    const drag = State.live ? ' draggable="true" title="Drag to another column, or open this card to use the stage buttons."' : '';
    return '<div class="card' + (it.parent ? ' card-child' : '') + (moved ? ' card-moved' : '') + '" data-id="' + escapeHtml(it.id) + '"' + drag + '>' +
      '<div class="card-id">' + escapeHtml(it.id) + '</div>' +
      '<div class="card-title">' + escapeHtml(it.title) + '</div>' +
      '<div class="card-meta">' +
      '<span class="tag">' + escapeHtml(it.type || '?') + '</span>' +
      (it.flag ? '<span class="tag flag-' + escapeHtml(it.flag) + '">' + escapeHtml(it.flag) + '</span>' : '') +
      (it.parent ? '<span class="tag">child of ' + escapeHtml(it.parent) + '</span>' : '') +
      (parentState ? '<span class="tag">' + escapeHtml(parentState) + '</span>' : '') +
      runStatus +
      // The idle chip already names the owner; do not say it twice.
      (it.owner && action.kind !== 'idle' ? '<span class="tag">' + escapeHtml(it.owner) + '</span>' : '') +
      '<span class="tag mono">ev:' + evCount + '</span>' +
      '</div>' + actions + '</div>';
  }

  function renderBoard(container) {
    const items = filteredItems();
    const cols = stageList(State.stages);
    container.innerHTML = '<div id="board">' + cols.map((s) => {
      const inCol = items.filter((i) => i.stage === s.id);
      const ordered = []; const visit = (parentId) => inCol.filter((item) => item.parent === parentId).forEach((child) => { ordered.push(child); visit(child.id); });
      inCol.filter((item) => !item.parent || !inCol.some((candidate) => candidate.id === item.parent)).forEach((root) => { ordered.push(root); visit(root.id); });
      return '<div class="column" data-stage="' + escapeHtml(s.id) + '"><div class="column-head"><span>' + escapeHtml(s.label) + '</span><span class="count">' + inCol.length + '</span></div>' +
        '<div class="column-body">' + (ordered.map(cardMarkup).join('') || '') + '</div></div>';
    }).join('') + '</div>';
  }

  // -- drag and drop -------------------------------------------------------
  // Native HTML5 drag and drop, no library. It is an addition to the panel's
  // stage buttons, never a replacement: everything here is reachable by click
  // and keyboard through the panel, which is what anyone who cannot drag uses.

  // A column is a drop target only if the very same move the panel button
  // would issue is currently permitted. Forced moves are excluded because the
  // board has no way to send --force; they stay a CLI decision.
  function dropAllowed(id, stageId) {
    const it = State.items.find((candidate) => candidate.id === id);
    if (!it || it.stage === stageId) return false;
    const transitions = State.transitions[id];
    const transition = transitions && transitions[stageId];
    return Boolean(transition && transition.ok && !transition.force);
  }

  function dropRefusal(id, stageId) {
    const transitions = State.transitions[id];
    if (!transitions) {
      return State.transitionErrors[id] ? 'Unable to check this gate.' : 'Checking this gate…';
    }
    const transition = transitions[stageId];
    if (!transition) return 'Not reachable from here — `gw move --force` skips stages.';
    if (transition.ok && transition.force) return 'A jump like this needs `gw move --force`.';
    const reasons = (transition.reasons && transition.reasons.length) ? transition.reasons : (transition.failures || []);
    return reasons.join(' · ');
  }

  // Which columns would take this card, marked before the drag reaches them
  // rather than after the server refuses it.
  function markDropTargets() {
    const board = document.getElementById('board');
    const drag = State.drag;
    if (!board || !drag) return;
    board.classList.add('dragging');
    board.querySelectorAll('.column').forEach((column) => {
      const stageId = column.dataset.stage;
      column.classList.remove('drop-ok', 'drop-invalid', 'drop-source', 'drop-over');
      column.removeAttribute('title');
      if (stageId === drag.from) { column.classList.add('drop-source'); return; }
      if (dropAllowed(drag.id, stageId)) { column.classList.add('drop-ok'); return; }
      column.classList.add('drop-invalid');
      const why = dropRefusal(drag.id, stageId);
      if (why) column.title = why;
    });
  }

  function clearDropTargets() {
    const board = document.getElementById('board');
    if (board) {
      board.classList.remove('dragging');
      board.querySelectorAll('.column').forEach((column) => {
        column.classList.remove('drop-ok', 'drop-invalid', 'drop-source', 'drop-over');
        column.removeAttribute('title');
      });
    }
    document.querySelectorAll('.card.dragging').forEach((card) => card.classList.remove('dragging'));
    State.drag = null;
  }

  // The drop moves the card immediately so the gesture feels answered, then
  // puts it back exactly where it was if the gate refuses. The move itself is
  // onMoveClick -- the panel button's path -- and the refusal it reports is the
  // English from lib/gates/describe.js.
  async function onCardDrop(id, to, column) {
    const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    const home = card && card.parentNode ? { parent: card.parentNode, next: card.nextSibling } : null;
    const body = column.querySelector('.column-body');
    if (card && body) body.appendChild(card);
    const result = await onMoveClick(id, to, null);
    if (result && !result.ok && card && home && card.parentNode !== home.parent) {
      home.parent.insertBefore(card, home.next);
    }
  }

  function wireDragAndDrop(view) {
    // Verdicts are fetched per item, so warm the cache as the pointer goes
    // down: by the time a column is reached the answer is usually already in.
    view.addEventListener('mousedown', (e) => {
      if (!State.live || !e.target.closest) return;
      const card = e.target.closest('.card[draggable="true"]');
      if (card) refreshTransitions(card.dataset.id);
    });

    view.addEventListener('dragstart', (e) => {
      const card = e.target.closest ? e.target.closest('.card[draggable="true"]') : null;
      if (!card || !State.live) return;
      const it = State.items.find((candidate) => candidate.id === card.dataset.id);
      if (!it) return;
      State.drag = { id: it.id, from: it.stage };
      if (e.dataTransfer) {
        e.dataTransfer.setData('text/plain', it.id);
        e.dataTransfer.effectAllowed = 'move';
      }
      card.classList.add('dragging');
      hideBoardRefusal();
      markDropTargets();
      // Re-ask even when cached: the answer may be older than the item.
      refreshTransitions(it.id);
    });

    view.addEventListener('dragover', (e) => {
      const drag = State.drag;
      if (!drag || !e.target.closest) return;
      const column = e.target.closest('.column');
      if (!column) return;
      if (!dropAllowed(drag.id, column.dataset.stage)) {
        // No preventDefault: the browser itself refuses the drop, so an
        // invalid column cannot even accept the card optimistically.
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'none';
        return;
      }
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      column.classList.add('drop-over');
    });

    view.addEventListener('dragleave', (e) => {
      const column = e.target.closest ? e.target.closest('.column') : null;
      if (column && !column.contains(e.relatedTarget)) column.classList.remove('drop-over');
    });

    view.addEventListener('drop', (e) => {
      const drag = State.drag;
      if (!drag || !e.target.closest) return;
      const column = e.target.closest('.column');
      if (!column) return;
      const to = column.dataset.stage;
      if (!dropAllowed(drag.id, to)) return;
      e.preventDefault();
      const id = drag.id;
      clearDropTargets();
      onCardDrop(id, to, column);
    });

    view.addEventListener('dragend', clearDropTargets);
  }

  function renderTable(container) {
    const items = filteredItems();
    const cols = [
      ['id', 'ID'], ['title', 'Title'], ['type', 'Type'], ['phase', 'Phase'], ['gate', 'Gate'],
      ['priority', 'Priority'], ['stage', 'Stage'], ['flag', 'Flag'], ['owner', 'Owner'], ['updated', 'Updated'],
    ];
    const key = State.sort.key, dir = State.sort.dir;
    const sorted = [...items].sort((a, b) => {
      const av = a[key] == null ? '' : a[key], bv = b[key] == null ? '' : b[key];
      const cmp = String(av).localeCompare(String(bv));
      return dir === 'asc' ? cmp : -cmp;
    });
    container.innerHTML = '<table class="gw-table"><thead><tr>' +
      cols.map(([k, label]) => '<th data-key="' + k + '" class="' + (k === key ? 'sorted' : '') + '">' + label + (k === key ? (dir === 'asc' ? ' ↑' : ' ↓') : '') + '</th>').join('') +
      '</tr></thead><tbody>' +
      sorted.map((it) => '<tr data-id="' + escapeHtml(it.id) + '">' +
        '<td class="id">' + escapeHtml(it.id) + '</td>' +
        '<td>' + escapeHtml(it.title) + '</td>' +
        '<td>' + escapeHtml(it.type) + '</td>' +
        '<td>' + escapeHtml(it.phase) + '</td>' +
        '<td>' + escapeHtml(it.gate) + '</td>' +
        '<td>' + escapeHtml(it.priority) + '</td>' +
        '<td>' + escapeHtml(stageLabel(it.stage)) + '</td>' +
        '<td>' + (it.flag ? '<span class="tag flag-' + escapeHtml(it.flag) + '">' + escapeHtml(it.flag) + '</span>' : '') + '</td>' +
        '<td>' + escapeHtml(it.owner) + '</td>' +
        '<td>' + escapeHtml(fmtDate(it.updated)) + '</td>' +
        '</tr>').join('') +
      '</tbody></table>';
  }

  function renderStages(container) {
    const cols = stageList(State.stages);
    container.innerHTML = cols.map((s) => {
      const req = s.requires ? JSON.stringify(s.requires, null, 2) : '(no machine rule — advanced manually)';
      const flags = [s.auto ? 'auto-eligible for the scheduler' : 'human-gated', terminalStageIds().has(s.id) ? 'terminal' : null].filter(Boolean).join(' · ');
      const gate = gateFor(s.id);
      const english = gate
        ? sentenceList(gate.sentences, 'gate-sentences')
        // Older snapshots were written before the descriptions were carried in
        // the payload. Say so rather than inventing sentences for them.
        : '<p class="gate-missing">This board was written without rule descriptions — run <code>gw open</code> again to refresh it. The machine rule below is all it carries.</p>';
      return '<div class="stage-rule"><h3>' + escapeHtml(s.label) + ' <span class="meta mono">(' + escapeHtml(s.id) + ')</span></h3>' +
        (s.exit ? '<p class="exit">' + escapeHtml(s.exit) + '</p>' : '') +
        english +
        (flags ? '<div class="flags">' + escapeHtml(flags) + '</div>' : '') +
        machineRule('<pre class="requires">' + escapeHtml(req) + '</pre>') +
        '</div>';
    }).join('');
  }

  function renderExport(container) {
    container.innerHTML = '<div class="export-panel"><p>Download this snapshot as JSON — items, events, stages, and config exactly as loaded.</p><button id="export-btn">Download JSON</button></div>';
    container.querySelector('#export-btn').addEventListener('click', () => {
      const payload = JSON.stringify({ items: State.items, events: State.events, stages: State.stages, config: State.config, generatedAt: State.generatedAt }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gatewright-board.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  function renderView() {
    const container = document.getElementById('gw-view');
    const empty = document.getElementById('gw-empty');
    if (State.items.length === 0) {
      container.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    if (State.view === 'overview') renderOverview(container);
    else if (State.view === 'board') renderBoard(container);
    else if (State.view === 'table') renderTable(container);
    else if (State.view === 'stages') renderStages(container);
    else if (State.view === 'export') renderExport(container);
  }

  function openPanel(id) {
    const it = State.items.find((i) => i.id === id);
    if (!it) return;
    State.activePanelId = id;
    State.creatingItem = false;
    if (!State.pendingEvidence[id]) State.pendingEvidence[id] = [];
    renderPanel(it);
    document.getElementById('gw-overlay').classList.add('open');
    if (State.live) {
      refreshTransitions(id);
      const run = activeRunFor(id);
      if (run) refreshRunLog(id, run.run);
    }
  }

  function closePanel() {
    State.activePanelId = null;
    State.creatingItem = false;
    document.getElementById('gw-overlay').classList.remove('open');
  }

  function showPanelError(msg) {
    const el = document.getElementById('panel-error');
    if (el) el.innerHTML = '<div class="refusal">' + escapeHtml(msg) + '</div>';
  }

  async function refreshTransitions(id) {
    if (State.transitionLoading[id]) return;
    State.transitionLoading[id] = true;
    delete State.transitionErrors[id];
    try {
      const res = await fetch('/api/items/' + encodeURIComponent(id) + '/transitions');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      State.transitions[id] = await res.json();
    } catch (error) {
      State.transitionErrors[id] = error.message || 'request failed';
    } finally {
      State.transitionLoading[id] = false;
      if (State.activePanelId === id) {
        const current = State.items.find((item) => item.id === id);
        if (current) renderPanel(current);
      }
      // A drag that started before the verdicts landed gets its columns marked
      // the moment they do, rather than staying uniformly invalid.
      if (State.drag && State.drag.id === id) markDropTargets();
    }
  }

  async function refreshRunLog(id, run) {
    const key = id + ':' + run;
    if (State.runLogLoading[key]) return;
    State.runLogLoading[key] = true;
    delete State.runLogErrors[id];
    try {
      const res = await fetch('/api/runs/' + encodeURIComponent(run) + '/log?tail=200');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      State.runLogs[id] = data.log || '';
    } catch (error) {
      State.runLogErrors[id] = error.message || 'request failed';
    } finally {
      State.runLogLoading[key] = false;
      if (State.activePanelId === id) {
        const current = State.items.find((item) => item.id === id);
        if (current) renderPanel(current);
      }
    }
  }

  function renderPanel(it) {
    const panel = document.getElementById('gw-panel');
    const itemEvents = State.events.filter((e) => e.item === it.id).slice().sort((a, b) => String(a.ts).localeCompare(String(b.ts)));

    const pendingEv = State.pendingEvidence[it.id] || [];
    const allEvidence = [...(it.evidence || []), ...pendingEv];
    const target = nextStageId(State.stages, it.stage);

    const banner = State.live
      ? ''
      : '<div class="readonly-banner">read-only snapshot' +
        (target ? ' &middot; to advance this item run: <code>gw move ' + escapeHtml(it.id) + ' ' + escapeHtml(target) + ' --evidence &lt;commit&gt;</code>' : '') +
        '</div>';

    const dispatched = isDispatched(it.id);
    const panelAction = actionFor(it);
    var panelButton = '';
    if (panelAction.kind === 'running') {
      panelButton = '<button id="panel-stoprun" title="Stops the agent process for this run.">Stop run</button>';
    } else if (panelAction.kind === 'queued') {
      panelButton = '<button id="panel-stop" title="Cancels the queued dispatch before it starts.">Cancel dispatch</button>';
    } else if (panelAction.kind === 'idle') {
      panelButton = '<button id="panel-play"' + (schedulerIsOff() ? ' class="secondary"' : '') +
        ' title="' + escapeHtml(playTitle()) + '">' + escapeHtml(playLabel()) + '</button>';
    }
    const playStop = State.live && panelButton
      ? '<div class="panel-actions">' + panelButton + '</div>'
      : '';

    const activeRun = activeRunFor(it.id);
    const logHtml = activeRun
      ? '<h3>Run log (' + escapeHtml(activeRun.run) + ')</h3><pre class="run-log">' + escapeHtml(
          State.runLogs[it.id] != null ? (State.runLogs[it.id] || '(log is empty)')
            : State.runLogErrors[it.id] ? 'unable to load log: ' + State.runLogErrors[it.id]
              : 'loading…'
        ) + '</pre>'
      : '';

    const triageHtml = (State.live && it.flag === 'needs-triage')
      ? '<div class="panel-actions triage"><button id="panel-triage-approve" title="Clears the hold and makes this item schedulable again.">Approve</button> ' +
        '<button id="panel-triage-drop" title="Moves this item to the dropped stage.">Drop</button></div>'
      : '';

    const resumeHtml = (State.live && it.flag === 'paused')
      ? '<div class="panel-actions"><button id="panel-resume" title="Restores the item and dispatches it again.">Resume</button></div>'
      : '';

    // A disabled button is a refusal, and a refusal has to say what it wants.
    // `note` is the one-line reason the button is off; `unmet` is the gate in
    // the English lib/gates/describe.js produces, shown next to the button
    // rather than hidden in a tooltip; `machine` keeps the literal lib/rules.js
    // failure lines -- which carry the exact command to run -- one disclosure
    // away, and in the tooltip as before.
    const stageButtonsHtml = stageList(State.stages).map((s) => {
      if (s.id === it.stage) return '';
      const transitions = State.transitions[it.id];
      const transition = transitions && transitions[s.id];
      let note = '';
      let heading = '';
      let unmet = [];
      let machine = [];
      let disabled = true;
      if (!State.live) {
        note = 'read-only snapshot';
        // No server to ask what this item fails, so say what the gate checks.
        // That is a different statement and it is labelled as one.
        const gate = gateFor(s.id);
        if (gate) { heading = 'This gate checks:'; unmet = gate.sentences; }
      } else if (!transitions) {
        note = State.transitionErrors[it.id]
          ? 'unable to check transition rules'
          : 'checking transition rules…';
      } else if (!transition) {
        note = 'use `gw move --force` to skip stages';
      } else if (transition.force && transition.ok) {
        note = 'use `gw move --force` to skip stages';
      } else if (!transition.ok) {
        if (transition.force) note = 'and a jump like this also needs `gw move --force`';
        heading = 'Not met yet:';
        machine = transition.failures || [];
        unmet = (transition.reasons && transition.reasons.length) ? transition.reasons : machine;
      } else {
        disabled = false;
      }
      const tooltip = (machine.length ? machine.join('; ') : note);
      return '<div class="stage-button-wrap">' +
        '<button data-move="' + escapeHtml(s.id) + '"' + (disabled ? ' disabled' : '') + (tooltip ? ' title="' + escapeHtml(tooltip) + '"' : '') + '>' + escapeHtml(s.label) + '</button>' +
        (note ? '<div class="stage-reason">' + escapeHtml(note) + '</div>' : '') +
        (unmet.length ? '<div class="stage-reason"><span class="reason-head">' + escapeHtml(heading) + '</span>' + sentenceList(unmet) + '</div>' : '') +
        (machine.length ? machineRule(sentenceList(machine)) : '') +
        '<div class="stage-refusal" id="move-fail-' + escapeHtml(s.id) + '"></div>' +
        '</div>';
    }).join('');

    const evidenceHtml = allEvidence.length
      ? allEvidence.map((e, idx) => '<li class="evidence-chip">' + escapeHtml(e) + (idx >= (it.evidence || []).length ? ' <span class="meta">(pending &middot; sent with the next stage move)</span>' : '') + '</li>').join('')
      : '<li class="meta">none</li>';
    const evidenceEditor = State.live
      ? '<div class="evidence-add"><input type="text" id="evidence-input" placeholder="commit SHA, test path, PR/CI URL"><button id="evidence-add-btn">add evidence</button></div>'
      : '';

    const notesEditor = State.live
      ? '<div class="note-add"><textarea id="note-input" rows="2" placeholder="append a note"></textarea><button id="note-add-btn">add note</button></div>'
      : '';

    const editableFields = ['title', 'scope', 'priority', 'type', 'phase', 'gate', 'deps', 'refs'];
    const ghOwned = new Set(['title', 'scope', 'priority', 'type', 'phase', 'gate']);
    const linked = Boolean(it.gh);
    const fieldRows = editableFields.map((f) => {
      const raw = it[f];
      const value = Array.isArray(raw) ? raw.join(', ') : (raw == null ? '' : raw);
      if (!State.live) {
        return '<dt>' + f + '</dt><dd class="' + (f === 'deps' || f === 'refs' ? 'mono' : '') + '">' + escapeHtml(value === '' ? '(none)' : value) + '</dd>';
      }
      const lockedNote = linked && ghOwned.has(f)
        ? ' <span class="meta">(GitHub-owned on this linked item &mdash; edits are refused; edit the issue instead)</span>'
        : '';
      return '<dt>' + f + '</dt><dd><input type="text" data-field="' + f + '" value="' + escapeHtml(value) + '"' + (f === 'title' ? ' maxlength="120"' : '') + '>' + lockedNote +
        '<div class="field-refusal" id="field-fail-' + f + '"></div></dd>';
    }).join('');
    const saveBtn = State.live ? '<button id="save-fields-btn">save fields</button>' : '';

    const readonlyFields = ['id', 'stage', 'flag', 'owner', 'parent', 'created_by', 'gh', 'created', 'updated'];
    const readonlyDl = readonlyFields.map((f) => {
      let v = it[f];
      if (v && typeof v === 'object') v = JSON.stringify(v);
      else if (v == null || v === '') v = '(none)';
      return '<dt>' + f + '</dt><dd class="' + (f === 'id' ? 'mono' : '') + '">' + escapeHtml(v) + '</dd>';
    }).join('');

    const eventsHtml = itemEvents.length
      ? itemEvents.map((e) => '<div class="event-line"><time>' + escapeHtml(fmtDate(e.ts)) + '</time><span>' + escapeHtml(e.type) + (e.from ? ' ' + escapeHtml(e.from) + '→' + escapeHtml(e.to) : '') + ' by ' + escapeHtml(e.by) + '</span></div>').join('')
      : '<p class="meta">no events recorded</p>';

    panel.innerHTML = '<div class="panel-head"><h2>' + escapeHtml(it.id) + '</h2><button class="close-btn" id="panel-close">&times;</button></div>' +
      '<p>' + escapeHtml(it.title) + '</p>' +
      '<div id="panel-error"></div>' +
      banner + triageHtml + resumeHtml + playStop + logHtml +
      '<h3>Stage</h3><div class="stage-buttons">' + stageButtonsHtml + '</div>' +
      '<h3>Evidence</h3><ul class="evidence-list">' + evidenceHtml + '</ul>' + evidenceEditor +
      '<h3>Fields</h3><dl>' + fieldRows + '</dl>' + saveBtn +
      '<dl>' + readonlyDl + '</dl>' +
      '<h3>Notes</h3><pre class="notes-body">' + escapeHtml(it.notes || '(none)') + '</pre>' + notesEditor +
      '<h3>Event history</h3>' + eventsHtml;

    panel.querySelector('#panel-close').addEventListener('click', closePanel);
    wirePanelActions(it);
  }

  function wirePanelActions(it) {
    const panel = document.getElementById('gw-panel');

    panel.querySelectorAll('[data-move]').forEach((btn) => {
      btn.addEventListener('click', () => onMoveClick(it.id, btn.dataset.move, btn));
    });

    const playBtn = panel.querySelector('#panel-play');
    if (playBtn) playBtn.addEventListener('click', () => onDispatchClick(it.id, 'dispatch', playBtn));
    const stopBtn = panel.querySelector('#panel-stop');
    if (stopBtn) stopBtn.addEventListener('click', () => onDispatchClick(it.id, 'cancel', stopBtn));
    const stopRunBtn = panel.querySelector('#panel-stoprun');
    if (stopRunBtn) stopRunBtn.addEventListener('click', () => onDispatchClick(it.id, 'stop', stopRunBtn));
    const resumeBtn = panel.querySelector('#panel-resume');
    if (resumeBtn) resumeBtn.addEventListener('click', () => onDispatchClick(it.id, 'resume', resumeBtn));
    const approveBtn = panel.querySelector('#panel-triage-approve');
    if (approveBtn) approveBtn.addEventListener('click', () => onTriageClick(it.id, 'approve', approveBtn));
    const dropBtn = panel.querySelector('#panel-triage-drop');
    if (dropBtn) dropBtn.addEventListener('click', () => onTriageClick(it.id, 'drop', dropBtn));

    const evBtn = panel.querySelector('#evidence-add-btn');
    if (evBtn) evBtn.addEventListener('click', () => {
      const input = panel.querySelector('#evidence-input');
      const value = input.value.trim();
      if (!value) return;
      if (!State.pendingEvidence[it.id]) State.pendingEvidence[it.id] = [];
      State.pendingEvidence[it.id].push(value);
      const fresh = State.items.find((i) => i.id === it.id) || it;
      renderPanel(fresh);
    });

    const noteBtn = panel.querySelector('#note-add-btn');
    if (noteBtn) noteBtn.addEventListener('click', () => onNoteSubmit(it.id, noteBtn));

    const saveBtn = panel.querySelector('#save-fields-btn');
    if (saveBtn) saveBtn.addEventListener('click', () => onSaveFields(it, saveBtn));
  }

  // The one move path. The panel buttons call it, and a card dropped on a
  // column calls it too -- there is no second way to move an item, and so no
  // second set of rules for one of them to get wrong. `btn` is optional so a
  // drop can use it without inventing a button.
  async function onMoveClick(id, to, btn) {
    const key = 'move:' + id + ':' + to;
    if (Inflight.has(key)) return { ok: false, skipped: true, data: null };
    Inflight.add(key);
    if (btn) btn.disabled = true;
    const evidence = State.pendingEvidence[id] || [];
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/move', { to, evidence });
    Inflight.delete(key);
    if (result.ok) {
      State.pendingEvidence[id] = [];
      await refreshNow();
      return result;
    }
    if (btn) btn.disabled = false;
    await showMoveRefusal(id, to, result);
    return result;
  }

  // What a refusal should say, in the wording a human can act on. The server's
  // `failures` stay available -- they name the command to run -- but the
  // headline is the English gate description, re-fetched first so it describes
  // the refusal that just happened rather than a stale check.
  async function refusalText(id, to, result) {
    await refreshTransitions(id);
    const transitions = State.transitions[id];
    const transition = transitions && transitions[to];
    const machine = (result.data && result.data.failures && result.data.failures.length) ? result.data.failures : [];
    const reasons = (transition && transition.reasons && transition.reasons.length) ? transition.reasons : null;
    const fallback = machine.length ? machine : [(result.data && result.data.error) || 'request failed'];
    return { unmet: reasons || fallback, machine: machine };
  }

  async function showMoveRefusal(id, to, result) {
    const { unmet, machine } = await refusalText(id, to, result);
    const box = document.getElementById('move-fail-' + to);
    if (box) {
      box.innerHTML = '<div class="refusal">' + unmet.map((line) => escapeHtml(line)).join('<br>') + '</div>' +
        (machine.length ? machineRule(sentenceList(machine)) : '');
    }
    // A card that snapped back in silence is the failure mode this exists to
    // prevent, so the board says it too whenever the panel is not already
    // showing this item's refusal.
    if (State.activePanelId !== id) showBoardRefusal(id, to, unmet);
  }

  let refusalTimer = null;

  function hideBoardRefusal() {
    const notice = document.getElementById('gw-drop-refusal');
    if (notice) { notice.classList.add('hidden'); notice.innerHTML = ''; }
    if (refusalTimer) { window.clearTimeout(refusalTimer); refusalTimer = null; }
  }

  function showBoardRefusal(id, to, unmet) {
    const notice = document.getElementById('gw-drop-refusal');
    if (!notice) return;
    notice.innerHTML = '<button class="close-btn" id="drop-refusal-close" aria-label="Dismiss">&times;</button>' +
      '<h4>' + escapeHtml(id) + ' cannot move to ' + escapeHtml(stageLabel(to)) + ' yet</h4>' +
      sentenceList(unmet);
    notice.classList.remove('hidden');
    notice.querySelector('#drop-refusal-close').addEventListener('click', hideBoardRefusal);
    if (refusalTimer) window.clearTimeout(refusalTimer);
    refusalTimer = window.setTimeout(hideBoardRefusal, 12000);
  }

  async function onDispatchClick(id, action, btn) {
    const key = action + ':' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/' + action, {});
    Inflight.delete(key);
    if (result.ok) {
      await refreshNow();
    } else {
      btn.disabled = false;
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  async function onTriageClick(id, action, btn) {
    const key = 'triage:' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/triage', { action });
    Inflight.delete(key);
    if (result.ok) {
      await refreshNow();
    } else {
      btn.disabled = false;
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  async function onNoteSubmit(id, btn) {
    const panel = document.getElementById('gw-panel');
    const input = panel.querySelector('#note-input');
    const text = input.value.trim();
    if (!text) return;
    const key = 'note:' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/note', { text });
    Inflight.delete(key);
    if (result.ok) {
      input.value = '';
      await refreshNow();
    } else {
      btn.disabled = false;
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  async function onSaveFields(it, btn) {
    const panel = document.getElementById('gw-panel');
    const inputs = panel.querySelectorAll('[data-field]');
    const body = {};
    inputs.forEach((input) => {
      const field = input.dataset.field;
      const raw = it[field];
      const original = Array.isArray(raw) ? raw.join(', ') : (raw == null ? '' : String(raw));
      const value = input.value;
      if (value !== original) {
        body[field] = (field === 'deps' || field === 'refs')
          ? value.split(',').map((v) => v.trim()).filter(Boolean).join(',')
          : value;
      }
    });
    if (!Object.keys(body).length) return;
    const key = 'edit:' + it.id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    panel.querySelectorAll('.field-refusal').forEach((el) => { el.innerHTML = ''; });
    const result = await apiWrite('/api/items/' + encodeURIComponent(it.id), body);
    Inflight.delete(key);
    btn.disabled = false;
    if (result.ok) {
      await refreshNow();
    } else if (result.status === 409) {
      const failures = (result.data && result.data.failures && result.data.failures.length)
        ? result.data.failures
        : [(result.data && result.data.error) || 'refused'];
      const message = (result.data && result.data.error) || failures.join('; ');
      showPanelError(message);
      Object.keys(body).forEach((field) => {
        const el = document.getElementById('field-fail-' + field);
        if (el) el.innerHTML = '<div class="refusal">' + escapeHtml(message) + '</div>';
      });
    } else {
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  function openCreatePanel() {
    const panel = document.getElementById('gw-panel');
    const overlay = document.getElementById('gw-overlay');
    State.activePanelId = null;
    State.creatingItem = true;
    const vocab = (State.config && State.config.vocab) || {};
    function options(list) {
      return '<option value="">(none)</option>' + (list || []).map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join('');
    }
    panel.innerHTML = '<div class="panel-head"><h2>New item</h2><button class="close-btn" id="panel-close">&times;</button></div>' +
      '<div id="panel-error"></div>' +
      '<form id="create-form" class="create-form">' +
      '<label>Title<input type="text" name="title" required maxlength="120"></label>' +
      '<label>Phase<select name="phase">' + options(vocab.phase) + '</select></label>' +
      '<label>Type<select name="type">' + options(vocab.type) + '</select></label>' +
      '<label>Priority<select name="priority">' + options(vocab.priority) + '</select></label>' +
      '<label>Gate<select name="gate">' + options(vocab.gate) + '</select></label>' +
      '<label>Scope<textarea name="scope" rows="3"></textarea></label>' +
      '<label>Parent<input type="text" name="parent" placeholder="item id, optional"></label>' +
      '<button type="submit">create</button>' +
      '</form>';
    panel.querySelector('#panel-close').addEventListener('click', closePanel);
    panel.querySelector('#create-form').addEventListener('submit', onCreateSubmit);
    overlay.classList.add('open');
  }

  async function onCreateSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    if (Inflight.has('create')) return;
    Inflight.add('create');
    btn.disabled = true;
    const data = new FormData(form);
    const body = {};
    for (const [k, v] of data.entries()) {
      const trimmed = String(v).trim();
      if (trimmed !== '') body[k] = trimmed;
    }
    const result = await apiWrite('/api/items', body);
    Inflight.delete('create');
    btn.disabled = false;
    if (result.ok) {
      State.creatingItem = false;
      closePanel();
      await refreshNow();
    } else {
      const failures = (result.data && result.data.failures && result.data.failures.length) ? result.data.failures.join('; ') : null;
      showPanelError(failures || (result.data && result.data.error) || 'request failed');
    }
  }

  function updateBoardInPlace(previousItems, priorDispatch) {
    const board = document.getElementById('board');
    if (!board) { renderView(); return; }
    const oldById = new Map(previousItems.map((item) => [item.id, item]));
    const cards = new Map([...board.querySelectorAll('.card')].map((card) => [card.dataset.id, card]));
    for (const stage of stageList(State.stages)) {
      const column = board.querySelector('.column[data-stage="' + CSS.escape(stage.id) + '"]');
      if (!column) { renderView(); return; }
      const body = column.querySelector('.column-body');
      const items = filteredItems().filter((item) => item.stage === stage.id);
      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const prior = oldById.get(item.id); const moved = prior && prior.stage !== item.stage;
        const dispatchChanged = priorDispatch.has(item.id) && priorDispatch.get(item.id) !== isDispatched(item.id);
        let card = cards.get(item.id);
        if (!card || moved) {
          const holder = document.createElement('div'); holder.innerHTML = cardMarkup(item, moved); card = holder.firstChild;
        } else if (JSON.stringify(prior) !== JSON.stringify(item) || dispatchChanged) {
          const holder = document.createElement('div'); holder.innerHTML = cardMarkup(item, false);
          const replacement = holder.firstChild; card.replaceWith(replacement); card = replacement;
        }
        fragment.appendChild(card);
      }
      body.replaceChildren(fragment); column.querySelector('.count').textContent = String(items.length);
    }
  }

  function mergeEvents(events) {
    const seen = new Set(State.events.map((event) => JSON.stringify(event)));
    State.events.push(...events.filter((event) => !seen.has(JSON.stringify(event))));
  }

  async function poll() {
    const since = State.generatedAt ? '?since=' + encodeURIComponent(State.generatedAt) : '';
    try {
      const res = await fetch('/api/state' + since);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json(); const previous = State.items;
      const priorDispatch = new Map(previous.map((item) => [item.id, isDispatched(item.id)]));
      State.items = data.items || []; mergeEvents(data.events || []);
      State.stages = data.stages || State.stages; State.config = data.config || State.config; State.sync = data.sync || State.sync;
      State.runs = data.runs || []; State.scheduler = data.scheduler || State.scheduler;
      State.generatedAt = data.generatedAt || new Date().toISOString();
      State.lastLiveUpdate = Date.now(); State.liveError = null; State.pollingDelay = 2000;
      populateFilterOptions(); renderHeader();
      if (State.view === 'board') updateBoardInPlace(previous, priorDispatch); else renderView();
      if (State.activePanelId) openPanel(State.activePanelId);
    } catch (error) {
      State.liveError = error.message || 'server unavailable'; State.pollingDelay = Math.min(State.pollingDelay * 2, 30000); renderHeader();
    }
    schedulePoll(State.pollingDelay);
  }

  function wireStatic() {
    document.querySelectorAll('#gw-tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#gw-tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        State.view = btn.dataset.view;
        renderView();
      });
    });

    ['phase', 'gate', 'type', 'stage', 'flag'].forEach((key) => {
      const el = document.getElementById('f-' + key);
      el.addEventListener('change', () => { State.filters[key] = el.value; renderView(); });
    });
    document.getElementById('f-search').addEventListener('input', (e) => { State.filters.search = e.target.value; renderView(); });
    document.getElementById('f-clear').addEventListener('click', () => {
      State.filters = { phase: '', gate: '', type: '', stage: '', flag: '', search: '' };
      document.querySelectorAll('#gw-filters select').forEach((s) => { s.value = ''; });
      document.getElementById('f-search').value = '';
      renderView();
    });

    document.getElementById('gw-view').addEventListener('click', (e) => {
      const playBtn = e.target.closest('[data-play]');
      if (playBtn) { e.stopPropagation(); onDispatchClick(playBtn.dataset.play, 'dispatch', playBtn); return; }
      const stopBtn = e.target.closest('[data-stop]');
      if (stopBtn) { e.stopPropagation(); onDispatchClick(stopBtn.dataset.stop, 'cancel', stopBtn); return; }
      // Distinct from cancel: this one reaches a process that is already
      // running, rather than withdrawing a dispatch that has not started.
      const stopRunBtn = e.target.closest('[data-stoprun]');
      if (stopRunBtn) { e.stopPropagation(); onDispatchClick(stopRunBtn.dataset.stoprun, 'stop', stopRunBtn); return; }
      const card = e.target.closest('[data-id]');
      if (card) openPanel(card.dataset.id);
    });
    document.getElementById('gw-view').addEventListener('click', (e) => {
      const th = e.target.closest('th[data-key]');
      if (!th) return;
      const key = th.dataset.key;
      if (State.sort.key === key) State.sort.dir = State.sort.dir === 'asc' ? 'desc' : 'asc';
      else { State.sort.key = key; State.sort.dir = 'asc'; }
      renderView();
    });

    wireDragAndDrop(document.getElementById('gw-view'));

    document.getElementById('gw-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'gw-overlay') closePanel();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closePanel(); hideBoardRefusal(); }
    });

    document.getElementById('f-new').addEventListener('click', openCreatePanel);

    document.getElementById('gw-pause-btn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const key = 'pauseToggle';
      if (Inflight.has(key)) return;
      const paused = Boolean(State.config && State.config.runner && State.config.runner.paused);
      Inflight.add(key);
      btn.disabled = true;
      const result = await apiWrite(paused ? '/api/resume' : '/api/pause', {});
      Inflight.delete(key);
      btn.disabled = false;
      if (result.ok) await refreshNow();
    });
  }

  async function boot() {
    const loaded = await loadState();
    Object.assign(State, loaded);
    populateFilterOptions();
    renderHeader();
    wireStatic();
    renderView();
    if (location.protocol.indexOf('http') === 0) {
      State.live = true; State.lastLiveUpdate = Date.now(); renderHeader();
      schedulePoll(2000);
      window.setInterval(() => { if (State.live) { renderHeader(); tickRunAges(); } }, 1000);
    }
  }

  // The injected data blocks are appended after this script tag in document
  // order, so they haven't been parsed yet when this script runs. Wait for
  // DOMContentLoaded so getElementById can find them.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
