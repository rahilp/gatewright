<!-- gatewright board v1 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gatewright</title>
<!-- T-0082: a data URI, not a file request -- the only favicon the file://
     snapshot can ever load without a 404 in the console. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='3.5' fill='%23297ab6'/%3E%3Crect x='4' y='4' width='3.4' height='8' rx='0.8' fill='%23ffffff' fill-opacity='0.92'/%3E%3Crect x='8.6' y='4' width='3.4' height='5' rx='0.8' fill='%23ffffff' fill-opacity='0.92'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f3;
    --bg-raised: #ffffff;
    --bg-sunken: #ececea;
    --border: #d8d8d4;
    --text: #1a1a18;
    --text-dim: #63635c;
    --text-faint: #93938a;
    --accent: #1c5d8c;
    --accent-bg: #e4eef6;
    --danger: #9c3b28;
    --danger-bg: #f6e6e2;
    --warn: #8a6a1d;
    --warn-bg: #f6efdd;
    --ok: #2c6e3f;
    --ok-bg: #e5f1e8;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --bg-raised: #1f2124;
      --bg-sunken: #131415;
      --border: #33363a;
      --text: #e7e7e4;
      --text-dim: #a3a39c;
      --text-faint: #6e6e68;
      --accent: #6badde;
      --accent-bg: #1d3245;
      --danger: #e0806e;
      --danger-bg: #3a231f;
      --warn: #d8b458;
      --warn-bg: #3a3220;
      --ok: #7fc394;
      --ok-bg: #1f3527;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 1px 2px rgba(0, 0, 0, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--sans);
    min-height: 100vh;
  }
  code, .mono, .ids, td.id, td.evidence, .evidence-list, .event-line time { font-family: var(--mono); }
  a { color: var(--accent); }
  button, select, input {
    font: inherit;
    color: inherit;
  }
  header#gw-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
  }
  header#gw-header h1 {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin: 0;
  }
  header#gw-header .meta { color: var(--text-dim); font-size: 0.82rem; }
  header#gw-header .totals { display: flex; gap: 0.9rem; margin-left: auto; font-size: 0.82rem; color: var(--text-dim); }
  header#gw-header .totals b { color: var(--text); }
  /* T-0055: the header is sticky at the top of the page scroll, and anything
     the browser scrolls into view -- a Tab-focus landing on a deep card, a
     find-in-page hit -- used to slide underneath it, hiding the card's id
     and title. The scroller reserves the bar's height for every target
     (scroll-padding-top), and the repeated scroll targets reserve it again
     locally (scroll-margin-top) so a future target cannot forget. */
  html { scroll-padding-top: 3.5rem; }
  .card, .brief-row, table.gw-table tbody tr { scroll-margin-top: 3.5rem; }
  .snapshot-pill {
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    border-radius: 1rem;
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn);
    white-space: nowrap;
  }
  .live-pill {
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    border-radius: 1rem;
    background: var(--ok-bg);
    color: var(--ok);
    border: 1px solid var(--ok);
    white-space: nowrap;
  }
  nav#gw-tabs {
    display: flex;
    gap: 0.25rem;
    padding: 0.4rem 1.25rem 0;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  nav#gw-tabs button {
    background: none;
    border: none;
    padding: 0.5rem 0.75rem;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    font-size: 0.85rem;
    white-space: nowrap;
  }
  nav#gw-tabs button:hover { color: var(--text); }
  nav#gw-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  /* T-0064: the tab bar already scrolled at 390px, but nothing said so --
     the clipped Export tab just looked broken. The scrollbar is now always
     drawn (thin on desktop, visibly thumb-styled), and a phone loses the
     wide per-tab padding that pushes the last tab off the edge in the
     first place. */
  nav#gw-tabs { scrollbar-width: thin; scrollbar-color: var(--text-faint) transparent; }
  nav#gw-tabs::-webkit-scrollbar { height: 6px; }
  nav#gw-tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  nav#gw-tabs::-webkit-scrollbar-track { background: transparent; }
  @media (max-width: 480px) {
    nav#gw-tabs { padding: 0.4rem 0.5rem 0; }
    nav#gw-tabs button { padding: 0.5rem 0.5rem; }
  }

  #gw-filters {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
    padding: 0.6rem 1.25rem;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
  }
  #gw-filters select, #gw-filters input[type="search"] {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
  }
  #gw-filters input[type="search"] { min-width: 14rem; flex: 1 1 14rem; }
  #gw-filters .clear-filters {
    background: none;
    border: 1px solid var(--border);
    border-radius: 0.35rem;
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    cursor: pointer;
  }

  main#gw-view { padding: 1.1rem 1.25rem 3rem; }

  /* Overview */
  .overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
  .overview-card {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.9rem 1rem;
    box-shadow: var(--shadow);
  }
  .overview-card h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 0.6rem; }
  .count-row { display: flex; justify-content: space-between; padding: 0.2rem 0; font-size: 0.85rem; border-bottom: 1px dashed var(--border); }
  .count-row:last-child { border-bottom: none; }
  .count-row .bar { flex: 1; margin: 0 0.6rem; background: var(--bg-sunken); border-radius: 0.2rem; overflow: hidden; height: 0.5rem; align-self: center; }
  .count-row .bar span { display: block; height: 100%; background: var(--accent); }
  /* Overview (P8-13): the headline answers "what should I do next", the four
     census charts move behind a <details> toggle below it. Never deleted --
     see renderOverview -- just no longer the first thing on screen. */
  .overview-section { margin-bottom: 1.1rem; }
  .overview-heading { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 0.6rem; }
  .overview-distribution { margin-top: 0.4rem; }
  .overview-distribution > summary { cursor: pointer; font-size: 0.8rem; color: var(--accent); padding: 0.3rem 0; }
  .overview-distribution .overview-grid { margin-top: 0.7rem; }
  .brief-row { cursor: pointer; gap: 0.6rem; }
  .brief-row:hover { color: var(--accent); }
  /* T-0021: without min-width: 0 a flex item's automatic minimum is its
     content, so one unbroken 118-character title resists the ellipsis below
     and pushes the card past the viewport. The span may now actually shrink;
     the full title stays in the aria-label and the detail panel. */
  .brief-row span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brief-row span:last-child { color: var(--text-faint); white-space: nowrap; }
  .brief-card .meta { color: var(--text-dim); font-size: 0.82rem; }
  /* T-0054: the section expander is a real control now, so it reads as one. */
  .brief-more {
    background: none;
    border: none;
    padding: 0.25rem 0 0;
    color: var(--accent);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .brief-more:hover { text-decoration: underline; text-underline-offset: 2px; }

  /* Board */
  /* T-0059: a board with one long column used to become one endless strip --
     a 111-card Backlog rendered ~16000px tall beside five empty lanes, and
     roughly 80% of the viewport at any scroll position was bare background.
     The board is a pipeline, so wrapping the columns would break the
     left-to-right reading, and auto-scrolling to the populated ones is
     motion the reader never asked for (and still leaves the void). Instead
     the board is scoped to the viewport: every column is a lane as tall as
     the visible screen, and a long column scrolls inside its own lane. All
     stages stay visible at once, which is the whole point of a board. */
  #board {
    display: flex;
    gap: 0.75rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    align-items: stretch;
    max-height: calc(100vh - 11rem);
    min-height: 12rem;
  }
  .column {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    min-width: 240px;
    max-width: 260px;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  /* A terminal column collapsed to its recent handful gets its width back to
     the non-terminal columns that matter -- see terminalStageIds() and
     renderBoard(). Never so narrow the count or the toggle wrap. */
  .column.collapsed { min-width: 150px; max-width: 170px; }
  .column-head {
    padding: 0.55rem 0.7rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.4rem;
    position: sticky;
    top: 0;
    flex-shrink: 0;
    background: var(--bg-raised);
    border-radius: 0.5rem 0.5rem 0 0;
  }
  .column-head .column-head-main { display: flex; gap: 0.4rem; align-items: baseline; overflow: hidden; text-overflow: ellipsis; }
  .column-head .count { color: var(--text-faint); font-weight: 400; }
  .column-toggle {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text-dim);
    border-radius: 0.3rem;
    padding: 0.1rem 0.4rem;
    font-size: 0.68rem;
    cursor: pointer;
    white-space: nowrap;
  }
  /* T-0059: the lane body is what scrolls now, so a long column never grows
     the page. The header stays pinned above it because it is outside this
     scroll container, not because of the sticky fallback above. */
  .column-body { padding: 0.5rem; display: flex; flex-direction: column; gap: 0.5rem; min-height: 2rem; overflow-y: auto; }
  .card {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
    padding: 0.5rem 0.6rem;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .card:hover { border-color: var(--accent); }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: 0.4; cursor: grabbing; }
  /* While a drag is in flight the columns say which of them would accept it.
     An invalid column is dimmed and carries the refusal as its tooltip; the
     drop itself is refused by dragover, not by the server round trip. */
  #board.dragging .column { transition: opacity 0.1s ease; }
  #board.dragging .column.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
  #board.dragging .column.drop-ok.drop-over { background: var(--accent-bg); }
  /* A backward drop is offered too (P8-18), but it must never read like an
     ordinary forward move: warn colors instead of accent, everywhere this
     drag is reflected. */
  #board.dragging .column.drop-back { outline: 2px dashed var(--warn); outline-offset: -2px; }
  #board.dragging .column.drop-back.drop-over { background: var(--warn-bg); }
  #board.dragging .column.drop-back .column-head::after { content: '\21b6 backward'; color: var(--warn); margin-left: 0.35rem; font-weight: 400; font-size: 0.7rem; }
  #board.dragging .column.drop-invalid { opacity: 0.4; cursor: not-allowed; }
  #board.dragging .column.drop-invalid .column-head::after { content: '✕'; color: var(--text-faint); margin-left: 0.35rem; }
  #board.dragging .column.drop-source { outline: 1px dashed var(--border); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { #board.dragging .column { transition: none; } }
  #gw-drop-refusal {
    position: fixed;
    right: 1rem;
    bottom: 1rem;
    z-index: 120;
    max-width: 26rem;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 0.5rem;
    padding: 0.6rem 1.6rem 0.6rem 0.75rem;
    box-shadow: var(--shadow);
    font-size: 0.8rem;
  }
  #gw-drop-refusal h4 { margin: 0 0 0.3rem; font-size: 0.8rem; }
  #gw-drop-refusal ul { margin: 0; padding-left: 1.1rem; }
  #gw-drop-refusal .close-btn { position: absolute; top: 0.15rem; right: 0.4rem; background: none; border: none; color: inherit; cursor: pointer; font-size: 1rem; line-height: 1; }
  .card.card-child { margin-left: 0.8rem; border-left: 3px solid var(--border); }
  .card.card-moved { animation: card-moved 1.6s ease-out; }
  @keyframes card-moved { from { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); } to { border-color: var(--border); box-shadow: none; } }
  @media (prefers-reduced-motion: reduce) { .card.card-moved { animation: none; border-color: var(--accent); } }
  .card .card-id { font-family: var(--mono); font-size: 0.74rem; color: var(--text-dim); }
  /* T-0021: a title that is one very long word has no break points, so it
     paints past the 260px column and becomes horizontal scroll on a phone.
     `anywhere` (not break-word) also shrinks min-content, which is what lets
     the auto-layout table give its title column room back. Titles wrap, so
     nothing is truncated and no title attribute is needed. */
  .card .card-title { margin: 0.15rem 0 0.35rem; font-weight: 500; overflow-wrap: anywhere; }
  .card .card-meta { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; font-size: 0.7rem; color: var(--text-dim); }
  .tag {
    display: inline-block;
    padding: 0.05rem 0.35rem;
    border-radius: 0.25rem;
    background: var(--bg-raised);
    border: 1px solid var(--border);
  }
  .tag.flag-blocked, .tag.flag-conflict { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
  .tag.flag-needs-triage, .tag.flag-paused { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }

  /* Table */
  table.gw-table { width: 100%; border-collapse: collapse; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; }
  table.gw-table th, table.gw-table td { text-align: left; padding: 0.45rem 0.65rem; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
  /* T-0021: the title cell is the one column whose content has no natural
     width limit; without break opportunities it forces the table wider than
     the viewport. `anywhere` lets that one column shrink and the title wrap.
     T-0027 (reopened): the rule used to sit on EVERY td, which is how every
     column got permission to break words mid-word and crush to one
     character -- "featur/e", "B/l/o/c/k/e/d". The short vocab columns have
     natural min-content widths (their longest word); only the title needs
     the emergency break, inside its own 13rem floor. */
  table.gw-table td.cell-title { overflow-wrap: anywhere; }
  table.gw-table th { cursor: pointer; user-select: none; color: var(--text-dim); font-weight: 600; white-space: nowrap; }
  table.gw-table th.sorted { color: var(--text); }
  table.gw-table tbody tr:hover { background: var(--bg-sunken); cursor: pointer; }
  table.gw-table td.id { white-space: nowrap; }
  /* Table row actions (P8-14): claim/release and a move picker, so a row can
     change something without opening the item's panel. */
  table.gw-table td.row-actions-cell { white-space: nowrap; }
  .row-actions { display: inline-flex; gap: 0.3rem; margin-right: 0.35rem; }
  .row-actions button, select.row-move {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text);
    border-radius: 0.3rem;
    padding: 0.15rem 0.4rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  select.row-move { max-width: 10rem; }
  /* T-0027 (reopened): overflow on the container was never the whole bug --
     the table itself had to be willing to shrink, and it was: width:100%
     plus overflow-wrap:anywhere let every column crush to a single
     character and still call the result "no overflow". A table cannot be
     allowed to negotiate its own readability away, so two floors hold:
     the table keeps a minimum width of its own (the container scrolls
     beyond it), and the Title column keeps a minimum wide enough to show
     words -- the earlier failure was "B/l/o/c/k/e/d" at 30px. */
  table.gw-table { min-width: 640px; }
  table.gw-table th.cell-title, table.gw-table td.cell-title { min-width: 13rem; }
  /* T-0027: the table scrolls in its own lane so the page never does. On a
     phone the action controls also give up their nowrap and wrap onto two
     lines instead of holding the column -- and the whole table -- wide. */
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 480px) {
    table.gw-table td.row-actions-cell { white-space: normal; }
    .row-actions { flex-wrap: wrap; }
    select.row-move { max-width: 8rem; }
  }

  /* Stages & rules */
  .stage-rule {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    margin-bottom: 0.6rem;
  }
  .stage-rule h3 { margin: 0 0 0.25rem; font-size: 0.88rem; }
  .stage-rule .exit { color: var(--text-dim); font-size: 0.82rem; margin: 0 0 0.4rem; }
  .stage-rule .requires { font-family: var(--mono); font-size: 0.76rem; color: var(--text-dim); white-space: pre-wrap; margin: 0.35rem 0 0; }
  .stage-rule .flags { font-size: 0.72rem; color: var(--text-faint); margin-top: 0.3rem; }
  /* The sentences are the point of this view; the JSON is the footnote. */
  .stage-rule .gate-sentences { margin: 0.3rem 0 0.45rem; padding-left: 1.1rem; font-size: 0.85rem; }
  .stage-rule .gate-sentences li { margin: 0.12rem 0; }
  .stage-rule .gate-missing { font-size: 0.82rem; color: var(--text-dim); margin: 0.3rem 0 0.45rem; }
  details.machine-rule { margin-top: 0.35rem; }
  details.machine-rule > summary { cursor: pointer; font-size: 0.72rem; color: var(--text-faint); }
  details.machine-rule ul { margin: 0.3rem 0 0; padding-left: 1.1rem; font-family: var(--mono); font-size: 0.72rem; color: var(--text-dim); }

  /* Export */
  .export-panel { max-width: 40rem; }
  .export-panel button { background: var(--accent); color: #fff; border: none; padding: 0.5rem 0.9rem; border-radius: 0.4rem; cursor: pointer; font-size: 0.85rem; }

  /* Empty state */
  #gw-empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text-dim);
  }
  #gw-empty h2 { color: var(--text); }
  #gw-empty code { background: var(--bg-sunken); padding: 0.1rem 0.4rem; border-radius: 0.3rem; }

  /* Item panel (drawer) */
  #gw-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    display: none;
    z-index: 100;
  }
  #gw-overlay.open { display: block; }
  #gw-panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(480px, 100vw);
    background: var(--bg-raised);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform 0.15s ease;
    z-index: 101;
    padding: 1rem 1.25rem 2.5rem;
    /* T-0021: inherited, so the item title, field values and evidence chips
       all break instead of pushing the drawer's fixed width sideways. */
    overflow-wrap: anywhere;
  }
  #gw-overlay.open #gw-panel { transform: translateX(0); }
  #gw-panel .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
  #gw-panel h2 { margin: 0; font-size: 1.05rem; }
  #gw-panel .close-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: var(--text-dim); }
  #gw-panel .readonly-banner {
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 0.4rem;
    padding: 0.5rem 0.7rem;
    font-size: 0.78rem;
    margin: 0.6rem 0;
  }
  #gw-panel .readonly-banner code { font-family: var(--mono); }
  #gw-panel dl { display: grid; grid-template-columns: 7rem 1fr; gap: 0.3rem 0.6rem; font-size: 0.82rem; margin: 0.8rem 0; }
  #gw-panel dt { color: var(--text-dim); }
  #gw-panel dd { margin: 0; }
  #gw-panel .stage-buttons { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; align-items: flex-start; }
  /* T-0078: the button and its reasons have to survive as one visual unit
     wherever the flex-wrap flow puts them. In the bare wrap, a disabled
     button's reason could sit directly under a NEIGHBOURING button's slot --
     a faint button reads as nothing, so the eye attached the reason to the
     last prominent (enabled) button above it, and "Merged" appeared to be
     the move being refused. A boundary around each pair makes the
     association geometric, not a reading habit. */
  #gw-panel .stage-button-wrap {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    max-width: 13rem;
    padding: 0.4rem 0.5rem;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    border-radius: 0.4rem;
  }
  #gw-panel .stage-buttons button {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    border-radius: 0.35rem;
    padding: 0.3rem 0.55rem;
    font-size: 0.76rem;
    color: var(--text-faint);
    cursor: not-allowed;
  }
  #gw-panel .stage-buttons button:not([disabled]) {
    color: #fff;
    background: var(--accent);
    border-color: var(--accent);
    cursor: pointer;
  }
  /* Backward moves are offered (P8-18) but must never be mistaken for a
     forward one: warn colors and a back-arrow label, on the button itself and
     wherever its reason is explained. */
  #gw-panel .stage-buttons button.move-back:not([disabled]) {
    color: var(--warn);
    background: var(--warn-bg);
    border-color: var(--warn);
  }
  #gw-panel .stage-reason { font-size: 0.72rem; color: var(--text-dim); }
  #gw-panel .stage-reason.stage-reason-back { color: var(--warn); }
  #gw-panel .stage-reason .reason-head { display: block; color: var(--text-faint); }
  #gw-panel .stage-reason ul { margin: 0.1rem 0 0; padding-left: 1rem; }
  #gw-panel .stage-reason li { margin: 0.1rem 0; }
  /* Where an unmet gate maps to an action the board can perform (P8-15),
     e.g. "needs an owner" becomes a Claim button right next to the sentence. */
  #gw-panel .stage-reason .reason-action {
    margin-left: 0.4rem;
    border: 1px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 0.3rem;
    padding: 0.03rem 0.4rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  #gw-panel .stage-refusal:empty { display: none; }
  .refusal {
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 0.35rem;
    padding: 0.35rem 0.55rem;
    font-size: 0.76rem;
    margin: 0.3rem 0;
    font-family: var(--mono);
  }
  #gw-panel h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 1rem 0 0.35rem; }
  #gw-panel .event-line { display: flex; gap: 0.5rem; font-size: 0.76rem; padding: 0.2rem 0; border-bottom: 1px dashed var(--border); }
  #gw-panel .event-line time { color: var(--text-faint); white-space: nowrap; }
  #gw-panel .panel-actions { margin: 0.6rem 0; }
  #gw-panel .panel-actions button {
    border: 1px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 0.35rem;
    padding: 0.35rem 0.7rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #gw-panel .evidence-list { list-style: none; margin: 0.3rem 0; padding: 0; }
  #gw-panel .evidence-list li.evidence-chip { font-family: var(--mono); font-size: 0.78rem; padding: 0.15rem 0; }
  /* T-0062: the gate each entry paid for, next to the text that paid for it. */
  #gw-panel .evidence-list li.evidence-chip .evidence-gate { margin-left: 0.4rem; font-family: var(--sans); font-size: 0.7rem; }
  #gw-panel .evidence-add, #gw-panel .note-add { display: flex; gap: 0.4rem; margin: 0.4rem 0 0.8rem; }
  #gw-panel .evidence-add input, #gw-panel .note-add textarea {
    flex: 1;
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
  }
  #gw-panel .evidence-add button, #gw-panel .note-add button, #gw-panel #save-fields-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 0.35rem;
    padding: 0.3rem 0.6rem;
    font-size: 0.78rem;
    cursor: pointer;
    align-self: flex-start;
  }
  #gw-panel dd input { width: 100%; background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text); border-radius: 0.3rem; padding: 0.2rem 0.4rem; font-size: 0.8rem; }
  #gw-panel .field-refusal:empty { display: none; }
  #gw-panel .notes-body { white-space: pre-wrap; font-size: 0.8rem; background: var(--bg-sunken); border-radius: 0.35rem; padding: 0.5rem 0.6rem; margin: 0.3rem 0; }
  #gw-panel .run-log { white-space: pre-wrap; word-break: break-word; font-size: 0.74rem; background: var(--bg-sunken); border-radius: 0.35rem; padding: 0.5rem 0.6rem; margin: 0.3rem 0; max-height: 16rem; overflow-y: auto; }
  #gw-panel .panel-actions.triage button { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
  #gw-panel #panel-error:empty { display: none; }
  .create-form { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
  /* T-0081: the hold that an unclassified creation earns, stated in the
     form itself. Warn colours: it is a cost the creator can avoid. */
  .create-hold-note {
    color: var(--warn);
    background: var(--warn-bg);
    border: 1px solid var(--warn);
    border-radius: 0.4rem;
    padding: 0.45rem 0.6rem;
    font-size: 0.78rem;
  }
  .create-form label { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.78rem; color: var(--text-dim); }
  .create-form input, .create-form select, .create-form textarea {
    background: var(--bg-sunken);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.35rem 0.5rem;
    font-size: 0.85rem;
  }
  .create-form button[type="submit"] {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 0.4rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.85rem;
    cursor: pointer;
    align-self: flex-start;
  }
  .card-actions { margin-top: 0.4rem; }
  .card-actions button {
    border: 1px solid var(--accent);
    background: var(--accent-bg);
    color: var(--accent);
    border-radius: 0.3rem;
    padding: 0.15rem 0.5rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .tag.badge-queued { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
  /* "Nothing is running" is information, not an absence: it gets a chip of its
     own so a card never leaves the question open. */
  .tag.badge-idle { color: var(--text-faint); border-style: dashed; }
  /* A Play that can only queue must not look like a Play that starts work. */
  .card-actions button.secondary, #gw-panel .panel-actions button.secondary {
    border-color: var(--border);
    background: var(--bg-sunken);
    color: var(--text-dim);
  }
  /* Running must be visually distinct from queued: one is costing money right
     now, the other is waiting for a scheduler tick. */
  .tag.badge-running { color: #7ee787; border-color: #2ea043; background: rgba(46,160,67,0.15); }
  #gw-pause-btn {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text);
    border-radius: 0.35rem;
    padding: 0.25rem 0.6rem;
    font-size: 0.78rem;
    cursor: pointer;
  }
  #gw-pause-banner {
    background: var(--warn-bg);
    color: var(--warn);
    border-bottom: 1px solid var(--warn);
    padding: 0.45rem 1.25rem;
    font-size: 0.82rem;
    text-align: center;
  }
  /* Admin editors -- stages, gates, settings. These are the controls that
     change the RULES of the board rather than the work on it, so they are
     only ever rendered when /api/state says admin.allowed. */
  .admin-notice {
    background: var(--warn-bg);
    color: var(--warn);
    border: 1px solid var(--warn);
    border-radius: 0.4rem;
    padding: 0.55rem 0.75rem;
    font-size: 0.8rem;
    margin: 0 0 0.8rem;
    max-width: 52rem;
  }
  .admin-notice code { font-family: var(--mono); }
  .admin-error {
    color: var(--danger);
    background: var(--danger-bg);
    border: 1px solid var(--danger);
    border-radius: 0.35rem;
    padding: 0.45rem 0.6rem;
    font-size: 0.78rem;
    margin: 0.4rem 0 0;
    white-space: pre-wrap;
    font-family: var(--mono);
  }
  .admin-error:empty { display: none; }
  .stage-rule .stage-head { display: flex; align-items: baseline; gap: 0.5rem; }
  .stage-rule .stage-head h3 { flex: 1; margin-bottom: 0; }
  .stage-tools { display: flex; gap: 0.25rem; }
  .stage-tools button, .admin-btn {
    border: 1px solid var(--border);
    background: var(--bg-sunken);
    color: var(--text);
    border-radius: 0.3rem;
    padding: 0.15rem 0.45rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .stage-tools button[disabled] { color: var(--text-faint); cursor: not-allowed; }
  .stage-tools button.danger { color: var(--danger); border-color: var(--danger); }
  details.stage-editor { margin-top: 0.5rem; }
  details.stage-editor > summary { cursor: pointer; font-size: 0.76rem; color: var(--accent); }
  .editor-grid { display: grid; grid-template-columns: 11rem 1fr; gap: 0.4rem 0.7rem; align-items: center; margin: 0.5rem 0; font-size: 0.8rem; }
  .editor-grid > label { color: var(--text-dim); }
  .editor-grid input[type="text"], .editor-grid input[type="number"], .editor-grid select {
    background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text);
    border-radius: 0.3rem; padding: 0.25rem 0.4rem; font-size: 0.8rem; width: 100%;
  }
  .editor-grid input[type="checkbox"] { justify-self: start; }
  .editor-note { grid-column: 1 / -1; color: var(--text-faint); font-size: 0.74rem; }
  .editor-actions { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.4rem; }
  .editor-actions button.primary { background: var(--accent); color: #fff; border: none; border-radius: 0.35rem; padding: 0.3rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
  .gate-readback { background: var(--bg-sunken); border-radius: 0.35rem; padding: 0.4rem 0.6rem; margin: 0.4rem 0 0; }
  .gate-readback h4 { margin: 0 0 0.2rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); }
  .gate-readback ul { margin: 0; padding-left: 1.1rem; font-size: 0.82rem; }
  .add-stage { background: var(--bg-raised); border: 1px dashed var(--border); border-radius: 0.5rem; padding: 0.75rem 1rem; margin-top: 0.8rem; max-width: 52rem; }
  .add-stage h3 { margin: 0 0 0.3rem; font-size: 0.85rem; }

  /* Settings */
  .settings-panel { max-width: 52rem; }
  .setting-row { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.6rem 0.85rem; margin-bottom: 0.5rem; }
  .setting-row .setting-key { display: block; font-family: var(--mono); font-size: 0.82rem; font-weight: 600; }
  .setting-row .setting-summary { color: var(--text-dim); font-size: 0.78rem; margin: 0.15rem 0 0.35rem; }
  .setting-row .setting-danger { color: var(--warn); background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 0.3rem; padding: 0.3rem 0.5rem; font-size: 0.76rem; margin: 0.3rem 0; }
  .setting-row .setting-range { color: var(--text-faint); font-size: 0.74rem; margin-left: 0.4rem; }
  .setting-row input[type="text"], .setting-row input[type="number"], .setting-row select {
    background: var(--bg-sunken); border: 1px solid var(--border); color: var(--text);
    border-radius: 0.3rem; padding: 0.25rem 0.45rem; font-size: 0.8rem; min-width: 16rem;
  }
  .setting-row .setting-value { font-family: var(--mono); font-size: 0.8rem; }
  .settings-save { position: sticky; bottom: 0; background: var(--bg); padding: 0.6rem 0; }
  .settings-save button { background: var(--accent); color: #fff; border: none; border-radius: 0.4rem; padding: 0.45rem 0.9rem; font-size: 0.85rem; cursor: pointer; }

  /* Glossary legend, shown wherever codes are aggregated into a chart. */
  .glossary-legend { margin: 0.6rem 0 0; padding: 0.45rem 0 0; border-top: 1px solid var(--border); font-size: 0.74rem; color: var(--text-dim); }
  .glossary-legend dl { display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.5rem; margin: 0; }
  .glossary-legend dt { font-family: var(--mono); color: var(--text); }
  .glossary-legend dd { margin: 0; }

  .hidden { display: none !important; }
  /* T-0017: a visible label for controls whose label would only duplicate
     what is already on screen (the Evidence heading, the filter bar), and a
     focus ring for the two role="button" mentions whose keyboard focus the
     default outline would otherwise draw at odd offsets. */
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .card:focus-visible, .brief-row:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
  }
  table.gw-table td.id button.id-open {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-family: var(--mono);
    color: var(--accent);
    cursor: pointer;
  }
  table.gw-table td.id button.id-open:hover { text-decoration: underline; text-underline-offset: 2px; }

  /* ============================================================
     T-0060 — glass treatment (Rahil's reference dashboard)
     One material, laid over the existing rules so the tags, stage
     colours and every queried class are untouched. The glass is a
     background treatment: translucent panel fills over a warm
     dark-to-darker gradient, a hairline top edge highlight, layered
     shadows for depth, 14-18px corners.
     Fallback contract: every glass surface first gets a solid-ish
     --glass-base fill, and the translucency + backdrop-filter only
     switch on inside @supports -- where the filter is not supported
     (or the reader asks for reduced transparency) the panels stay
     legible opaque surfaces, never a washed blur.
     ============================================================ */
  :root {
    --glass-radius-panel: 16px;
    --glass-radius-card: 14px;
    --glass-edge: rgba(255, 255, 255, 0.17);
    --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.14);
    --glass-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.22);
    /* Solid-ish base: high enough alpha to carry text on its own. */
    --glass-base: rgba(34, 36, 40, 0.93);
    --glass-base-head: rgba(28, 30, 33, 0.97);
    --glass-fill: rgba(40, 42, 47, 0.46);
    --glass-fill-head: rgba(26, 28, 31, 0.72);
    --glass-sunken: rgba(18, 19, 21, 0.55);
    --glass-backdrop: blur(18px) saturate(150%);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --glass-edge: rgba(255, 255, 255, 0.85);
      --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);
      --glass-shadow: 0 8px 24px rgba(64, 54, 36, 0.14), 0 2px 6px rgba(64, 54, 36, 0.08);
      --glass-base: rgba(252, 251, 248, 0.94);
      --glass-base-head: rgba(250, 248, 244, 0.97);
      --glass-fill: rgba(252, 251, 248, 0.62);
      --glass-fill-head: rgba(250, 248, 244, 0.78);
      --glass-sunken: rgba(238, 235, 228, 0.6);
    }
  }
  body {
    /* Warm-to-dark gradient backdrop, not flat black; fixed so the panels
       blur one steady scene instead of resampling on every scroll. */
    background:
      radial-gradient(120% 90% at 18% 0%, rgba(128, 94, 52, 0.26) 0%, rgba(128, 94, 52, 0) 58%),
      radial-gradient(90% 70% at 85% 100%, rgba(96, 74, 52, 0.16) 0%, rgba(96, 74, 52, 0) 60%),
      linear-gradient(168deg, #2c2925 0%, #1e1f21 48%, #141517 100%);
    background-attachment: fixed;
  }
  @media (prefers-color-scheme: light) {
    body {
      background:
        radial-gradient(120% 90% at 18% 0%, rgba(196, 156, 96, 0.18) 0%, rgba(196, 156, 96, 0) 55%),
        linear-gradient(168deg, #f7f4ee 0%, #f0ede6 55%, #e7e3da 100%);
      background-attachment: fixed;
    }
  }
  header#gw-header,
  .column,
  #gw-panel,
  .overview-card,
  table.gw-table,
  .stage-rule,
  .export-panel {
    background: var(--glass-base);
    border: 1px solid var(--glass-edge);
    box-shadow: var(--glass-shadow), var(--glass-highlight);
  }
  header#gw-header { border-radius: 0; border-width: 0 0 1px; }
  #gw-panel { border-width: 1px 0 0; }
  .column { border-radius: var(--glass-radius-panel); }
  .overview-card { border-radius: var(--glass-radius-card); }
  .stage-rule { border-radius: var(--glass-radius-card); }
  table.gw-table { border-radius: var(--glass-radius-card); }
  .export-panel { border-radius: var(--glass-radius-card); }
  .column-head {
    /* Sticky head over a translucent lane: it needs near-solid fill of its
       own or scrolled cards would ghost through it. */
    background: var(--glass-base-head);
    border-radius: calc(var(--glass-radius-panel) - 1px) calc(var(--glass-radius-panel) - 1px) 0 0;
  }
  .card { background: var(--glass-sunken); border-radius: 10px; }
  table.gw-table tbody tr:hover { background: rgba(255, 255, 255, 0.04); }
  @media (prefers-color-scheme: light) {
    table.gw-table tbody tr:hover { background: rgba(38, 36, 30, 0.05); }
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header#gw-header,
    .column,
    #gw-panel,
    .overview-card,
    table.gw-table,
    .stage-rule,
    .export-panel {
      background: var(--glass-fill);
      -webkit-backdrop-filter: var(--glass-backdrop);
      backdrop-filter: var(--glass-backdrop);
    }
    .column-head { background: var(--glass-fill-head); -webkit-backdrop-filter: var(--glass-backdrop); backdrop-filter: var(--glass-backdrop); }
  }
  @media (prefers-reduced-transparency: reduce) {
    header#gw-header, .column, #gw-panel, .overview-card, table.gw-table, .stage-rule, .export-panel, .column-head {
      background: var(--glass-base-head);
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
  }
</style>
</head>
<body>
  <header id="gw-header">
    <h1>gatewright</h1>
    <span class="meta" id="gw-snapshot-meta"></span>
    <span class="totals" id="gw-totals"></span>
    <button id="gw-pause-btn" class="hidden"></button>
  </header>
  <div id="gw-pause-banner" class="hidden" role="status"></div>

  <nav id="gw-tabs">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="board">Board</button>
    <button data-view="table">Table</button>
    <button data-view="stages">Stages &amp; rules</button>
    <button data-view="settings">Settings</button>
    <button data-view="export">Export</button>
  </nav>

  <div id="gw-filters">
    <label class="sr-only" for="f-phase">Filter by phase</label>
    <select id="f-phase"><option value="">phase: all</option></select>
    <label class="sr-only" for="f-type">Filter by type</label>
    <select id="f-type"><option value="">type: all</option></select>
    <label class="sr-only" for="f-stage">Filter by stage</label>
    <select id="f-stage"><option value="">stage: all</option></select>
    <label class="sr-only" for="f-flag">Filter by flag</label>
    <select id="f-flag"><option value="">flag: all</option></select>
    <label class="sr-only" for="f-search">Search items</label>
    <input type="search" id="f-search" placeholder="search id / title / scope">
    <button class="clear-filters" id="f-clear">clear</button>
    <button class="clear-filters hidden" id="f-new">+ new item</button>
  </div>

  <main id="gw-view"></main>

  <div id="gw-empty" class="hidden">
    <h2>No items yet</h2>
    <p>Add your first item with <code>gw add "&lt;title&gt;"</code>, then <code>gw open</code> again to refresh this snapshot.</p>
  </div>

  <div id="gw-overlay">
    <div id="gw-panel" role="dialog" aria-label="Item detail"></div>
  </div>

  <div id="gw-drop-refusal" class="hidden" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  function readBlock(id) {
    const el = document.getElementById(id);
    if (!el) return null;
    const text = el.textContent.trim();
    if (!text) return null;
    try { return JSON.parse(text); } catch { return null; }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  // Evidence entries are `{ text, stage }` objects on every board
  // lib/store.js reads (it normalises on read), but `import` still accepts
  // plain strings and the panel's own pending-evidence entries are strings
  // until the next move posts them -- so both shapes reach the viewer, and
  // every reader of an entry goes through here. String(entry) is what turned
  // the panel into a wall of [object Object] the night the shape changed.
  function evidenceText(e) {
    if (e && typeof e === 'object') return typeof e.text === 'string' ? e.text : '';
    return e == null ? '' : String(e);
  }

  // Which gate an entry paid for -- the whole point of the new shape. Null
  // for legacy strings and pending entries, which have not been attributed
  // to a gate yet.
  function evidenceStage(e) {
    return e && typeof e === 'object' && typeof e.stage === 'string' && e.stage ? e.stage : null;
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      return d.toLocaleString(undefined, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function stageList(stages) { return [...(stages.stages || []), ...(stages.extra || [])]; }
  function nextStageId(stages, id) {
    const i = (stages.stages || []).findIndex((s) => s.id === id);
    return i >= 0 ? (stages.stages[i + 1] ? stages.stages[i + 1].id : null) : null;
  }

  const STAGE_LABEL_FALLBACK = (id) => id;

  // -- glossary ------------------------------------------------------------
  // `G0`, `P1` and `defect` are the user's own vocabulary, and a list of
  // strings cannot explain itself. config.glossary is an OPTIONAL
  // field -> code -> sentence map, so these two helpers mirror
  // lib/glossary.js exactly, including how it degrades: a missing block, a
  // string where a map should be, a number where a sentence should be, all
  // mean "no description", and a code with no entry renders exactly as it did
  // before. test/viewer.test.js runs both implementations over the same
  // configs and compares them, because two notions of "described" in one
  // product is how a board starts inventing help text.
  // The vocab fields a glossary may describe, as lib/glossary.js declares them.
  const GLOSSARY_FIELDS = ['phase', 'priority', 'type'];

  function glossaryFor(field) {
    const config = State.config;
    if (!config || typeof config !== 'object' || Array.isArray(config)) return {};
    const block = config.glossary;
    if (!block || typeof block !== 'object' || Array.isArray(block)) return {};
    const entries = block[field];
    if (!entries || typeof entries !== 'object' || Array.isArray(entries)) return {};
    const described = {};
    for (const code of Object.keys(entries)) {
      if (code === '__proto__') continue;
      const description = entries[code];
      if (typeof description !== 'string' || !description.trim()) continue;
      described[code] = description.trim();
    }
    return described;
  }

  function describeTerm(field, value) {
    if (typeof value !== 'string' || !value) return null;
    const described = glossaryFor(field);
    return Object.prototype.hasOwnProperty.call(described, value) ? described[value] : null;
  }

  // The tooltip for one rendered code, or nothing at all when the board has
  // not been told what the code means.
  function termTitle(field, value) {
    const description = field ? describeTerm(field, value) : null;
    return description ? ' title="' + escapeHtml(description) + '"' : '';
  }

  // Where codes are aggregated -- the Overview charts -- a tooltip is not
  // enough, because the reader has no reason to hover something they do not
  // know is explainable. Those get the descriptions on screen.
  function glossaryLegend(field, codes) {
    if (!field) return '';
    const described = [];
    for (const code of codes) {
      const description = describeTerm(field, code);
      if (description) described.push([code, description]);
    }
    if (!described.length) return '';
    return '<div class="glossary-legend"><dl>' + described
      .map(([code, description]) => '<dt>' + escapeHtml(code) + '</dt><dd>' + escapeHtml(description) + '</dd>')
      .join('') + '</dl></div>';
  }

  // -- who may change the rules --------------------------------------------
  // One function decides this for every editor on the page, so the Stages view
  // and the Settings view cannot disagree about whether this browser is
  // allowed to change anything. 'snapshot' is a file written by `gw open` with
  // no server behind it; 'remote' is a live board reached from somewhere other
  // than the machine running `gw serve`, which the server refuses for stages
  // and settings whatever --host says.
  function adminMode() {
    if (!State.live) return 'snapshot';
    return State.admin && State.admin.allowed ? 'editable' : 'remote';
  }

  const ADMIN_REMOTE_NOTICE = 'stages and settings can only be changed on the machine running gw serve';

  function adminNotice(what) {
    const mode = adminMode();
    if (mode === 'editable') return '';
    if (mode === 'remote') {
      return '<div class="admin-notice">' + escapeHtml(ADMIN_REMOTE_NOTICE) + ' &mdash; this page is read-only for ' + escapeHtml(what) + '.</div>';
    }
    return '<div class="admin-notice">This is a static snapshot, so ' + escapeHtml(what) +
      ' cannot be changed here. Run <code>gw serve</code> on the machine holding the board to edit them.</div>';
  }

  function isEditorView() {
    return State.view === 'stages' || State.view === 'settings';
  }

  // -- stages.json, as a document -----------------------------------------
  // A verbatim copy of what the server last sent, minus the English gate
  // descriptions it adds on the way out (those are derived, they are not part
  // of stages.json and posting them back would put them in the file). This is
  // a structural copy and nothing more: it decides nothing about a stage, and
  // in particular it does not decide what "terminal" means -- terminalStageIds()
  // is still the only thing that does.
  function stagesDoc() {
    const doc = JSON.parse(JSON.stringify(State.stages || {}));
    delete doc.gates;
    if (!Array.isArray(doc.stages)) doc.stages = [];
    if (!Array.isArray(doc.extra)) doc.extra = [];
    return doc;
  }

  // Move one pipeline stage by `delta` positions. Returns a new array, and
  // returns the list untouched when the move would fall off either end, so a
  // button that cannot do anything cannot silently do something else.
  function movePipeline(list, id, delta) {
    const next = list.slice();
    const from = next.findIndex((stage) => stage.id === id);
    if (from < 0) return next;
    const to = from + delta;
    if (to < 0 || to >= next.length) return next;
    const [moved] = next.splice(from, 1);
    next.splice(to, 0, moved);
    return next;
  }

  // The rule keys this form edits. These are exactly the keys lib/rules.js
  // reads -- no more, because a key the evaluator ignores is a rule the board
  // would claim to enforce and does not, and no fewer, because a key only
  // reachable by hand-editing JSON is the problem this view exists to solve.
  // test/viewer.test.js pins this list against lib/rules.js itself.
  const RULE_KEYS = ['scope', 'owner', 'children_done', 'evidence_min', 'evidence_match', 'deps_at_least'];

  // Build a `requires` object from what the gate form holds. `existing` is the
  // stage's current requires, so any key this form does not know about is
  // carried through untouched rather than being deleted by a save that never
  // mentioned it. Returns null when nothing is required at all, which is how
  // stages.json spells "advanced by hand".
  function buildRequires(values, existing) {
    const requires = {};
    for (const key of Object.keys(existing || {})) {
      if (RULE_KEYS.indexOf(key) === -1) requires[key] = existing[key];
    }
    if (values.scope) requires.scope = true;
    if (values.owner) requires.owner = true;
    if (values.children_done) requires.children_done = true;
    const min = Number(values.evidence_min);
    if (Number.isInteger(min) && min > 0) requires.evidence_min = min;
    const match = String(values.evidence_match == null ? '' : values.evidence_match).trim();
    if (match) requires.evidence_match = match;
    const deps = String(values.deps_at_least == null ? '' : values.deps_at_least).trim();
    if (deps) requires.deps_at_least = deps;
    return Object.keys(requires).length ? requires : null;
  }

  // The one thing this form can get wrong that the server will not catch for
  // it: stages.json has no schema for `evidence_min`, so a fractional minimum
  // would be written through and then compared against a list length forever.
  // buildRequires drops a value it cannot use, and a silently dropped rule is
  // worse than a refusal, so the save path asks this first.
  function gateInputProblem(values) {
    const raw = String(values.evidence_min == null ? '' : values.evidence_min).trim();
    if (raw === '') return null;
    const min = Number(raw);
    if (!Number.isInteger(min) || min < 0) {
      return 'minimum evidence must be a whole number, or blank for no minimum.';
    }
    return null;
  }

  function showAdminError(boxId, message) {
    const box = document.getElementById(boxId);
    if (box) box.textContent = message;
  }

  // Every stage change is a whole-pipeline PUT, and every refusal the server
  // returns is shown exactly as it was written. The server's wording names the
  // stage, the count and the fix ("stage backlog still holds 2 items; move them
  // elsewhere before removing that stage."); replacing it with "failed" would
  // throw away the only part a human can act on.
  async function saveStages(doc, boxId) {
    if (Inflight.has('stages')) return { ok: false, skipped: true };
    Inflight.add('stages');
    showAdminError(boxId, '');
    const result = await apiWrite('/api/stages', doc);
    Inflight.delete('stages');
    if (result.ok) {
      State.formDirty = false;
      await refreshNow();
      return result;
    }
    showAdminError(boxId, (result.data && result.data.error) || 'request failed');
    return result;
  }

  const State = {
    items: [], events: [], stages: { stages: [], extra: [] }, config: {}, sync: { status: 'off' }, generatedAt: null, live: false,
    runs: [], scheduler: { status: 'disabled' },
    // Whether this request may change the RULES of the board (stages, gates,
    // settings) as opposed to the work on it. /api/state answers it per
    // request; a snapshot has no server to ask, so the default is "no".
    admin: { allowed: false },
    // Set while someone is typing in the stages or settings editors, so the
    // two-second poll cannot wipe a half-filled form out from under them.
    formDirty: false,
    // The item panel's equivalent of formDirty, decided live rather than by a
    // flag: the values its editable controls held at the last render. The
    // poll compares against this before redrawing the panel -- see
    // panelIsDirty().
    panelBaseline: null,
    // A refused drawer write is an outcome, not transient paint. It belongs
    // here rather than only in #panel-error because a poll replaces that DOM
    // node every two seconds. The panel id keeps an old refusal from leaking
    // into a different item's drawer.
    panelError: null,
    // Where focus was when the drawer was opened, so closing it can hand it
    // back to the control that opened it -- see openPanel()/closePanel().
    panelReturnFocus: null,
    // Which terminal columns a human has clicked open. Absent means
    // collapsed -- see terminalStageIds() and renderBoard() -- and a Set
    // living on State survives every 2-second poll untouched, so reading
    // Built does not get reset out from under whoever is reading it.
    expandedStages: new Set(),
    // T-0054: same idea for the Overview's "what next" sections -- which
    // ones a human has expanded past the first handful. A Set on State, so
    // the poll cannot fold a section back up while it is being read.
    briefExpanded: new Set(),
    lastLiveUpdate: null, liveError: null, pollingDelay: 2000, activePanelId: null,
    transitions: {}, transitionLoading: {}, transitionErrors: {},
    runLogs: {}, runLogLoading: {}, runLogErrors: {},
    view: 'overview',
    filters: { phase: '', type: '', stage: '', flag: '', search: '' },
    sort: { key: 'updated', dir: 'desc' },
    pendingEvidence: {},
    creatingItem: false,
    drag: null,
  };

  // -- write path: every request goes through /api/*, then the existing poll
  // loop re-fetches /api/state. There is no second state model.
  const Inflight = new Set();
  let pollTimer = null;

  function schedulePoll(delay) {
    if (pollTimer) window.clearTimeout(pollTimer);
    pollTimer = window.setTimeout(poll, delay);
  }

  async function refreshNow() {
    if (pollTimer) { window.clearTimeout(pollTimer); pollTimer = null; }
    await poll();
  }

  async function apiWrite(path, body) {
    try {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      let data = null;
      try { data = await res.json(); } catch { /* no body */ }
      return { ok: res.ok, status: res.status, data };
    } catch (error) {
      return { ok: false, status: 0, data: { error: error.message || 'network error' } };
    }
  }

  // Mirrors isTerminalStage in lib/stages.js, and is the ONLY place this page
  // decides what "terminal" means. The viewer previously consulted only
  // stages.terminal, so a pipeline whose finish line is declared with
  // `role: "done"` -- which is what `gw init` now writes for trunk workflows --
  // had its finished column treated as ongoing: every completed card offered a
  // Play button with nothing left to play, and the header counted 109 items
  // "open" on a board `gw brief` reported 6 open for. Two notions of terminal
  // in one file is how that happened, so there is now one. Nothing else may
  // read that list directly; test/viewer.test.js enforces it.
  function terminalStageIds() {
    const all = (State.stages.stages || []).concat(State.stages.extra || []);
    const ids = new Set(State.stages.terminal || []);
    for (const stage of all) {
      if (stage.role === 'done' || stage.role === 'dropped') ids.add(stage.id);
    }
    if (!all.some((stage) => stage.role === 'dropped') && all.some((stage) => stage.id === 'dropped')) ids.add('dropped');
    return ids;
  }

  function isTerminalItem(it) {
    return terminalStageIds().has(it.stage);
  }

  // How many of a collapsed terminal column's most-recently-touched items
  // stay visible without asking. Small enough that the four columns that
  // matter get their width back; big enough that "recent" means something.
  const COLLAPSED_PREVIEW_COUNT = 5;

  // A stage's position in the PIPELINE (never `stages.extra`, which is not an
  // ordered flow). Mirrors stageIndex in lib/rules.js -- this file has no
  // module loader to share it with, so the definition is repeated, not
  // reinvented: same lookup, same "not in the pipeline" answer of -1.
  function pipelineIndex(stageId) {
    return (State.stages.stages || []).findIndex((stage) => stage.id === stageId);
  }

  // Whether moving from one pipeline stage to another goes backward. This is
  // the one thing that turns a forced transition (evaluateCumulative's
  // `force: true`) into something the board is willing to offer at all: a
  // forward skip still has no drop target or enabled button, because the
  // board has no way to ask the CLI for "skip these stages" -- only "go back
  // to one I already passed". A side stage (`stages.extra`, e.g. dropped) is
  // not "backward" in this sense; it already has its own force rule.
  function isBackwardTarget(fromStageId, toStageId) {
    const fromIndex = pipelineIndex(fromStageId);
    const toIndex = pipelineIndex(toStageId);
    return fromIndex >= 0 && toIndex >= 0 && toIndex < fromIndex;
  }

  // A live run, as opposed to a queued dispatch. /api/state has carried these
  // records all along; the buttons simply never asked.
  function runFor(id) {
    return (State.runs || []).find((record) => record.item === id) || null;
  }

  // Every surface that offers an action resolves it here, so a card and its
  // detail panel cannot disagree about what is happening to an item.
  function actionFor(it) {
    if (isTerminalItem(it)) return { kind: 'none' };
    const run = runFor(it.id);
    if (run) return { kind: 'running', run: run };
    if (isDispatched(it.id)) return { kind: 'queued' };
    return { kind: 'idle' };
  }

  function isDispatched(id) {
    const relevant = State.events.filter((e) => e.item === id && (e.type === 'dispatch' || e.type === 'cancel'));
    if (!relevant.length) return false;
    relevant.sort((a, b) => String(a.ts).localeCompare(String(b.ts)));
    return relevant[relevant.length - 1].type === 'dispatch';
  }

  async function loadState() {
    const items = readBlock('gw-items');
    const events = readBlock('gw-events');
    const stages = readBlock('gw-stages');
    const config = readBlock('gw-config');
    const blocksInjected = stages !== null && config !== null;

    if (!blocksInjected && location.protocol.indexOf('http') === 0) {
      try {
        const res = await fetch('/api/state');
        if (res.ok) {
          const data = await res.json();
          return {
            items: data.items || [], events: data.events || [],
            stages: data.stages || { stages: [], extra: [] }, config: data.config || {},
            sync: data.sync || { status: 'off' },
            runs: data.runs || [], scheduler: data.scheduler || { status: 'disabled' },
            admin: data.admin || { allowed: false },
            generatedAt: data.generatedAt || new Date().toISOString(), live: true,
            // True only when a server actually answered /api/state. boot() will
            // not enter live mode without it -- see the comment there.
            fromServer: true,
          };
        }
      } catch { /* no server yet; fall through to whatever was injected */ }
    }

    return {
      items: items || [], events: events || [],
      stages: stages || { stages: [], extra: [] }, config: config || {},
      sync: { status: 'off' },
      admin: { allowed: false },
      generatedAt: (config && config.generatedAt) || null, live: false,
      fromServer: false,
    };
  }

  function stageLabel(id) {
    const s = stageList(State.stages).find((s) => s.id === id);
    return s ? s.label : STAGE_LABEL_FALLBACK(id);
  }

  // The plain-English gate description for a stage. This page cannot import
  // lib/gates/describe.js -- it is a single file with no module loader -- so
  // the sentences are resolved in Node and travel inside the stages payload:
  // `gw serve` puts them there (withGateDescriptions in lib/serve/server.js)
  // and `gw open` puts them in the inlined gw-stages block, which is what
  // keeps the offline snapshot readable. Never restate the wording here: a
  // second copy would drift and the board would describe rules it does not
  // enforce.
  function gateFor(stageId) {
    const gates = State.stages && State.stages.gates;
    const gate = gates && gates[stageId];
    return gate && Array.isArray(gate.sentences) ? gate : null;
  }

  function sentenceList(sentences, className) {
    return '<ul' + (className ? ' class="' + className + '"' : '') + '>' +
      sentences.map((line) => '<li>' + escapeHtml(line) + '</li>').join('') + '</ul>';
  }

  // Whether an owner is the thing missing. This has to be read off the
  // machine failures the server already computed (evaluateCumulative in
  // lib/rules.js, carried here as `transition.failures`) rather than
  // re-deriving it from stages.json: the viewer has no client-side
  // requirement evaluator, on purpose (see test/serve.test.js), so a second
  // evaluator does not get invented just to decide when to draw a button.
  // The match is on lib/rules.js's fixed prefix, not on the sentence
  // lib/gates/describe.js produces, and the matched text is never rendered --
  // only the English `reasons` already displayed next to it are.
  function ownerGateUnmet(it, machineFailures) {
    return !it.owner && (machineFailures || []).some((line) => /(^|:\s)needs an owner:/.test(line));
  }

  // The inline answer to "needs an owner": a Claim button next to the English
  // reason, offered only when claiming would actually clear this gate.
  function claimActionHtml(it, machineFailures) {
    if (!State.live || !ownerGateUnmet(it, machineFailures)) return '';
    return '<button class="reason-action" data-claim="' + escapeHtml(it.id) + '" title="Claims this item for you, so the owner gate above is met.">Claim</button>';
  }

  // The raw rule stays one disclosure away: agents and anyone debugging
  // stages.json still need the literal JSON, it just stops being the headline.
  function machineRule(body) {
    return '<details class="machine-rule"><summary>machine rule</summary>' + body + '</details>';
  }

  function filteredItems() {
    const f = State.filters;
    const q = f.search.trim().toLowerCase();
    return State.items.filter((it) => {
      if (f.phase && it.phase !== f.phase) return false;
      if (f.type && it.type !== f.type) return false;
      if (f.stage && it.stage !== f.stage) return false;
      if (f.flag && it.flag !== f.flag) return false;
      if (q) {
        const hay = ((it.id || '') + ' ' + (it.title || '') + ' ' + (it.scope || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function populateFilterOptions() {
    const vocab = (State.config && State.config.vocab) || {};
    function fill(select, values, current, field) {
      const keep = select.querySelector('option[value=""]');
      select.innerHTML = '';
      select.appendChild(keep);
      for (const v of values) {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        // The filter bar is where a new reader first meets `G0` or `defect`.
        // An undescribed code gets no title and renders exactly as before.
        const description = field ? describeTerm(field, v) : null;
        if (description) opt.title = description;
        if (v === current) opt.selected = true;
        select.appendChild(opt);
      }
    }
    fill(document.getElementById('f-phase'), vocab.phase || [...new Set(State.items.map((i) => i.phase).filter(Boolean))], State.filters.phase, 'phase');
    fill(document.getElementById('f-type'), vocab.type || [...new Set(State.items.map((i) => i.type).filter(Boolean))], State.filters.type, 'type');
    fill(document.getElementById('f-stage'), stageList(State.stages).map((s) => s.id), State.filters.stage);
    fill(document.getElementById('f-flag'), ['blocked', 'needs-triage', 'paused', 'conflict'], State.filters.flag);
  }

  function renderHeader() {
    const sync = State.sync || { status: 'off' };
    const syncText = sync.status === 'unscheduled' ? 'github · enabled but not scheduled'
      : sync.status === 'off' ? ''
      : sync.status === 'success' ? 'github · synced ' + syncAge(sync.lastSuccessAt) + ' ago'
        : sync.status === 'stale' ? 'github · sync stale'
          : sync.status === 'failure' ? 'github · sync failing' : 'github · syncing';
    const syncPill = syncText ? ' <span class="live-pill">' + syncText + '</span>' : '';
    document.getElementById('gw-snapshot-meta').innerHTML = State.live
      ? '<span class="live-pill">' + (State.liveError ? 'live · reconnecting (' + escapeHtml(State.liveError) + ')' : 'live · updated ' + liveAge() + ' ago') + '</span>' + syncPill
      : '<span class="snapshot-pill">snapshot · ' + escapeHtml(fmtDate(State.generatedAt)) + '</span>' + syncPill;
    const total = State.items.length;
    const flagged = State.items.filter((i) => i.flag).length;
    const terminal = terminalStageIds();
    const open = State.items.filter((i) => !terminal.has(i.stage)).length;
    document.getElementById('gw-totals').innerHTML =
      '<span><b>' + total + '</b> items</span><span><b>' + open + '</b> open</span><span><b>' + flagged + '</b> flagged</span>';
    renderPauseUI();
    document.getElementById('f-new').classList.toggle('hidden', !State.live);
  }

  // One wording for the Play affordance, because a button that cannot start
  // anything must not say "Play" on the card and something else in the panel.
  function playLabel() {
    return schedulerIsOff() ? 'Queue for an agent' : 'Play';
  }

  function playTitle() {
    return schedulerIsOff()
      ? 'Queues this item. The scheduler is off, so nothing will run until it is turned on.'
      : 'Queues this item for an agent to pick up.';
  }

  function schedulerIsOff() {
    const status = State.scheduler && State.scheduler.status;
    return status === 'disabled' || status === 'unconfigured';
  }

  function activeRunFor(id) {
    return (State.runs || []).find((r) => r.item === id) || null;
  }

  function renderPauseUI() {
    const btn = document.getElementById('gw-pause-btn');
    const banner = document.getElementById('gw-pause-banner');
    if (!State.live) { btn.classList.add('hidden'); banner.classList.add('hidden'); return; }
    btn.classList.remove('hidden');
    const paused = Boolean(State.config && State.config.runner && State.config.runner.paused);
    btn.textContent = paused ? 'resume' : 'pause';
    btn.title = paused
      ? 'Resume: let the scheduler start eligible work again.'
      : 'Pause: stop the scheduler from starting new work.';
    const scheduler = State.scheduler || { status: 'disabled' };
    if (scheduler.status === 'disabled') {
      banner.classList.remove('hidden');
      banner.textContent = 'Scheduler is off (runner.enabled is false) — Play queues work but nothing will run.';
    } else if (scheduler.status === 'unconfigured') {
      banner.classList.remove('hidden');
      banner.textContent = 'Scheduler is off (no provider configured) — Play queues work but nothing will run.';
    } else if (paused) {
      banner.classList.remove('hidden');
      banner.textContent = 'Paused — no new work will be started until resumed.';
    } else {
      banner.classList.add('hidden');
    }
  }

  function liveAge() {
    if (!State.lastLiveUpdate) return 'waiting';
    return Math.max(0, Math.floor((Date.now() - State.lastLiveUpdate) / 1000)) + 's';
  }

  // How long a run has actually been going. A card re-renders only when its
  // item changes, so these labels are re-ticked by the one-second interval in
  // boot() rather than waiting for the item to move.
  function ageLabel(iso) {
    const started = Date.parse(iso);
    if (!Number.isFinite(started)) return '';
    const seconds = Math.max(0, Math.floor((Date.now() - started) / 1000));
    if (seconds < 60) return seconds + 's';
    if (seconds < 3600) return Math.floor(seconds / 60) + 'm';
    return Math.floor(seconds / 3600) + 'h ' + (Math.floor(seconds / 60) % 60) + 'm';
  }

  function runLabel(run) {
    const age = ageLabel(run.started);
    return 'running · ' + run.run + (age ? ' · ' + age : '');
  }

  function tickRunAges() {
    document.querySelectorAll('[data-run-started]').forEach((el) => {
      el.textContent = runLabel({ run: el.dataset.runId, started: el.dataset.runStarted });
    });
  }

  function syncAge(iso) {
    if (!iso) return 'never';
    const seconds = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
    return seconds < 60 ? seconds + 's' : Math.floor(seconds / 60) + 'm';
  }

  // -- Overview as "what should I do next" (P8-13) ------------------------
  // The Overview tab used to be four census charts (by stage/phase/type)
  // and nothing else -- a distribution, not an answer to the question a human
  // actually opens the board with. `gw brief` already answers that question
  // over the same data, so this mirrors its definitions instead of inventing
  // a second set. In particular "in flight" is copied from lib/brief.js's
  // computeActive/isInFlight line for line: real progress is owned work that
  // moved past the stage it was created in. A live dispatch is the narrow
  // exception because it is work presently underway. Claiming an item alone
  // does not qualify -- lib/brief.js
  // has already had two bugs from a second notion of
  // "terminal"; this file is not going to add a second notion of "in flight"
  // next to it. test/viewer-brief-parity.test.js runs both implementations
  // over the same fixtures and compares them.

  // Mirrors computeActive in lib/brief.js exactly.
  function computeActiveDispatch(events) {
    const active = new Set();
    for (const event of events) {
      if (event.type === 'dispatch') active.add(event.item);
      if (event.type === 'run_ended' || event.type === 'cancel') active.delete(event.item);
    }
    return active;
  }

  // Mirrors isInFlight in lib/brief.js, using this file's own pipelineIndex
  // in place of lib/rules.js's stageIndex -- same lookup, same result, no
  // module loader to share the original with (see pipelineIndex's own
  // comment for the precedent).
  function isInFlightItem(it, active) {
    return (Boolean(it.owner) && pipelineIndex(it.stage) > 0) || active.has(it.id);
  }

  // Mirrors depsReady in lib/brief.js exactly.
  function depsReadyItem(it) {
    const target = (State.stages.stages || [])[pipelineIndex(it.stage) + 1];
    const boundary = (target && target.requires && target.requires.deps_at_least) || ((it.deps || []).length ? it.stage : null);
    return (it.deps || []).every((id) => {
      const dep = State.items.find((candidate) => candidate.id === id);
      return dep && (!boundary || pipelineIndex(dep.stage) >= pipelineIndex(boundary));
    });
  }

  // The same open/blocked/triage/in-flight/next split renderBrief computes,
  // minus the "assigned to me" personalization gw brief applies for a CLI
  // user (the board has no login, so a live dispatch belongs to "in flight"
  // whether or not it happens to be claimed) -- everything else is identical.
  function briefBuckets() {
    const active = computeActiveDispatch(State.events);
    const open = State.items.filter((it) => !isTerminalItem(it));
    const blocked = open.filter((it) => it.flag === 'blocked' || !depsReadyItem(it));
    const triage = open.filter((it) => it.flag === 'needs-triage');
    const inFlight = open.filter((it) => blocked.indexOf(it) === -1 && isInFlightItem(it, active));
    const stranded = open.filter((it) => blocked.indexOf(it) === -1 && triage.indexOf(it) === -1 && !it.owner && pipelineIndex(it.stage) > 0);
    const next = open.filter((it) => blocked.indexOf(it) === -1 && triage.indexOf(it) === -1 && inFlight.indexOf(it) === -1 && stranded.indexOf(it) === -1 &&
      !it.owner && pipelineIndex(it.stage) <= 0 && depsReadyItem(it));
    return { open, blocked, triage, inFlight, stranded, next };
  }

  const BRIEF_SECTION_LIMIT = 8;

  // One card in the "what next" row. Rows carry data-id, so the existing
  // delegated click handler on #gw-view opens the item panel exactly as a
  // board card or table row does -- no separate wiring needed.
  function briefSectionHtml(title, items, note, emptyText) {
    if (!items.length) {
      return '<div class="overview-card brief-card"><h2>' + escapeHtml(title) + '</h2><p class="meta">' + escapeHtml(emptyText) + '</p></div>';
    }
    // T-0054: "+N more" was a bare <p> -- a dead end sitting under rows that
    // are all focusable buttons. It is now the same kind of one-click
    // reveal a collapsed terminal column's "Show all" is: it expands the
    // section in place, and folds it back. The section title is the key --
    // the four sections on the Overview have distinct titles, and the choice
    // lives on State so the 2-second poll cannot reset it.
    const expanded = (State.briefExpanded || new Set()).has(title);
    const shown = expanded ? items : items.slice(0, BRIEF_SECTION_LIMIT);
    // T-0017: the row opens the item's drawer on click, so it is a button in
    // the accessibility tree -- see the delegated keydown handler on #gw-view.
    const rows = shown.map((it) =>
      '<div class="count-row brief-row" data-id="' + escapeHtml(it.id) + '" role="button" tabindex="0" aria-label="Open item ' + escapeHtml(it.id) + ': ' + escapeHtml(it.title) + '">' +
      '<span>' + escapeHtml(it.id) + ' · ' + escapeHtml(it.title) + '</span>' +
      '<span>' + escapeHtml(note(it)) + '</span></div>'
    ).join('');
    const more = items.length > BRIEF_SECTION_LIMIT
      ? '<button class="brief-more" data-brief-more="' + escapeHtml(title) + '"' +
        (expanded ? '' : ' aria-label="Show the remaining ' + (items.length - BRIEF_SECTION_LIMIT) + ' items in ' + escapeHtml(title) + '."') + '>' +
        (expanded ? 'show less' : '+' + (items.length - BRIEF_SECTION_LIMIT) + ' more') + '</button>'
      : '';
    return '<div class="overview-card brief-card"><h2>' + escapeHtml(title) + ' (' + items.length + ')</h2>' + rows + more + '</div>';
  }

  function renderOverview(container) {
    const { blocked, triage, inFlight, stranded, next } = briefBuckets();
    const whatNext = '<div class="overview-grid">' +
      briefSectionHtml('In flight', inFlight, (it) => stageLabel(it.stage).toLowerCase() + ' · ' + (it.owner || 'unowned'), 'Nothing is in flight.') +
      briefSectionHtml('Stranded', stranded, (it) => stageLabel(it.stage).toLowerCase() + ' · unowned', 'Nothing is stranded.') +
      briefSectionHtml('Blocked', blocked, (it) => it.flag === 'blocked' ? 'flagged blocked' : 'waiting on a dependency', 'Nothing is blocked.') +
      briefSectionHtml('Needs triage', triage, (it) => 'created by ' + (it.created_by || 'unknown'), 'Nothing needs triage.') +
      briefSectionHtml('Next unblocked', next, (it) => (it.phase || '-'), 'Nothing is unblocked and unowned.') +
      '</div>';

    function counts(key) {
      const map = new Map();
      for (const it of State.items) {
        const k = it[key] || '(none)';
        map.set(k, (map.get(k) || 0) + 1);
      }
      return [...map.entries()].sort((a, b) => b[1] - a[1]);
    }
    function card(title, rows, labelFor, field) {
      const max = Math.max(1, ...rows.map((r) => r[1]));
      const body = rows.map(([k, n]) =>
        '<div class="count-row"><span' + termTitle(field, k) + '>' + escapeHtml(labelFor ? labelFor(k) : k) + '</span>' +
        '<span class="bar"><span style="width:' + Math.round((n / max) * 100) + '%"></span></span>' +
        '<span>' + n + '</span></div>'
      ).join('');
      // These charts are where codes are aggregated with nothing else on the
      // row to explain them, so the descriptions are on screen rather than
      // only in a tooltip nobody knows to hover.
      return '<div class="overview-card"><h2>' + title + '</h2>' + (body || '<p class="meta">none</p>') +
        glossaryLegend(field, rows.map((r) => r[0])) + '</div>';
    }
    const byStageOrdered = stageList(State.stages).map((s) => [s.id, State.items.filter((i) => i.stage === s.id).length]).filter((r) => r[1] > 0);
    const distribution = '<div class="overview-grid">' +
      card('By stage', byStageOrdered, stageLabel) +
      card('By phase', counts('phase'), null, 'phase') +
      card('By type', counts('type'), null, 'type') +
      '</div>';

    container.innerHTML =
      '<div class="overview-section"><h2 class="overview-heading">What next</h2>' + whatNext + '</div>' +
      '<details class="overview-distribution"><summary>Distribution (by stage, phase, type)</summary>' + distribution + '</details>';
  }

  // -- card badges (P8-16) -------------------------------------------------
  // `ev:0` on every card and `human:rahil` repeated on a hundred of them were
  // both true and neither was informative: a fresh reader cannot decode
  // "ev:0" at all, and an owner that never varies says nothing by being
  // printed a hundred times. Both stay one click away -- the panel's Fields
  // and Evidence sections -- they just stop being printed when they add
  // nothing.

  // The owner most items already have. Only worth omitting when it really is
  // the common case; a board split roughly evenly between owners has no
  // "obvious" one to leave off.
  function defaultOwner() {
    const counts = new Map();
    for (const it of State.items) {
      if (!it.owner) continue;
      counts.set(it.owner, (counts.get(it.owner) || 0) + 1);
    }
    let top = null; let max = 0;
    for (const [owner, n] of counts) { if (n > max) { max = n; top = owner; } }
    return (State.items.length && max > State.items.length / 2) ? top : null;
  }

  // Whether this item's evidence is short of what its OWN next stage
  // requires -- read straight off the stage the server already sent, the
  // same way the panel's stage buttons and depsSelect already read
  // `stage.requires` directly rather than through a client-side evaluator.
  // Unlike evaluateCumulative in lib/rules.js this checks only the next
  // stage, not every stage up to it -- exactly the question the badge asks:
  // "is evidence why the very next move is short."
  function evidenceGateUnmet(it) {
    const targetId = nextStageId(State.stages, it.stage);
    if (!targetId) return false;
    const target = stageList(State.stages).find((s) => s.id === targetId);
    const requires = target && target.requires;
    if (!requires) return false;
    const evidence = it.evidence || [];
    if (requires.evidence_min && evidence.length < requires.evidence_min) return true;
    if (requires.evidence_match) {
      let re = null;
      try { re = new RegExp(requires.evidence_match); } catch { return true; }
      if (!evidence.some((e) => re.test(evidenceText(e)))) return true;
    }
    return false;
  }

  function cardMarkup(it, moved) {
    const evCount = (it.evidence || []).length;
    const dispatched = isDispatched(it.id);
    const parent = it.parent ? State.items.find((candidate) => candidate.id === it.parent) : null;
