  async function onNoteSubmit(id, btn) {
    const panel = document.getElementById('gw-panel');
    const input = panel.querySelector('#note-input');
    const text = input.value.trim();
    if (!text) return;
    const key = 'note:' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/note', { text });
    Inflight.delete(key);
    if (result.ok) {
      input.value = '';
      await refreshNow();
    } else {
      btn.disabled = false;
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  async function onSaveFields(it, btn) {
    const panel = document.getElementById('gw-panel');
    const inputs = panel.querySelectorAll('[data-field]');
    const body = {};
    inputs.forEach((input) => {
      const field = input.dataset.field;
      const raw = it[field];
      const original = Array.isArray(raw) ? raw.join(', ') : (raw == null ? '' : String(raw));
      const value = input.value;
      if (value !== original) {
        body[field] = (field === 'deps' || field === 'refs')
          ? value.split(',').map((v) => v.trim()).filter(Boolean).join(',')
          : value;
      }
    });
    if (!Object.keys(body).length) return;
    const key = 'edit:' + it.id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    panel.querySelectorAll('.field-refusal').forEach((el) => { el.innerHTML = ''; });
    const result = await apiWrite('/api/items/' + encodeURIComponent(it.id), body);
    Inflight.delete(key);
    btn.disabled = false;
    if (result.ok) {
      // The values just saved are now the server's values, but the baseline
      // still holds what the last render put in the inputs. Re-baseline here
      // or panelIsDirty() would keep reporting a divergence that no longer
      // exists -- and a guard that never clears would block the poll's
      // re-render forever.
      State.panelBaseline = capturePanelBaseline();
      await refreshNow();
    } else if (result.status === 409) {
      const failures = (result.data && result.data.failures && result.data.failures.length)
        ? result.data.failures
        : [(result.data && result.data.error) || 'refused'];
      const message = (result.data && result.data.error) || failures.join('; ');
      showPanelError(message);
      Object.keys(body).forEach((field) => {
        const el = document.getElementById('field-fail-' + field);
        if (el) el.innerHTML = '<div class="refusal">' + escapeHtml(message) + '</div>';
      });
    } else {
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  function openCreatePanel() {
    const panel = document.getElementById('gw-panel');
    const overlay = document.getElementById('gw-overlay');
    State.activePanelId = null;
    // T-0017: same focus contract as openPanel -- in on open, back on close.
    const opening = !overlay.classList.contains('open');
    if (opening) State.panelReturnFocus = document.activeElement;
    // A snapshot has no server to POST /api/items to, and every other write
    // control on the page degrades to a read-only notice naming the command
    // to run instead -- the create form must never be the one control that
    // still renders live and dies on submit with a raw "Failed to fetch".
    // Reaching this branch needs a regression in the f-new hiding (or a
    // caller that bypasses it); the guard is what keeps the form itself from
    // ever lying about what it can do.
    if (!State.live) {
      State.creatingItem = false;
      panel.innerHTML = '<div class="panel-head"><h2>New item</h2><button class="close-btn" id="panel-close" aria-label="Close">&times;</button></div>' +
        '<div class="readonly-banner">read-only snapshot &middot; to add an item run: <code>gw add "&lt;title&gt;"</code>, then <code>gw open</code> again to refresh this snapshot.</div>';
      panel.querySelector('#panel-close').addEventListener('click', closePanel);
      overlay.classList.add('open');
      const closeBtn = panelCloseButton();
      if (closeBtn) closeBtn.focus();
      return;
    }
    State.creatingItem = true;
    const panelError = State.panelError && State.panelError.panelId === null
      ? '<div class="refusal">' + escapeHtml(State.panelError.message) + '<button class="close-btn" id="panel-error-dismiss" aria-label="Dismiss">&times;</button></div>'
      : '';
    const vocab = (State.config && State.config.vocab) || {};
    function options(list) {
      return '<option value="">(none)</option>' + (list || []).map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join('');
    }
    panel.innerHTML = '<div class="panel-head"><h2>New item</h2><button class="close-btn" id="panel-close" aria-label="Close">&times;</button></div>' +
      '<div id="panel-error">' + panelError + '</div>' +
      '<form id="create-form" class="create-form">' +
      '<label>Title<input type="text" name="title" required maxlength="120"></label>' +
      // T-0081: leaving all three vocab fields at "(none)" is a real choice
      // with a real cost -- the server holds the item for triage and nobody
      // (including its creator) can approve the hold away. The dialog used
      // to let that happen silently; now it says so before the submit, not
      // after the surprise. The holding itself is deliberate and stays.
      '<div class="create-hold-note">An item created with no phase, type or priority is held for triage: it stays off the scheduler until someone other than you approves it. Classify it here to skip the hold.</div>' +
      '<label>Phase<select name="phase">' + options(vocab.phase) + '</select></label>' +
      '<label>Type<select name="type">' + options(vocab.type) + '</select></label>' +
      '<label>Priority<select name="priority">' + options(vocab.priority) + '</select></label>' +
      '<label>Scope<textarea name="scope" rows="3"></textarea></label>' +
      '<label>Parent<input type="text" name="parent" placeholder="item id, optional"></label>' +
      '<button type="submit">create</button>' +
      '</form>';
    panel.querySelector('#panel-close').addEventListener('click', closePanel);
    const dismissError = panel.querySelector('#panel-error-dismiss');
    if (dismissError) dismissError.addEventListener('click', () => {
      State.panelError = null;
      const error = panel.querySelector('#panel-error');
      if (error) error.innerHTML = '';
    });
    panel.querySelector('#create-form').addEventListener('submit', onCreateSubmit);
    overlay.classList.add('open');
    const titleInput = panel.querySelector('#create-form input[name="title"]');
    if (titleInput) titleInput.focus();
  }

  async function onCreateSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector('button[type="submit"]');
    if (Inflight.has('create')) return;
    Inflight.add('create');
    btn.disabled = true;
    const data = new FormData(form);
    const body = {};
    for (const [k, v] of data.entries()) {
      const trimmed = String(v).trim();
      if (trimmed !== '') body[k] = trimmed;
    }
    const result = await apiWrite('/api/items', body);
    Inflight.delete('create');
    btn.disabled = false;
    if (result.ok) {
      State.creatingItem = false;
      closePanel();
      await refreshNow();
    } else {
      const failures = (result.data && result.data.failures && result.data.failures.length) ? result.data.failures.join('; ') : null;
      showPanelError(failures || (result.data && result.data.error) || 'request failed');
    }
  }

  function updateBoardInPlace(previousItems, priorDispatch) {
    const board = document.getElementById('board');
    if (!board) { renderView(); return; }
    const oldById = new Map(previousItems.map((item) => [item.id, item]));
    const cards = new Map([...board.querySelectorAll('.card')].map((card) => [card.dataset.id, card]));
    const terminal = terminalStageIds();
    for (const stage of stageList(State.stages)) {
      const column = board.querySelector('.column[data-stage="' + CSS.escape(stage.id) + '"]');
      if (!column) { renderView(); return; }
      const body = column.querySelector('.column-body');
      const inCol = filteredItems().filter((item) => item.stage === stage.id);
      const isTerminal = terminal.has(stage.id);
      // State.expandedStages is untouched by this function, so a column a
      // human just opened stays open across this same poll that would
      // otherwise be the thing resetting it.
      const expanded = !isTerminal || State.expandedStages.has(stage.id);
      const items = columnBodyItems(stage.id, inCol, expanded);
      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const prior = oldById.get(item.id); const moved = prior && prior.stage !== item.stage;
        const dispatchChanged = priorDispatch.has(item.id) && priorDispatch.get(item.id) !== isDispatched(item.id);
        let card = cards.get(item.id);
        if (!card || moved) {
          const holder = document.createElement('div'); holder.innerHTML = cardMarkup(item, moved); card = holder.firstChild;
        } else if (JSON.stringify(prior) !== JSON.stringify(item) || dispatchChanged) {
          const holder = document.createElement('div'); holder.innerHTML = cardMarkup(item, false);
          const replacement = holder.firstChild; card.replaceWith(replacement); card = replacement;
        }
        fragment.appendChild(card);
      }
      body.replaceChildren(fragment);
      column.querySelector('.count').textContent = String(inCol.length);
      column.classList.toggle('collapsed', isTerminal && !expanded);
      const toggleBtn = column.querySelector('[data-toggle-stage]');
      if (toggleBtn) toggleBtn.textContent = expanded ? 'Collapse' : 'Show all';
    }
  }

  function mergeEvents(events) {
    const seen = new Set(State.events.map((event) => JSON.stringify(event)));
    State.events.push(...events.filter((event) => !seen.has(JSON.stringify(event))));
  }

  async function poll() {
    const since = State.generatedAt ? '?since=' + encodeURIComponent(State.generatedAt) : '';
    try {
      const res = await fetch('/api/state' + since);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json(); const previous = State.items;
      const priorDispatch = new Map(previous.map((item) => [item.id, isDispatched(item.id)]));
      // What the open editor is showing, captured before the new payload
      // lands: an editor view is only redrawn when the thing it edits has
      // actually changed, because redrawing it every two seconds would throw
      // away whatever the human had typed into it.
      const beforeEditable = JSON.stringify([State.stages, State.config, State.admin]);
      State.items = data.items || []; mergeEvents(data.events || []);
      State.stages = data.stages || State.stages; State.config = data.config || State.config; State.sync = data.sync || State.sync;
      State.runs = data.runs || []; State.scheduler = data.scheduler || State.scheduler;
      State.admin = data.admin || { allowed: false };
      State.generatedAt = data.generatedAt || new Date().toISOString();
      State.lastLiveUpdate = Date.now(); State.liveError = null; State.pollingDelay = 2000;
      populateFilterOptions(); renderHeader();
      if (State.view === 'board') updateBoardInPlace(previous, priorDispatch);
      else if (isEditorView()) {
        const changed = beforeEditable !== JSON.stringify([State.stages, State.config, State.admin]);
        if (changed && !State.formDirty) renderView();
      } else renderView();
      // The item panel refreshes with every poll only while nothing in it is
      // half-typed -- the same contract the editors above get from
      // State.formDirty. A dirty panel keeps its typed text through the poll;
      // saving, reverting the typing or closing the panel makes it clean, and
      // the next poll takes over again. openPanel always renders, so opening
      // or switching to another item is never blocked by this.
      if (State.activePanelId && !panelIsDirty()) openPanel(State.activePanelId);
    } catch (error) {
      State.liveError = error.message || 'server unavailable'; State.pollingDelay = Math.min(State.pollingDelay * 2, 30000); renderHeader();
    }
    schedulePoll(State.pollingDelay);
  }

  function wireStatic() {
    document.querySelectorAll('#gw-tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#gw-tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        State.view = btn.dataset.view;
        renderView();
      });
    });

    ['phase', 'type', 'stage', 'flag'].forEach((key) => {
      const el = document.getElementById('f-' + key);
      el.addEventListener('change', () => { State.filters[key] = el.value; renderView(); });
    });
    document.getElementById('f-search').addEventListener('input', (e) => { State.filters.search = e.target.value; renderView(); });
    document.getElementById('f-clear').addEventListener('click', () => {
      State.filters = { phase: '', type: '', stage: '', flag: '', search: '' };
      document.querySelectorAll('#gw-filters select').forEach((s) => { s.value = ''; });
      document.getElementById('f-search').value = '';
      renderView();
    });

    document.getElementById('gw-view').addEventListener('click', (e) => {
      // The one click that shows a collapsed terminal column in full, or
      // collapses it back (P8-12). Toggled in State so the 2-second poll
      // reflects the choice instead of resetting it.
      const toggleBtn = e.target.closest('[data-toggle-stage]');
      if (toggleBtn) {
        e.stopPropagation();
        const stageId = toggleBtn.dataset.toggleStage;
        if (State.expandedStages.has(stageId)) State.expandedStages.delete(stageId);
        else State.expandedStages.add(stageId);
        renderView();
        return;
      }
      // T-0054: the Overview section expander -- one click reveals the rest
      // of a "what next" list, one more folds it back. Stopped from bubbling
      // for the same reason the toggle above is.
      const moreBtn = e.target.closest('[data-brief-more]');
      if (moreBtn) {
        e.stopPropagation();
        const section = moreBtn.dataset.briefMore;
        if (State.briefExpanded.has(section)) State.briefExpanded.delete(section);
        else State.briefExpanded.add(section);
        renderView();
        return;
      }
      const playBtn = e.target.closest('[data-play]');
      if (playBtn) { e.stopPropagation(); onDispatchClick(playBtn.dataset.play, 'dispatch', playBtn); return; }
      const stopBtn = e.target.closest('[data-stop]');
      if (stopBtn) { e.stopPropagation(); onDispatchClick(stopBtn.dataset.stop, 'cancel', stopBtn); return; }
      // Distinct from cancel: this one reaches a process that is already
      // running, rather than withdrawing a dispatch that has not started.
      const stopRunBtn = e.target.closest('[data-stoprun]');
      if (stopRunBtn) { e.stopPropagation(); onDispatchClick(stopRunBtn.dataset.stoprun, 'stop', stopRunBtn); return; }
      // Table row actions (P8-14). Stopped from bubbling to the row-open
      // handler below for the same reason the card actions above are.
      const claimRowBtn = e.target.closest('[data-claim-row]');
      if (claimRowBtn) { e.stopPropagation(); onClaimClick(claimRowBtn.dataset.claimRow, claimRowBtn); return; }
      const releaseRowBtn = e.target.closest('[data-release-row]');
      if (releaseRowBtn) { e.stopPropagation(); onReleaseClick(releaseRowBtn.dataset.releaseRow, releaseRowBtn); return; }
      // A click that opens the move picker itself must not also open the
      // item's panel underneath it.
      if (e.target.closest('select.row-move')) return;
      const card = e.target.closest('[data-id]');
      if (card) openPanel(card.dataset.id);
    });
    // T-0017: cards and brief rows are buttons in the accessibility tree, so
    // Enter and Space must activate them the way a native button does. The
    // check that the focused element IS the control (not a descendant) keeps
    // a Space on the card's own Play/Stop button from ALSO opening the
    // drawer -- those are real buttons with their own native click.
    document.getElementById('gw-view').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (!e.target.closest) return;
      const control = e.target.closest('[data-id][role="button"]');
      if (!control || control !== e.target) return;
      e.preventDefault();
      openPanel(control.dataset.id);
    });
    document.getElementById('gw-view').addEventListener('click', (e) => {
      const th = e.target.closest('th[data-key]');
      if (!th) return;
      const key = th.dataset.key;
      if (State.sort.key === key) State.sort.dir = State.sort.dir === 'asc' ? 'desc' : 'asc';
      else { State.sort.key = key; State.sort.dir = 'asc'; }
      renderView();
    });

    // Warm the transitions cache the moment a move picker is touched, same as
    // the board warms it on mousedown before a drag -- so its options have
    // real verdicts by the time it is actually opened, not just "checking…".
    document.getElementById('gw-view').addEventListener('mousedown', (e) => {
      if (!State.live || !e.target.closest) return;
      const select = e.target.closest('select.row-move');
      if (select) refreshTransitions(select.dataset.moveRow);
    });

    // The move picker itself: only a value dropAllowed() already approved can
    // ever be selected (every other option is disabled), so this never has to
    // re-check before sending the move.
    document.getElementById('gw-view').addEventListener('change', (e) => {
      const select = e.target.closest ? e.target.closest('select.row-move') : null;
      if (!select || !select.value) return;
      const id = select.dataset.moveRow;
      const to = select.value;
      const it = State.items.find((candidate) => candidate.id === id);
      const force = Boolean(it && isBackwardTarget(it.stage, to));
      onMoveClick(id, to, null, { force }).then(() => { select.value = ''; });
    });

    // Typing into the stages or settings editors marks the form dirty, which
    // is what stops the poll loop redrawing the view and throwing the input
    // away mid-edit. Cleared whenever one of those views is (re)rendered.
    ['input', 'change'].forEach((type) => {
      document.getElementById('gw-view').addEventListener(type, () => {
        if (isEditorView()) State.formDirty = true;
      });
    });

    wireDragAndDrop(document.getElementById('gw-view'));

    document.getElementById('gw-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'gw-overlay') closePanel();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closePanel(); hideBoardRefusal(); }
    });

    document.getElementById('f-new').addEventListener('click', openCreatePanel);

    document.getElementById('gw-pause-btn').addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const key = 'pauseToggle';
      if (Inflight.has(key)) return;
      const paused = Boolean(State.config && State.config.runner && State.config.runner.paused);
      Inflight.add(key);
      btn.disabled = true;
      const result = await apiWrite(paused ? '/api/resume' : '/api/pause', {});
      Inflight.delete(key);
      btn.disabled = false;
      if (result.ok) await refreshNow();
    });
  }

  async function boot() {
    const loaded = await loadState();
    Object.assign(State, loaded);
    populateFilterOptions();
    renderHeader();
    wireStatic();
    renderView();
    // Live mode is earned by a server answering /api/state, not by the page
    // being served over http. `gw serve` serves this shell with no injected
    // blocks, so its pages get here through fromServer; a snapshot written by
    // `gw open` carries its own data, and serving that file through any other
    // static server must leave it exactly what it is -- a snapshot. Forcing
    // it live was what showed a "live" pill, a clickable "+ new item" and a
    // create form whose submit died with a raw "Failed to fetch".
    if (loaded.fromServer) {
      State.live = true; State.lastLiveUpdate = Date.now(); renderHeader();
      schedulePoll(2000);
      window.setInterval(() => { if (State.live) { renderHeader(); tickRunAges(); } }, 1000);
    }
  }

  // The injected data blocks are appended after this script tag in document
  // order, so they haven't been parsed yet when this script runs. Wait for
  // DOMContentLoaded so getElementById can find them.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
