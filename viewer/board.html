    const parentState = it.parent && !parent ? 'orphaned parent' : parent && terminalStageIds().has(parent.stage) ? 'parent terminal' : null;
    const action = actionFor(it);
    var actionHtml = '';
    if (action.kind === 'running') {
      actionHtml = '<button data-stoprun="' + escapeHtml(it.id) + '" title="Stops the agent process for this run.">Stop run</button>';
    } else if (action.kind === 'queued') {
      actionHtml = '<button data-stop="' + escapeHtml(it.id) + '" title="Cancels the queued dispatch before it starts.">Cancel</button>';
    } else if (action.kind === 'idle') {
      actionHtml = '<button data-play="' + escapeHtml(it.id) + '"' + (schedulerIsOff() ? ' class="secondary"' : '') +
        ' title="' + escapeHtml(playTitle()) + '">' + escapeHtml(playLabel()) + '</button>';
    }
    // The stage says where the WORK is; this says whether an agent is actually
    // on it. They are different axes, and a card that collapses them into one
    // button cannot answer "is it actually doing the work?" -- a card sitting
    // in Building, owned by a human, with nothing running, used to look
    // identical to one an agent was burning money on.
    const owner = defaultOwner();
    const ownerIsDefault = Boolean(it.owner) && it.owner === owner;
    const runStatus = action.kind === 'running'
      ? '<span class="tag badge-running" data-run-id="' + escapeHtml(action.run.run) + '" data-run-started="' + escapeHtml(action.run.started || '') + '">' + escapeHtml(runLabel(action.run)) + '</span>'
      : action.kind === 'queued'
        ? '<span class="tag badge-queued">queued · no agent run yet</span>'
        : action.kind === 'idle'
          ? '<span class="tag badge-idle">no agent run' + (it.owner && !ownerIsDefault ? ' · ' + escapeHtml(it.owner) : (it.owner ? '' : ' · unowned')) + '</span>'
          : '';
    // action.kind === 'none' is a finished item: no button, because there is
    // nothing left to start, queue or stop.
    const actions = State.live && actionHtml ? '<div class="card-actions">' + actionHtml + '</div>' : '';
    // Draggable only when a server is there to accept the move. A snapshot has
    // nothing to POST to, and a card that drags but can never land is a lie.
    const drag = State.live ? ' draggable="true" title="Drag to another column, or open this card to use the stage buttons."' : '';
    // T-0017: the card is what a mouse click opens the drawer with, so it is
    // a button in the accessibility tree too -- focusable, named after the
    // item it opens, activated by Enter and Space (wired once in the
    // delegated keydown handler on #gw-view). The name is explicit rather
    // than derived from the card's text because a live card also contains
    // Play/Stop buttons, and their labels must not be glued into its name.
    const openLabel = ' role="button" tabindex="0" aria-label="Open item ' + escapeHtml(it.id) + ': ' + escapeHtml(it.title) + '"';
    return '<div class="card' + (it.parent ? ' card-child' : '') + (moved ? ' card-moved' : '') + '" data-id="' + escapeHtml(it.id) + '"' + openLabel + drag + '>' +
      '<div class="card-id">' + escapeHtml(it.id) + '</div>' +
      '<div class="card-title">' + escapeHtml(it.title) + '</div>' +
      '<div class="card-meta">' +
      // T-0056: a null type rendered a bare "?" pill -- on a fresh board,
      // mostly untyped items, that is the pill everywhere. Every other pill
      // on this card is already conditional, so an absent type now reads
      // exactly the way an absent flag does: nothing shown. A type that IS
      // set still renders, glossary tooltip and all.
      (it.type ? '<span class="tag"' + termTitle('type', it.type) + '>' + escapeHtml(it.type) + '</span>' : '') +
      (it.flag ? '<span class="tag flag-' + escapeHtml(it.flag) + '">' + escapeHtml(it.flag) + '</span>' : '') +
      (it.parent ? '<span class="tag">child of ' + escapeHtml(it.parent) + '</span>' : '') +
      (parentState ? '<span class="tag">' + escapeHtml(parentState) + '</span>' : '') +
      runStatus +
      // The idle chip already names the owner when it is worth naming; do not
      // say it twice, and never print the owner every other card already has.
      (it.owner && action.kind !== 'idle' && !ownerIsDefault ? '<span class="tag" title="owner">' + escapeHtml(it.owner) + '</span>' : '') +
      // A count only means something next to the gate it is judged against --
      // see evidenceGateUnmet(). The number is still in the panel's Evidence
      // section regardless.
      (evidenceGateUnmet(it) ? '<span class="tag mono" title="' + escapeHtml('The next stage requires more evidence than this item has (' + evCount + ').') + '">ev:' + evCount + '</span>' : '') +
      '</div>' + actions + '</div>';
  }

  // Parent-first, children-under-parent ordering for a column's full list.
  // Pulled out of renderBoard so a collapsed column's preview (most recently
  // touched first, no hierarchy -- an archive does not need its family tree)
  // can skip it without duplicating the traversal.
  function hierarchicalOrder(inCol) {
    const ordered = [];
    const visit = (parentId) => inCol.filter((item) => item.parent === parentId).forEach((child) => { ordered.push(child); visit(child.id); });
    inCol.filter((item) => !item.parent || !inCol.some((candidate) => candidate.id === item.parent)).forEach((root) => { ordered.push(root); visit(root.id); });
    return ordered;
  }

  function mostRecentFirst(inCol) {
    return inCol.slice().sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')));
  }

  // Board (P8-12): a terminal column defaults to collapsed -- see
  // terminalStageIds(), the only place "terminal" is decided in this file --
  // so 103 of 113 finished cards do not squeeze the four columns that still
  // need attention off the left edge, or push Dropped off the right one
  // entirely. The count is always in the header, in or out of that state, and
  // one click on the toggle is the whole affordance to see everything: never
  // a second click, a menu, or a URL parameter. State.expandedStages is on
  // State itself, so the 2-second poll (updateBoardInPlace) cannot reset a
  // column someone just opened out from under them.
  function columnBodyItems(stageId, inCol, expanded) {
    return expanded ? hierarchicalOrder(inCol) : mostRecentFirst(inCol).slice(0, COLLAPSED_PREVIEW_COUNT);
  }

  function columnHeadHtml(s, count, isTerminal, expanded) {
    const toggle = isTerminal
      ? '<button class="column-toggle" data-toggle-stage="' + escapeHtml(s.id) + '" title="' +
        (expanded ? 'Collapse finished work back down.' : 'Show every item in ' + escapeHtml(s.label) + '.') + '">' +
        (expanded ? 'Collapse' : 'Show all') + '</button>'
      : '';
    return '<div class="column-head"><span class="column-head-main"><span>' + escapeHtml(s.label) + '</span><span class="count">' + count + '</span></span>' + toggle + '</div>';
  }

  function renderBoard(container) {
    const items = filteredItems();
    const cols = stageList(State.stages);
    const terminal = terminalStageIds();
    container.innerHTML = '<div id="board">' + cols.map((s) => {
      const inCol = items.filter((i) => i.stage === s.id);
      const isTerminal = terminal.has(s.id);
      const expanded = !isTerminal || State.expandedStages.has(s.id);
      const shown = columnBodyItems(s.id, inCol, expanded);
      return '<div class="column' + (isTerminal && !expanded ? ' collapsed' : '') + '" data-stage="' + escapeHtml(s.id) + '">' +
        columnHeadHtml(s, inCol.length, isTerminal, expanded) +
        '<div class="column-body">' + (shown.map(cardMarkup).join('') || '') + '</div></div>';
    }).join('') + '</div>';
  }

  // -- drag and drop -------------------------------------------------------
  // Native HTML5 drag and drop, no library. It is an addition to the panel's
  // stage buttons, never a replacement: everything here is reachable by click
  // and keyboard through the panel, which is what anyone who cannot drag uses.

  // A column is a drop target if the very same move the panel button would
  // issue is currently permitted. Most forced moves are still excluded --
  // the board has no way to ask the CLI for "skip these stages", so a
  // forward skip stays a CLI decision -- but a BACKWARD move is force-only by
  // definition (stageOrderMessage in lib/rules.js) and undoing a mis-drag is
  // exactly what P8-18 is for, so that one forced case is offered too.
  function dropAllowed(id, stageId) {
    const it = State.items.find((candidate) => candidate.id === id);
    if (!it || it.stage === stageId) return false;
    const transitions = State.transitions[id];
    const transition = transitions && transitions[stageId];
    if (!transition || !transition.ok) return false;
    if (!transition.force) return true;
    return isBackwardTarget(it.stage, stageId);
  }

  function dropRefusal(id, stageId) {
    const transitions = State.transitions[id];
    if (!transitions) {
      return State.transitionErrors[id] ? 'Unable to check this gate.' : 'Checking this gate…';
    }
    const transition = transitions[stageId];
    // T-0018: these refusals go to a mouse or touch user in a browser, so they
    // name a decision -- never a command the reader cannot run. The board
    // deliberately does not offer forward skips (P8-18): saying so plainly is
    // the fix, not a friendlier way to say "go use the CLI".
    if (!transition) return 'Not reachable from here — the board does not skip stages.';
    if (transition.ok && transition.force) return 'The board does not offer this jump — forcing past gates stays a CLI decision.';
    const reasons = (transition.reasons && transition.reasons.length) ? transition.reasons : (transition.failures || []);
    return reasons.join(' · ');
  }

  // T-0063: a drop the browser refuses (dragover never allowed it) used to
  // end in nothing at all -- the column was dimmed, the card snapped back,
  // and the reason stayed locked in a tooltip one hover away. This shows the
  // very same sentence dropRefusal() puts on the column tooltip and the
  // panel's move strip, deduped per column so the stream of dragover events
  // renders the notice once, not continuously.
  function showDragRefusal(drag, stageId) {
    const why = dropRefusal(drag.id, stageId);
    if (!why || drag.refusalShown === stageId) return;
    drag.refusalShown = stageId;
    showBoardRefusal(drag.id, stageId, [why]);
  }

  // Which columns would take this card, marked before the drag reaches them
  // rather than after the server refuses it. A backward-eligible column is
  // marked distinctly from an ordinary forward one -- see .drop-back -- so a
  // hover never looks like an ordinary move that happens to skip stages.
  function markDropTargets() {
    const board = document.getElementById('board');
    const drag = State.drag;
    if (!board || !drag) return;
    board.classList.add('dragging');
    board.querySelectorAll('.column').forEach((column) => {
      const stageId = column.dataset.stage;
      column.classList.remove('drop-ok', 'drop-back', 'drop-invalid', 'drop-source', 'drop-over');
      column.removeAttribute('title');
      if (stageId === drag.from) { column.classList.add('drop-source'); return; }
      if (dropAllowed(drag.id, stageId)) {
        if (isBackwardTarget(drag.from, stageId)) {
          column.classList.add('drop-back');
          column.title = 'Backward move: sends ' + drag.id + ' back to ' + stageLabel(stageId) + '.';
        } else {
          column.classList.add('drop-ok');
        }
        return;
      }
      column.classList.add('drop-invalid');
      const why = dropRefusal(drag.id, stageId);
      if (why) column.title = why;
    });
  }

  function clearDropTargets() {
    const board = document.getElementById('board');
    if (board) {
      board.classList.remove('dragging');
      board.querySelectorAll('.column').forEach((column) => {
        column.classList.remove('drop-ok', 'drop-back', 'drop-invalid', 'drop-source', 'drop-over');
        column.removeAttribute('title');
      });
    }
    document.querySelectorAll('.card.dragging').forEach((card) => card.classList.remove('dragging'));
    State.drag = null;
  }

  // The drop moves the card immediately so the gesture feels answered, then
  // puts it back exactly where it was if the gate refuses. The move itself is
  // onMoveClick -- the panel button's path -- and the refusal it reports is the
  // English from lib/gates/describe.js.
  async function onCardDrop(id, to, column) {
    const card = document.querySelector('.card[data-id="' + CSS.escape(id) + '"]');
    const home = card && card.parentNode ? { parent: card.parentNode, next: card.nextSibling } : null;
    const body = column.querySelector('.column-body');
    if (card && body) body.appendChild(card);
    const it = State.items.find((candidate) => candidate.id === id);
    const force = Boolean(it && isBackwardTarget(it.stage, to));
    const result = await onMoveClick(id, to, null, { force });
    if (result && !result.ok && card && home && card.parentNode !== home.parent) {
      home.parent.insertBefore(card, home.next);
    }
  }

  function wireDragAndDrop(view) {
    // Verdicts are fetched per item, so warm the cache as the pointer goes
    // down: by the time a column is reached the answer is usually already in.
    view.addEventListener('mousedown', (e) => {
      if (!State.live || !e.target.closest) return;
      const card = e.target.closest('.card[draggable="true"]');
      if (card) refreshTransitions(card.dataset.id);
    });

    view.addEventListener('dragstart', (e) => {
      const card = e.target.closest ? e.target.closest('.card[draggable="true"]') : null;
      if (!card || !State.live) return;
      const it = State.items.find((candidate) => candidate.id === card.dataset.id);
      if (!it) return;
      State.drag = { id: it.id, from: it.stage };
      if (e.dataTransfer) {
        e.dataTransfer.setData('text/plain', it.id);
        e.dataTransfer.effectAllowed = 'move';
      }
      card.classList.add('dragging');
      hideBoardRefusal();
      markDropTargets();
      // Re-ask even when cached: the answer may be older than the item.
      refreshTransitions(it.id);
    });

    view.addEventListener('dragover', (e) => {
      const drag = State.drag;
      if (!drag || !e.target.closest) return;
      const column = e.target.closest('.column');
      if (!column) return;
      // T-0079: while the verdict is still in flight the board does not know
      // whether this column would take the card -- and refusing the dragover
      // here is doubly wrong: it paints "Checking this gate…" on a move that
      // may be perfectly legal, and a refused dragover means the browser
      // fires no drop event at all, so a fast flick could never drop even
      // where the move is legal. Unknown is not a refusal: the column
      // neither dims nor highlights, the drop stays possible, and the real
      // verdict decides at the drop.
      if (!State.transitions[drag.id] && !State.transitionErrors[drag.id]) {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
        return;
      }
      if (!dropAllowed(drag.id, column.dataset.stage)) {
        // No preventDefault: the browser itself refuses the drop, so an
        // invalid column cannot even accept the card optimistically. The
        // refusal still says why (T-0063) -- the sentence travels with the
        // drag, not only in the column's tooltip.
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'none';
        showDragRefusal(drag, column.dataset.stage);
        return;
      }
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
      column.classList.add('drop-over');
    });

    view.addEventListener('dragleave', (e) => {
      const column = e.target.closest ? e.target.closest('.column') : null;
      if (column && !column.contains(e.relatedTarget)) column.classList.remove('drop-over');
    });

    view.addEventListener('drop', (e) => {
      const drag = State.drag;
      if (!drag || !e.target.closest) return;
      const column = e.target.closest('.column');
      if (!column) return;
      // Taken synchronously and for every outcome, accepted or refused: this
      // listener owns the drop, so the browser must never run its own.
      e.preventDefault();
      decideDrop(drag, column);
    });

    // T-0079: a drop can beat the lazy transitions fetch (dragstart fires the
    // request; a touch flick completes the drop before the answer lands).
    // The verdict is awaited before deciding, so what the board says at the
    // end of a drag is always a real answer -- a legal move completes, an
    // illegal one gets its actual reason. "Checking this gate…" is a status,
    // and a status was standing in for a refusal only when nobody had looked.
    async function decideDrop(drag, column) {
      const to = column.dataset.stage;
      if (!State.transitions[drag.id] && !State.transitionErrors[drag.id]) {
        await refreshTransitions(drag.id);
      }
      if (!dropAllowed(drag.id, to)) {
        // Some delivery paths can still produce a drop here (a programmatic
        // drag, a browser that fires drop anyway): refuse it with the same
        // sentence, not with silence.
        showDragRefusal(drag, to);
        return;
      }
      // A move the gates allowed should not leave a stale "cannot move"
      // notice on screen; if the server refuses it anyway, showMoveRefusal
      // raises its own notice with the fresher reason.
      hideBoardRefusal();
      clearDropTargets();
      onCardDrop(drag.id, to, column);
    }

    view.addEventListener('dragend', clearDropTargets);
  }

  // -- table row actions (P8-14) -------------------------------------------
  // The most scannable view could not change anything. Claim/release and a
  // move are added inline; a snapshot (State.live false) degrades to no
  // actions at all, same as everywhere else on the page, and a move never
  // offers a stage the server would refuse -- it reads the same
  // State.transitions cache and dropAllowed() the board's drag-and-drop
  // already uses, rather than inventing a second notion of "allowed".

  function rowActionsHtml(it) {
    if (!State.live) return '';
    // T-0058: claiming finished work is meaningless, so the Table view stops
    // offering it on a terminal item -- the same place Play and the move
    // picker already go quiet (actionFor, moveSelectHtml). Hidden rather
    // than refused: the offer itself is the defect, and a button whose only
    // possible outcome is an error toast is not a control, it is a trap. The
    // claim route on the server (lib/serve/) should refuse a terminal item
    // at the API too; that half is not this file's to fix.
    if (isTerminalItem(it)) {
      return it.can_release
        ? '<span class="row-actions"><button data-release-row="' + escapeHtml(it.id) + '" title="Release ownership of this item.">Release</button></span>'
        : '';
    }
    return '<span class="row-actions">' + (it.can_release
      ? '<button data-release-row="' + escapeHtml(it.id) + '" title="Release ownership of this item.">Release</button>'
      : '<button data-claim-row="' + escapeHtml(it.id) + '" title="Claims this item for you.">Claim</button>') + '</span>';
  }

  // The options for one row's move picker. Split out of moveSelectHtml so a
  // verdict landing later (refreshTransitions) can refresh just the options
  // of an already-rendered <select> without losing focus or scroll.
  function moveSelectOptionsHtml(it) {
    const transitions = State.transitions[it.id];
    const options = stageList(State.stages).filter((s) => s.id !== it.stage).map((s) => {
      const allowed = dropAllowed(it.id, s.id);
      const note = allowed ? '' : (transitions ? ' (not ready)' : ' (checking…)');
      return '<option value="' + escapeHtml(s.id) + '"' + (allowed ? '' : ' disabled') + '>' + escapeHtml(s.label) + escapeHtml(note) + '</option>';
    }).join('');
    return '<option value="">move to…</option>' + options;
  }

  function moveSelectHtml(it) {
    if (!State.live || isTerminalItem(it)) return '';
    return '<select class="row-move" data-move-row="' + escapeHtml(it.id) + '" aria-label="Move ' + escapeHtml(it.id) + ' to another stage." title="Move to another stage.">' + moveSelectOptionsHtml(it) + '</select>';
  }

  // Called once a verdict lands (refreshTransitions), so a row does not have
  // to wait for the next poll to stop showing every target as "checking…".
  function updateTableRowMove(id) {
    const select = document.querySelector('select.row-move[data-move-row="' + CSS.escape(id) + '"]');
    if (!select) return;
    const it = State.items.find((candidate) => candidate.id === id);
    if (!it) return;
    select.innerHTML = moveSelectOptionsHtml(it);
    select.value = '';
  }

  function renderTable(container) {
    const items = filteredItems();
    const cols = [
      ['id', 'ID'], ['title', 'Title'], ['type', 'Type'], ['phase', 'Phase'],
      ['priority', 'Priority'], ['stage', 'Stage'], ['flag', 'Flag'], ['owner', 'Owner'], ['updated', 'Updated'],
    ];
    const key = State.sort.key, dir = State.sort.dir;
    const sorted = [...items].sort((a, b) => {
      const av = a[key] == null ? '' : a[key], bv = b[key] == null ? '' : b[key];
      const cmp = String(av).localeCompare(String(bv));
      return dir === 'asc' ? cmp : -cmp;
    });
    // T-0027: the table itself may be wider than a phone -- the nowrap
    // action cells and the sorted-header labels need their width -- but the
    // PAGE may not. The table scrolls inside its own container now, so at
    // 390px the page stays exactly one viewport wide and the overflow
    // belongs to the table, where it is scrollable and visible, not to the
    // document, where it is neither.
    container.innerHTML = '<div class="table-scroll"><table class="gw-table"><thead><tr>' +
      cols.map(([k, label]) => '<th data-key="' + k + '" class="' + (k === 'title' ? 'cell-title' : '') + (k === key ? ' sorted' : '') + '">' + label + (k === key ? (dir === 'asc' ? ' ↑' : ' ↓') : '') + '</th>').join('') +
      (State.live ? '<th>Actions</th>' : '') +
      '</tr></thead><tbody>' +
      sorted.map((it) => '<tr data-id="' + escapeHtml(it.id) + '">' +
        // T-0017: a real button on the id gives the row a keyboard-activatable
        // control without turning the <tr> itself into one (that would erase
        // the table semantics screen readers navigate by). The click bubbles
        // to the row and opens the drawer exactly as a mouse click on the row
        // already did -- there is no second open path.
        '<td class="id"><button class="id-open" aria-label="Open item ' + escapeHtml(it.id) + ': ' + escapeHtml(it.title) + '">' + escapeHtml(it.id) + '</button></td>' +
        '<td class="cell-title">' + escapeHtml(it.title) + '</td>' +
        '<td' + termTitle('type', it.type) + '>' + escapeHtml(it.type) + '</td>' +
        '<td' + termTitle('phase', it.phase) + '>' + escapeHtml(it.phase) + '</td>' +
        '<td' + termTitle('priority', it.priority) + '>' + escapeHtml(it.priority) + '</td>' +
        '<td>' + escapeHtml(stageLabel(it.stage)) + '</td>' +
        '<td>' + (it.flag ? '<span class="tag flag-' + escapeHtml(it.flag) + '">' + escapeHtml(it.flag) + '</span>' : '') + '</td>' +
        '<td>' + escapeHtml(it.owner) + '</td>' +
        '<td>' + escapeHtml(fmtDate(it.updated)) + '</td>' +
        (State.live ? '<td class="row-actions-cell">' + rowActionsHtml(it) + moveSelectHtml(it) + '</td>' : '') +
        '</tr>').join('') +
      '</tbody></table></div>';
  }

  const STAGE_ROLES = ['initial', 'done', 'dropped', 'paused'];

  function roleSelect(id, current) {
    return '<select id="' + id + '" data-editor="role">' +
      '<option value="">(no role)</option>' +
      STAGE_ROLES.map((role) => '<option value="' + role + '"' + (role === current ? ' selected' : '') + '>' + role + '</option>').join('') +
      '</select>';
  }

  function depsSelect(id, current) {
    const pipeline = (State.stages.stages || []);
    const known = pipeline.some((stage) => stage.id === current);
    return '<select id="' + id + '" data-editor="deps_at_least">' +
      '<option value="">(no dependency rule)</option>' +
      pipeline.map((stage) => '<option value="' + escapeHtml(stage.id) + '"' + (stage.id === current ? ' selected' : '') + '>' +
        escapeHtml(stage.label || stage.id) + ' (' + escapeHtml(stage.id) + ')</option>').join('') +
      // A rule already pointing at something that is not in the pipeline must
      // stay visible rather than being silently reset to "none" by opening a
      // form -- the server refuses that value and the human needs to see why.
      (current && !known ? '<option value="' + escapeHtml(current) + '" selected>' + escapeHtml(current) + ' (not in the pipeline)</option>' : '') +
      '</select>';
  }

  // The gate builder for one stage. Only the keys lib/rules.js actually reads,
  // and deps_at_least is a picker of real stages rather than a text box that
  // lets someone type a stage that does not exist.
  // `n` is the stage's position in the rendered list, used only to mint the
  // element ids that tie each label to its control. Stage ids are the user's
  // own strings and may contain anything; a position cannot.
  function gateEditor(stage, n) {
    const requires = stage.requires || {};
    const unknown = Object.keys(requires).filter((key) => RULE_KEYS.indexOf(key) === -1);
    const id = (key) => 'ed-' + n + '-' + key;
    return '<div class="editor-grid">' +
      '<label for="' + id('label') + '">Label</label>' +
      '<input type="text" id="' + id('label') + '" data-editor="label" value="' + escapeHtml(stage.label || '') + '">' +
      '<label for="' + id('role') + '">Role</label>' + roleSelect(id('role'), stage.role || '') +
      '<label for="' + id('scope') + '">Scope filled in</label>' +
      '<input type="checkbox" id="' + id('scope') + '" data-editor="scope"' + (requires.scope ? ' checked' : '') + '>' +
      '<label for="' + id('owner') + '">Claimed by someone</label>' +
      '<input type="checkbox" id="' + id('owner') + '" data-editor="owner"' + (requires.owner ? ' checked' : '') + '>' +
      '<label for="' + id('children_done') + '">All direct child items finished</label>' +
      '<input type="checkbox" id="' + id('children_done') + '" data-editor="children_done"' + (requires.children_done ? ' checked' : '') + '>' +
      '<label for="' + id('evidence_min') + '">Minimum evidence</label>' +
      '<input type="number" min="0" step="1" id="' + id('evidence_min') + '" data-editor="evidence_min" value="' +
        escapeHtml(requires.evidence_min == null ? '' : requires.evidence_min) + '" placeholder="0 = no minimum">' +
      '<label for="' + id('evidence_match') + '">Evidence pattern</label>' +
      '<input type="text" id="' + id('evidence_match') + '" data-editor="evidence_match" value="' + escapeHtml(requires.evidence_match == null ? '' : requires.evidence_match) +
        '" placeholder="regular expression, e.g. ^https://github.com/.+/pull/\\d+">' +
      '<label for="' + id('deps_at_least') + '">Dependencies at least</label>' + depsSelect(id('deps_at_least'), requires.deps_at_least || '') +
      (unknown.length
        ? '<div class="editor-note">This gate also carries ' + escapeHtml(unknown.join(', ')) +
          ', which this form does not edit. Saving keeps ' + (unknown.length === 1 ? 'it' : 'them') + ' exactly as ' + (unknown.length === 1 ? 'it is' : 'they are') + '.</div>'
        : '') +
      '</div>' +
      '<div class="editor-actions">' +
      '<button class="primary" data-stage-save="' + escapeHtml(stage.id) + '">Save stage</button>' +
      '</div>';
  }

  function renderStages(container) {
    const cols = stageList(State.stages);
    const pipeline = State.stages.stages || [];
    const editable = adminMode() === 'editable';
    const body = cols.map((s, n) => {
      const req = s.requires ? JSON.stringify(s.requires, null, 2) : '(no machine rule — advanced manually)';
      const flags = [s.auto ? 'auto-eligible for the scheduler' : 'human-gated', terminalStageIds().has(s.id) ? 'terminal' : null].filter(Boolean).join(' · ');
      const gate = gateFor(s.id);
      const english = gate
        ? sentenceList(gate.sentences, 'gate-sentences')
        // Older snapshots were written before the descriptions were carried in
        // the payload. Say so rather than inventing sentences for them.
        : '<p class="gate-missing">This board was written without rule descriptions — run <code>gw open</code> again to refresh it. The machine rule below is all it carries.</p>';
      const index = pipeline.findIndex((stage) => stage.id === s.id);
      const inPipeline = index >= 0;
      const tools = editable
        ? '<span class="stage-tools">' +
          (inPipeline
            ? '<button data-stage-up="' + escapeHtml(s.id) + '"' + (index === 0 ? ' disabled' : '') + ' title="Move this stage earlier in the pipeline.">&uarr;</button>' +
              '<button data-stage-down="' + escapeHtml(s.id) + '"' + (index === pipeline.length - 1 ? ' disabled' : '') + ' title="Move this stage later in the pipeline.">&darr;</button>'
            : '<span class="meta">off-pipeline</span>') +
          '<button class="danger" data-stage-remove="' + escapeHtml(s.id) + '" title="Remove this stage from the pipeline.">remove</button>' +
          '</span>'
        : '';
      const editor = editable
        ? '<details class="stage-editor"><summary>edit this stage and its gate</summary>' +
          '<div data-stage-editor="' + escapeHtml(s.id) + '">' + gateEditor(s, n) +
          // The read-back is the server's own wording, re-fetched with the
          // next poll after a save. Never a locally composed preview: a second
          // copy of that wording would drift, and the board would describe a
          // rule it does not enforce.
          (gate ? '<div class="gate-readback"><h4>Reads back as</h4>' + sentenceList(gate.sentences) + '</div>' : '') +
          '<div class="admin-error" id="stage-error-' + escapeHtml(s.id) + '"></div>' +
          '</div></details>'
        : '';
      return '<div class="stage-rule"><div class="stage-head"><h3>' + escapeHtml(s.label) + ' <span class="meta mono">(' + escapeHtml(s.id) + ')</span></h3>' + tools + '</div>' +
        // Reordering and removing are driven from the header, which stays
        // visible whether or not the editor below is open -- so their
        // refusals need a box that is visible there too. A refusal written
        // inside a collapsed <details> is a refusal nobody reads.
        (editable ? '<div class="admin-error" id="stage-row-error-' + escapeHtml(s.id) + '"></div>' : '') +
        (s.exit ? '<p class="exit">' + escapeHtml(s.exit) + '</p>' : '') +
        english +
        (flags ? '<div class="flags">' + escapeHtml(flags) + '</div>' : '') +
        machineRule('<pre class="requires">' + escapeHtml(req) + '</pre>') +
        editor +
        '</div>';
    }).join('');

    const adder = editable
      ? '<div class="add-stage"><h3>Add a stage</h3>' +
        '<div class="editor-grid">' +
        '<label for="new-stage-id">Stage id</label><input type="text" id="new-stage-id" placeholder="lowercase id, e.g. reviewing">' +
        '<label for="new-stage-label">Label</label><input type="text" id="new-stage-label" placeholder="Reviewing">' +
        '<label for="new-stage-where">Where</label><select id="new-stage-where">' +
        '<option value="pipeline">in the pipeline (work flows through it)</option>' +
        '<option value="extra">off-pipeline (a side stage such as dropped)</option>' +
        '</select>' +
        '</div><div class="editor-actions"><button class="primary" id="add-stage-btn">Add stage</button></div>' +
        '<div class="admin-error" id="add-stage-error"></div></div>'
      : '';

    container.innerHTML = adminNotice('stages and gates') + body + adder;
    State.formDirty = false;
    if (editable) wireStagesEditors(container);
  }

  function editorValues(scope) {
    const values = {};
    scope.querySelectorAll('[data-editor]').forEach((el) => {
      values[el.dataset.editor] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return values;
  }

  function wireStagesEditors(container) {
    container.querySelectorAll('[data-stage-up], [data-stage-down]').forEach((btn) => {
      const up = btn.hasAttribute('data-stage-up');
      const id = up ? btn.dataset.stageUp : btn.dataset.stageDown;
      btn.addEventListener('click', () => {
        const doc = stagesDoc();
        doc.stages = movePipeline(doc.stages, id, up ? -1 : 1);
        saveStages(doc, 'stage-row-error-' + id);
      });
    });

    container.querySelectorAll('[data-stage-remove]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.stageRemove;
        // Removing a stage reshapes the pipeline and cannot be undone from the
        // board, so a misclick must never be enough. The confirmation names
        // the stage -- id and label, plus whatever is lost with it -- so the
        // human can tell WHICH stage they are deleting before it is gone.
        // confirm() is native, so it works on touch where there is no hover.
        const stage = stageList(State.stages).find((s) => s.id === id);
        const lost = [];
        if (stage && stage.requires) lost.push('its gate rules');
        if (terminalStageIds().has(id)) lost.push('its terminal role');
        const detail = lost.length ? ' Deleting it loses ' + lost.join(' and ') + '.' : '';
        const label = stage && stage.label ? stage.label : id;
        if (!window.confirm('Remove stage "' + label + '" (' + id + ') from the board?' + detail + ' This cannot be undone.')) return;
        const doc = stagesDoc();
        doc.stages = doc.stages.filter((stage) => stage.id !== id);
        doc.extra = doc.extra.filter((stage) => stage.id !== id);
        // A stage removed from the pipeline cannot stay in `terminal`: that
        // list may only name stages that exist, and leaving a dangling entry
        // would turn a clear refusal about items into a confusing one.
        if (Array.isArray(doc.terminal)) doc.terminal = doc.terminal.filter((entry) => entry !== id);
        saveStages(doc, 'stage-row-error-' + id);
      });
    });

    container.querySelectorAll('[data-stage-save]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.stageSave;
        const scope = container.querySelector('[data-stage-editor="' + CSS.escape(id) + '"]');
        if (!scope) return;
        const values = editorValues(scope);
        const problem = gateInputProblem(values);
        if (problem) { showAdminError('stage-error-' + id, problem); return; }
        const doc = stagesDoc();
        const apply = (list) => list.map((stage) => {
          if (stage.id !== id) return stage;
          const next = { ...stage };
          next.label = String(values.label || '').trim() || stage.label || stage.id;
          if (values.role) next.role = values.role; else delete next.role;
          const requires = buildRequires(values, stage.requires);
          if (requires) next.requires = requires; else delete next.requires;
          return next;
        });
        doc.stages = apply(doc.stages);
        doc.extra = apply(doc.extra);
        saveStages(doc, 'stage-error-' + id);
      });
    });

    const addBtn = container.querySelector('#add-stage-btn');
    if (addBtn) addBtn.addEventListener('click', () => {
      const id = String(container.querySelector('#new-stage-id').value || '').trim();
      const label = String(container.querySelector('#new-stage-label').value || '').trim();
      const where = container.querySelector('#new-stage-where').value;
      if (!id) { showAdminError('add-stage-error', 'give the new stage an id.'); return; }
      const doc = stagesDoc();
      const stage = { id, label: label || id };
      if (where === 'extra') doc.extra = doc.extra.concat([stage]);
      else doc.stages = doc.stages.concat([stage]);
      saveStages(doc, 'add-stage-error');
    });
  }

  // -- settings ------------------------------------------------------------

  ];

  function configValue(key) {
    return String(key).split('.').reduce((node, part) => (node == null ? undefined : node[part]), State.config);
  }

  // The value as the form holds it: a string for everything except booleans,
  // so "changed" is a string comparison and an untouched field is never sent.
  function settingFormValue(setting) {
    const value = configValue(setting.key);
    if (setting.type === 'boolean') return Boolean(value);
    if (setting.type === 'list') return Array.isArray(value) ? value.join(', ') : (value == null ? '' : String(value));
    return value == null ? '' : String(value);
  }

  function settingChoices(setting) {
    if (setting.choices) return setting.choices.slice();
    if (!setting.choicesFrom) return null;
    const node = String(setting.choicesFrom).split('.').reduce((n, part) => (n == null ? undefined : n[part]), State.config);
    return node && typeof node === 'object' && !Array.isArray(node) ? Object.keys(node) : [];
  }

  // Setting keys are declared in this file, not typed by anyone, so they are
  // safe to use directly as element ids -- which is what lets the key itself
  // be the control's label.
  function settingControlId(setting) {
    return 'set-' + setting.key;
  }

  function settingControl(setting, editable) {
    const value = settingFormValue(setting);
    if (!editable) {
      const shown = setting.type === 'boolean' ? String(value) : (value === '' ? '(unset)' : value);
      return '<div class="setting-value">' + escapeHtml(shown) + '</div>';
    }
    const attr = ' id="' + settingControlId(setting) + '" data-setting="' + escapeHtml(setting.key) + '"';
    if (setting.type === 'boolean') {
      return '<label><input type="checkbox"' + attr + (value ? ' checked' : '') + '> enabled</label>';
    }
    if (setting.type === 'integer') {
      return '<input type="number" step="1"' + attr +
        (setting.min === undefined ? '' : ' min="' + setting.min + '"') +
        (setting.max === undefined ? '' : ' max="' + setting.max + '"') +
        ' value="' + escapeHtml(value) + '">' +
        (setting.min === undefined && setting.max === undefined ? ''
          : '<span class="setting-range">' + escapeHtml(setting.min + ' to ' + setting.max) + '</span>');
    }
    const choices = settingChoices(setting);
    if (choices) {
      const known = choices.indexOf(value) !== -1;
      return '<select' + attr + '>' +
        (known ? '' : '<option value="' + escapeHtml(value) + '" selected>' + escapeHtml(value === '' ? '(unset)' : value) + '</option>') +
        choices.map((choice) => '<option value="' + escapeHtml(choice) + '"' + (choice === value ? ' selected' : '') + '>' + escapeHtml(choice) + '</option>').join('') +
        '</select>' +
        (choices.length ? '' : '<span class="setting-range">nothing to choose from yet — runner.providers is empty</span>');
    }
    return '<input type="text"' + attr + ' value="' + escapeHtml(value) + '"' +
      (setting.type === 'list' ? ' placeholder="comma-separated"' : '') + '>';
  }

  function renderSettings(container) {
    const editable = adminMode() === 'editable';
    const rows = SETTINGS.map((setting) =>
      '<div class="setting-row">' +
      // A boolean's control carries its own inline label, so only the other
      // types point their key at the input.
      (editable && setting.type !== 'boolean'
        ? '<label class="setting-key" for="' + settingControlId(setting) + '">' + escapeHtml(setting.key) + '</label>'
        : '<div class="setting-key">' + escapeHtml(setting.key) + '</div>') +
      '<div class="setting-summary">' + escapeHtml(setting.summary) + '</div>' +
      (setting.danger ? '<div class="setting-danger">' + escapeHtml(setting.danger) + '</div>' : '') +
      settingControl(setting, editable) +
      '</div>').join('');
    container.innerHTML = '<div class="settings-panel">' + adminNotice('settings') + rows +
      (editable
        ? '<div class="settings-save"><button id="settings-save-btn">Save settings</button></div>' +
          '<div class="admin-error" id="settings-error"></div>'
        : '') +
      '</div>';
    State.formDirty = false;
    const saveBtn = container.querySelector('#settings-save-btn');
    if (saveBtn) saveBtn.addEventListener('click', () => onSaveSettings(container, saveBtn));
  }

  // Only changed keys are sent. /api/config validates through lib/settings.js
  // exactly as `gw config` does, so the refusal it returns is the wording the
  // CLI would have used and is shown unaltered.
  async function onSaveSettings(container, btn) {
    const settings = {};
    for (const setting of SETTINGS) {
      const el = container.querySelector('[data-setting="' + CSS.escape(setting.key) + '"]');
      if (!el) continue;
      const current = settingFormValue(setting);
      if (setting.type === 'boolean') {
        if (el.checked !== current) settings[setting.key] = el.checked;
      } else if (el.value !== current) {
        settings[setting.key] = el.value;
      }
    }
    if (!Object.keys(settings).length) { showAdminError('settings-error', 'nothing changed.'); return; }
    if (Inflight.has('settings')) return;
    Inflight.add('settings');
    btn.disabled = true;
    showAdminError('settings-error', '');
    const result = await apiWrite('/api/config', { settings });
    Inflight.delete('settings');
    btn.disabled = false;
    if (result.ok) {
      State.formDirty = false;
      await refreshNow();
    } else {
      showAdminError('settings-error', (result.data && result.data.error) || 'request failed');
    }
  }

  function renderExport(container) {
    container.innerHTML = '<div class="export-panel"><p>Download this snapshot as JSON — items, events, stages, and config exactly as loaded.</p><button id="export-btn">Download JSON</button></div>';
    container.querySelector('#export-btn').addEventListener('click', () => {
      const payload = JSON.stringify({ items: State.items, events: State.events, stages: State.stages, config: State.config, generatedAt: State.generatedAt }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'gatewright-board.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  }

  function renderView() {
    const container = document.getElementById('gw-view');
    const empty = document.getElementById('gw-empty');
    // "No items yet" answers the views that are about items. It must not
    // answer the views that are about the board's own configuration: a board
    // with nothing on it is exactly when someone needs to set up their stages
    // and settings, and hiding those behind "add an item first" is how this
    // tool stayed configurable only by hand-editing JSON.
    const itemView = State.view === 'overview' || State.view === 'board' || State.view === 'table';
    // The filter bar (phase/type/stage/flag/search) and "+ new item"
    // filter and create ITEMS -- they control nothing on Stages & rules,
    // Settings, or Export (P8-17), so they render only on the views they
    // actually affect. itemView is exactly that set of views, and this must
    // run whether or not the empty-state screen below is about to take over.
    document.getElementById('gw-filters').classList.toggle('hidden', !itemView);
    if (State.items.length === 0 && itemView) {
      container.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    if (State.view === 'overview') renderOverview(container);
    else if (State.view === 'board') renderBoard(container);
    else if (State.view === 'table') renderTable(container);
    else if (State.view === 'stages') renderStages(container);
    else if (State.view === 'settings') renderSettings(container);
    else if (State.view === 'export') renderExport(container);
  }

  function openPanel(id) {
    const it = State.items.find((i) => i.id === id);
    if (!it) return;
    const overlay = document.getElementById('gw-overlay');
    // T-0017: a dialog that opens without moving focus leaves a keyboard user
    // on the very control they just activated, still inside a now-obscured
    // page. Focus moves into the drawer when it opens -- and only then: the
    // poll's re-render of an already-open panel must never steal focus back
    // from whoever is typing in it.
    const opening = !overlay.classList.contains('open');
    if (opening) State.panelReturnFocus = document.activeElement;
    State.activePanelId = id;
    State.creatingItem = false;
    if (!State.pendingEvidence[id]) State.pendingEvidence[id] = [];
    renderPanel(it);
    overlay.classList.add('open');
    if (opening) {
      const closeBtn = panelCloseButton();
      if (closeBtn) closeBtn.focus();
    }
    if (State.live) {
      refreshTransitions(id);
      const run = activeRunFor(id);
      if (run) refreshRunLog(id, run.run);
    }
  }

  // The drawer's close button is the focus target on open; it exists in both
  // the item panel and the create panel.
  function panelCloseButton() {
    return document.querySelector('#gw-panel #panel-close');
  }

  function closePanel() {
    State.activePanelId = null;
    State.creatingItem = false;
    State.panelBaseline = null;
    document.getElementById('gw-overlay').classList.remove('open');
    // Hiding the overlay alone leaves a full, focusable drawer in the DOM.
    // That made Escape and native Enter on Close appear to do nothing to
    // browser users and to assistive technology. A closed drawer is empty.
    document.getElementById('gw-panel').innerHTML = '';
    const returnFocus = State.panelReturnFocus;
    State.panelReturnFocus = null;
    // The control that opened the drawer may have been re-rendered away by
    // the poll in the meantime; only restore focus if it still exists.
    if (returnFocus && typeof returnFocus.focus === 'function' && document.contains(returnFocus)) returnFocus.focus();
  }

  function showPanelError(msg) {
    const panelId = State.creatingItem ? null : State.activePanelId;
    State.panelError = { panelId, message: String(msg) };
    const el = document.getElementById('panel-error');
    if (el) el.innerHTML = '<div class="refusal">' + escapeHtml(msg) + '<button class="close-btn" id="panel-error-dismiss" aria-label="Dismiss">&times;</button></div>';
    const dismiss = document.getElementById('panel-error-dismiss');
    if (dismiss) dismiss.addEventListener('click', () => {
      State.panelError = null;
      const current = document.getElementById('panel-error');
      if (current) current.innerHTML = '';
    });
  }

  function refreshTransitions(id) {
    // T-0079: a caller that arrives mid-flight (a drop beating the fetch that
    // dragstart started) has to wait on the SAME verdict, not be told "still
    // loading" -- the old early return left the awaiting drop with no way to
    // ever see the answer land.
    if (State.transitionLoading[id]) return State.transitionLoading[id];
    delete State.transitionErrors[id];
    const run = (async () => {
      try {
        const res = await fetch('/api/items/' + encodeURIComponent(id) + '/transitions');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        State.transitions[id] = await res.json();
      } catch (error) {
        State.transitionErrors[id] = error.message || 'request failed';
      } finally {
        delete State.transitionLoading[id];
        if (State.activePanelId === id) {
          const current = State.items.find((item) => item.id === id);
          // A half-typed panel is not redrawn from under its typist, even for
          // good news like a verdict landing -- same contract as the editors.
          if (current && !panelIsDirty()) renderPanel(current);
        }
        // A drag that started before the verdicts landed gets its columns marked
        // the moment they do, rather than staying uniformly invalid.
        if (State.drag && State.drag.id === id) markDropTargets();
        // Same idea for the table's move picker (P8-14): its options are
        // disabled until a verdict exists, so the moment one lands they are
        // refreshed in place rather than waiting for the next 2-second poll.
        if (State.view === 'table') updateTableRowMove(id);
      }
    })();
    State.transitionLoading[id] = run;
    return run;
  }

  async function refreshRunLog(id, run) {
    const key = id + ':' + run;
    if (State.runLogLoading[key]) return;
    State.runLogLoading[key] = true;
    delete State.runLogErrors[id];
    try {
      const res = await fetch('/api/runs/' + encodeURIComponent(run) + '/log?tail=200');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      State.runLogs[id] = data.log || '';
    } catch (error) {
      State.runLogErrors[id] = error.message || 'request failed';
    } finally {
      State.runLogLoading[key] = false;
      if (State.activePanelId === id) {
        const current = State.items.find((item) => item.id === id);
        if (current && !panelIsDirty()) renderPanel(current);
      }
    }
  }

  // The item panel's editable controls, read as { key: value }. A field input
  // is keyed by its data-field, the note and evidence boxes by their id.
  function capturePanelBaseline() {
    const panel = document.getElementById('gw-panel');
    const values = {};
    panel.querySelectorAll('input[data-field], #note-input, #evidence-input').forEach((el) => {
      values[el.dataset.field || el.id] = el.value;
    });
    return values;
  }

  // Whether two baseline snapshots disagree on any control. A missing key and
  // an empty string count as the same value: a control that only exists in one
  // snapshot (the evidence box is live-only) is not by itself a difference.
  function valuesDiverge(base, now) {
    const keys = new Set(Object.keys(now).concat(Object.keys(base)));
    for (const key of keys) {
      if ((now[key] || '') !== (base[key] || '')) return true;
    }
    return false;
  }

  // "Dirty" for the item panel means: some editable control in it now holds a
  // different value than the render that created it put there. Typing makes
  // the panel dirty; undoing the typing makes it clean again; every
  // renderPanel re-baselines. The poll consults this for the same reason it
  // consults State.formDirty for the editors -- redrawing over a half-typed
  // note throws the words away -- but a comparison, unlike a sticky flag,
  // also unlatches itself the moment the typing is undone or saved.
  function panelIsDirty() {
    if (State.panelBaseline == null) return false;
    return valuesDiverge(State.panelBaseline, capturePanelBaseline());
  }

  // T-0057: the panel spelled fields the way items.jsonl does -- "deps",
  // "created_by" -- while every other surface on the board spells them the
  // way a reader reads. One table answers for both of the panel's field
  // lists; a field missing here falls back to its key, as before.
  const FIELD_LABELS = {
    title: 'Title', scope: 'Scope', priority: 'Priority', type: 'Type', phase: 'Phase',
    deps: 'Dependencies', refs: 'Refs', id: 'ID', stage: 'Stage', flag: 'Flag',
    owner: 'Owner', parent: 'Parent', created_by: 'Created by', gh: 'GitHub',
    created: 'Created', updated: 'Updated',
  };
  function fieldLabel(f) {
    return Object.prototype.hasOwnProperty.call(FIELD_LABELS, f) ? FIELD_LABELS[f] : f;
  }

  function renderPanel(it) {
    const panel = document.getElementById('gw-panel');
    // A re-render replaces every element in the drawer, which would drop the
    // keyboard focus on the floor: someone parked on the close button lands
    // on <body> the moment the poll (or a transition verdict) redraws the
    // panel under them. Remember WHICH control had focus -- by id, or by
    // data-field for the editable item fields -- and hand focus to its
    // replacement. Elements with neither lose focus, as before.
    const active = panel.contains(document.activeElement) ? document.activeElement : null;
    const focusSel = active
      ? (active.id ? '#' + CSS.escape(active.id)
        : (active.dataset && active.dataset.field ? 'input[data-field="' + CSS.escape(active.dataset.field) + '"]' : null))
      : null;
    const itemEvents = State.events.filter((e) => e.item === it.id).slice().sort((a, b) => String(a.ts).localeCompare(String(b.ts)));

    const pendingEv = State.pendingEvidence[it.id] || [];
    const allEvidence = [...(it.evidence || []), ...pendingEv];
    const target = nextStageId(State.stages, it.stage);

    const banner = State.live
      ? ''
      : '<div class="readonly-banner">read-only snapshot' +
        (target ? ' &middot; to advance this item run: <code>gw move ' + escapeHtml(it.id) + ' ' + escapeHtml(target) + ' --evidence &lt;commit&gt;</code>' : '') +
        '</div>';
    const panelError = State.panelError && State.panelError.panelId === it.id
      ? '<div class="refusal">' + escapeHtml(State.panelError.message) + '<button class="close-btn" id="panel-error-dismiss" aria-label="Dismiss">&times;</button></div>'
      : '';

    const dispatched = isDispatched(it.id);
    const panelAction = actionFor(it);
    var panelButton = '';
    if (panelAction.kind === 'running') {
      panelButton = '<button id="panel-stoprun" title="Stops the agent process for this run.">Stop run</button>';
    } else if (panelAction.kind === 'queued') {
      panelButton = '<button id="panel-stop" title="Cancels the queued dispatch before it starts.">Cancel dispatch</button>';
    } else if (panelAction.kind === 'idle') {
      panelButton = '<button id="panel-play"' + (schedulerIsOff() ? ' class="secondary"' : '') +
        ' title="' + escapeHtml(playTitle()) + '">' + escapeHtml(playLabel()) + '</button>';
    }
    const playStop = State.live && panelButton
      ? '<div class="panel-actions">' + panelButton + '</div>'
      : '';

    const activeRun = activeRunFor(it.id);
    const logHtml = activeRun
      ? '<h3>Run log (' + escapeHtml(activeRun.run) + ')</h3><pre class="run-log">' + escapeHtml(
          State.runLogs[it.id] != null ? (State.runLogs[it.id] || '(log is empty)')
            : State.runLogErrors[it.id] ? 'unable to load log: ' + State.runLogErrors[it.id]
              : 'loading…'
        ) + '</pre>'
      : '';

    const triageHtml = (State.live && it.flag === 'needs-triage')
      ? '<div class="panel-actions triage"><button id="panel-triage-approve" title="Clears the hold and makes this item schedulable again.">Approve</button> ' +
        '<button id="panel-triage-drop" title="Moves this item to the dropped stage.">Drop</button></div>'
      : '';

    // `can_release` is calculated by /api/state with lib/owner.js's sameOwner
    // rule. Never offer the control to a non-owner -- release now correctly
    // refuses them server-side, and a button guaranteed to fail is a trap.
    const releaseHtml = (State.live && it.can_release)
      ? '<div class="panel-actions"><button id="panel-release" title="Release ownership of this item.">Release</button></div>'
      : '';

    const resumeHtml = (State.live && it.flag === 'paused')
      ? '<div class="panel-actions"><button id="panel-resume" title="Restores the item and dispatches it again.">Resume</button></div>'
      : '';

    // A disabled button is a refusal, and a refusal has to say what it wants.
    // `note` is the one-line reason the button is off; `unmet` is the gate in
    // the English lib/gates/describe.js produces, shown next to the button
    // rather than hidden in a tooltip; `machine` keeps the literal lib/rules.js
    // failure lines -- which carry the exact command to run -- one disclosure
    // away, and in the tooltip as before.
    const stageButtonsHtml = stageList(State.stages).map((s) => {
      if (s.id === it.stage) return '';
      const transitions = State.transitions[it.id];
      const transition = transitions && transitions[s.id];
      let note = '';
      let heading = '';
      let unmet = [];
      let machine = [];
      let disabled = true;
      // A backward move is force:true by definition (stageOrderMessage in
      // lib/rules.js) -- P8-18 offers exactly that one forced case, so it is
      // decided before the generic force branch below claims it as a skip.
      const backward = State.live && isBackwardTarget(it.stage, s.id);
      if (!State.live) {
        note = 'read-only snapshot';
        // No server to ask what this item fails, so say what the gate checks.
        // That is a different statement and it is labelled as one.
        const gate = gateFor(s.id);
        if (gate) { heading = 'This gate checks:'; unmet = gate.sentences; }
      } else if (!transitions) {
        note = State.transitionErrors[it.id]
          ? 'unable to check transition rules'
          : 'checking transition rules…';
      } else if (!transition) {
        // T-0018: the button is off, and the reason is a fact about the board
        // -- it never skips stages -- not an instruction to run a command the
        // browser cannot run. The same holds for the forced-skip branches
        // below: where the board does not offer an action, it says so instead
        // of pointing at the CLI.
        note = 'Not reachable from here — the board does not skip stages; forcing a jump is a CLI decision.';
      } else if (transition.force && transition.ok && backward) {
        disabled = false;
        note = 'Backward move — this skips the gates ahead of ' + s.label + '.';
      } else if (transition.force && transition.ok) {
        note = 'The board does not skip gates — a forced skip is a CLI decision.';
      } else if (!transition.ok) {
        if (transition.force && !backward) note = 'and a jump across stages is never offered here';
        else if (backward) note = 'Backward move — not met yet.';
        heading = 'Not met yet:';
        machine = transition.failures || [];
        unmet = (transition.reasons && transition.reasons.length) ? transition.reasons : machine;
      } else {
        disabled = false;
      }
      const tooltip = (machine.length ? machine.join('; ') : note);
      const label = (backward && !disabled ? '← ' : '') + s.label;
      return '<div class="stage-button-wrap">' +
        '<button data-move="' + escapeHtml(s.id) + '"' + (disabled ? ' disabled' : '') +
          (backward ? ' class="move-back"' : '') +
          (tooltip ? ' title="' + escapeHtml(tooltip) + '"' : '') + '>' + escapeHtml(label) + '</button>' +
        (note ? '<div class="stage-reason' + (backward ? ' stage-reason-back' : '') + '">' + escapeHtml(note) + '</div>' : '') +
        (unmet.length ? '<div class="stage-reason"><span class="reason-head">' + escapeHtml(heading) + '</span>' + sentenceList(unmet) + claimActionHtml(it, machine) + '</div>' : '') +
        (machine.length ? machineRule(sentenceList(machine)) : '') +
        '<div class="stage-refusal" id="move-fail-' + escapeHtml(s.id) + '"></div>' +
        '</div>';
    }).join('');

    const evidenceHtml = allEvidence.length
      ? allEvidence.map((e, idx) => {
          // T-0062: render the entry's text, never the entry itself, and put
          // the gate it paid for next to it -- that attribution is why the
          // shape grew a stage field in the first place.
          const gate = evidenceStage(e)
            ? ' <span class="tag evidence-gate" title="Evidence supplied for the move to ' + escapeHtml(stageLabel(evidenceStage(e))) + ' (' + escapeHtml(evidenceStage(e)) + ')">'
              + escapeHtml(stageLabel(evidenceStage(e))) + '</span>'
            : '';
          return '<li class="evidence-chip">' + escapeHtml(evidenceText(e)) + gate +
            (idx >= (it.evidence || []).length ? ' <span class="meta">(pending &middot; sent with the next stage move)</span>' : '') + '</li>';
        }).join('')
      : '<li class="meta">none</li>';
    const evidenceEditor = State.live
      ? '<div class="evidence-add"><label class="sr-only" for="evidence-input">Add evidence</label><input type="text" id="evidence-input" name="evidence" placeholder="commit SHA, test path, PR/CI URL"><button id="evidence-add-btn">add evidence</button></div>'
      : '';

    const notesEditor = State.live
      ? '<div class="note-add"><label class="sr-only" for="note-input">Add a note</label><textarea id="note-input" name="note" rows="2" placeholder="append a note"></textarea><button id="note-add-btn">add note</button></div>'
      : '';

    const editableFields = ['title', 'scope', 'priority', 'type', 'phase', 'deps', 'refs'];
    const ghOwned = new Set(['title', 'scope', 'priority', 'type', 'phase']);
    const linked = Boolean(it.gh);
    const fieldRows = editableFields.map((f) => {
      const raw = it[f];
      const value = Array.isArray(raw) ? raw.join(', ') : (raw == null ? '' : raw);
      // phase, priority and type hold codes; the glossary says what this
      // item's code means, right where the item shows it.
      const glossed = termTitle(GLOSSARY_FIELDS.indexOf(f) === -1 ? null : f, value);
      if (!State.live) {
        return '<dt>' + fieldLabel(f) + '</dt><dd class="' + (f === 'deps' || f === 'refs' ? 'mono' : '') + '"' + glossed + '>' + escapeHtml(value === '' ? '(none)' : value) + '</dd>';
      }
      const lockedNote = linked && ghOwned.has(f)
        ? ' <span class="meta">(GitHub-owned on this linked item &mdash; edits are refused; edit the issue instead)</span>'
        : '';
      // T-0017: the input carries an id and name, and the dt's text becomes a
      // real <label for> -- before this the field had neither a programmatic
      // name nor an associated label, so a screen reader announced it as
      // "edit text" with nothing attached.
      return '<dt><label for="panel-field-' + f + '">' + fieldLabel(f) + '</label></dt><dd><input type="text" id="panel-field-' + f + '" name="' + f + '" data-field="' + f + '" value="' + escapeHtml(value) + '"' + (f === 'title' ? ' maxlength="120"' : '') + glossed + '>' + lockedNote +
        '<div class="field-refusal" id="field-fail-' + f + '"></div></dd>';
    }).join('');
    const saveBtn = State.live ? '<button id="save-fields-btn">save fields</button>' : '';

    const readonlyFields = ['id', 'stage', 'flag', 'owner', 'parent', 'created_by', 'gh', 'created', 'updated'];
    const readonlyDl = readonlyFields.map((f) => {
      let v = it[f];
      if (v && typeof v === 'object') v = JSON.stringify(v);
      else if (v == null || v === '') v = '(none)';
      return '<dt>' + fieldLabel(f) + '</dt><dd class="' + (f === 'id' ? 'mono' : '') + '">' + escapeHtml(v) + '</dd>';
    }).join('');

    const eventsHtml = itemEvents.length
      ? itemEvents.map((e) => '<div class="event-line"><time>' + escapeHtml(fmtDate(e.ts)) + '</time><span>' + escapeHtml(e.type) + (e.from ? ' ' + escapeHtml(e.from) + '→' + escapeHtml(e.to) : '') + ' by ' + escapeHtml(e.by) + '</span></div>').join('')
      : '<p class="meta">no events recorded</p>';

    panel.innerHTML = '<div class="panel-head"><h2>' + escapeHtml(it.id) + '</h2><button class="close-btn" id="panel-close" aria-label="Close">&times;</button></div>' +
      '<p>' + escapeHtml(it.title) + '</p>' +
      '<div id="panel-error">' + panelError + '</div>' +
      banner + triageHtml + resumeHtml + releaseHtml + playStop + logHtml +
      '<h3>Stage</h3><div class="stage-buttons">' + stageButtonsHtml + '</div>' +
      '<h3>Evidence</h3><ul class="evidence-list">' + evidenceHtml + '</ul>' + evidenceEditor +
      '<h3>Fields</h3><dl>' + fieldRows + '</dl>' + saveBtn +
      '<dl>' + readonlyDl + '</dl>' +
      '<h3>Notes</h3><pre class="notes-body">' + escapeHtml(it.notes || '(none)') + '</pre>' + notesEditor +
      '<h3>Event history</h3>' + eventsHtml;

    panel.querySelector('#panel-close').addEventListener('click', closePanel);
    wirePanelActions(it);
    if (focusSel) {
      const again = panel.querySelector(focusSel);
      if (again) again.focus();
    }
    // What the panel shows right now is the baseline the poll compares
    // against; anything the human types from here on makes it dirty.
    State.panelBaseline = capturePanelBaseline();
  }

  function wirePanelActions(it) {
    const panel = document.getElementById('gw-panel');

    const dismissError = panel.querySelector('#panel-error-dismiss');
    if (dismissError) dismissError.addEventListener('click', () => {
      State.panelError = null;
      const error = panel.querySelector('#panel-error');
      if (error) error.innerHTML = '';
    });

    panel.querySelectorAll('[data-move]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const force = isBackwardTarget(it.stage, btn.dataset.move);
        onMoveClick(it.id, btn.dataset.move, btn, { force });
      });
    });

    panel.querySelectorAll('[data-claim]').forEach((btn) => {
      btn.addEventListener('click', () => onClaimClick(btn.dataset.claim, btn));
    });

    const playBtn = panel.querySelector('#panel-play');
    if (playBtn) playBtn.addEventListener('click', () => onDispatchClick(it.id, 'dispatch', playBtn));
    const stopBtn = panel.querySelector('#panel-stop');
    if (stopBtn) stopBtn.addEventListener('click', () => onDispatchClick(it.id, 'cancel', stopBtn));
    const stopRunBtn = panel.querySelector('#panel-stoprun');
    if (stopRunBtn) stopRunBtn.addEventListener('click', () => onDispatchClick(it.id, 'stop', stopRunBtn));
    const resumeBtn = panel.querySelector('#panel-resume');
    if (resumeBtn) resumeBtn.addEventListener('click', () => onDispatchClick(it.id, 'resume', resumeBtn));
    const approveBtn = panel.querySelector('#panel-triage-approve');
    if (approveBtn) approveBtn.addEventListener('click', () => onTriageClick(it.id, 'approve', approveBtn));
    const dropBtn = panel.querySelector('#panel-triage-drop');
    if (dropBtn) dropBtn.addEventListener('click', () => onTriageClick(it.id, 'drop', dropBtn));
    const releaseBtn = panel.querySelector('#panel-release');
    if (releaseBtn) releaseBtn.addEventListener('click', () => onReleaseClick(it.id, releaseBtn));

    const evBtn = panel.querySelector('#evidence-add-btn');
    if (evBtn) evBtn.addEventListener('click', () => {
      const input = panel.querySelector('#evidence-input');
      const value = input.value.trim();
      if (!value) return;
      if (!State.pendingEvidence[it.id]) State.pendingEvidence[it.id] = [];
      State.pendingEvidence[it.id].push(value);
      const fresh = State.items.find((i) => i.id === it.id) || it;
      renderPanel(fresh);
    });

    const noteBtn = panel.querySelector('#note-add-btn');
    if (noteBtn) noteBtn.addEventListener('click', () => onNoteSubmit(it.id, noteBtn));

    const saveBtn = panel.querySelector('#save-fields-btn');
    if (saveBtn) saveBtn.addEventListener('click', () => onSaveFields(it, saveBtn));
  }

  // The one move path. The panel buttons call it, and a card dropped on a
  // column calls it too -- there is no second way to move an item, and so no
  // second set of rules for one of them to get wrong. `btn` is optional so a
  // drop can use it without inventing a button.
  async function onMoveClick(id, to, btn, opts) {
    const key = 'move:' + id + ':' + to;
    if (Inflight.has(key)) return { ok: false, skipped: true, data: null };
    Inflight.add(key);
    if (btn) btn.disabled = true;
    const evidence = State.pendingEvidence[id] || [];
    // `force` travels exactly as lib/commands/move.js's own --force flag does
    // -- a plain boolean the move route is expected to forward into
    // ctx.flags.force, same as `evidence` and `to` already are.
    const force = Boolean(opts && opts.force);
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/move', { to, evidence, ...(force ? { force: true } : {}) });
    Inflight.delete(key);
    if (result.ok) {
      State.pendingEvidence[id] = [];
      await refreshNow();
      return result;
    }
    if (btn) btn.disabled = false;
    await showMoveRefusal(id, to, result);
    return result;
  }

  // What a refusal should say, in the wording a human can act on. The server's
  // `failures` stay available -- they name the command to run -- but the
  // headline is the English gate description, re-fetched first so it describes
  // the refusal that just happened rather than a stale check.
  async function refusalText(id, to, result) {
    await refreshTransitions(id);
    const transitions = State.transitions[id];
    const transition = transitions && transitions[to];
    const machine = (result.data && result.data.failures && result.data.failures.length) ? result.data.failures : [];
    const reasons = (transition && transition.reasons && transition.reasons.length) ? transition.reasons : null;
    const fallback = machine.length ? machine : [(result.data && result.data.error) || 'request failed'];
    return { unmet: reasons || fallback, machine: machine };
  }

  async function showMoveRefusal(id, to, result) {
    const { unmet, machine } = await refusalText(id, to, result);
    const box = document.getElementById('move-fail-' + to);
    if (box) {
      box.innerHTML = '<div class="refusal">' + unmet.map((line) => escapeHtml(line)).join('<br>') + '</div>' +
        (machine.length ? machineRule(sentenceList(machine)) : '');
    }
    // A card that snapped back in silence is the failure mode this exists to
    // prevent, so the board says it too whenever the panel is not already
    // showing this item's refusal.
    if (State.activePanelId !== id) showBoardRefusal(id, to, unmet);
  }

  let refusalTimer = null;

  function hideBoardRefusal() {
    const notice = document.getElementById('gw-drop-refusal');
    if (notice) { notice.classList.add('hidden'); notice.innerHTML = ''; }
    if (refusalTimer) { window.clearTimeout(refusalTimer); refusalTimer = null; }
  }

  // A failure from an action with no panel open to report it in (a table row
  // action, e.g.) reuses the same corner notice a rejected drag already uses,
  // rather than writing to #panel-error and silently doing nothing because
  // that element does not exist outside the panel.
  function showActionNotice(title, message) {
    const notice = document.getElementById('gw-drop-refusal');
    if (!notice) return;
    notice.innerHTML = '<button class="close-btn" id="drop-refusal-close" aria-label="Dismiss">&times;</button>' +
      '<h4>' + escapeHtml(title) + '</h4><p>' + escapeHtml(message) + '</p>';
    notice.classList.remove('hidden');
    notice.querySelector('#drop-refusal-close').addEventListener('click', hideBoardRefusal);
    if (refusalTimer) window.clearTimeout(refusalTimer);
    refusalTimer = window.setTimeout(hideBoardRefusal, 8000);
  }

  // Every row-level action (table or panel) reports its failure wherever the
  // human can actually see it: the panel if this item's panel is open, the
  // corner notice otherwise.
  function reportActionError(id, message) {
    if (State.activePanelId === id) { showPanelError(message); return; }
    showActionNotice(id + ' failed', message);
  }

  function showBoardRefusal(id, to, unmet) {
    const notice = document.getElementById('gw-drop-refusal');
    if (!notice) return;
    notice.innerHTML = '<button class="close-btn" id="drop-refusal-close" aria-label="Dismiss">&times;</button>' +
      '<h4>' + escapeHtml(id) + ' cannot move to ' + escapeHtml(stageLabel(to)) + ' yet</h4>' +
      sentenceList(unmet);
    notice.classList.remove('hidden');
    notice.querySelector('#drop-refusal-close').addEventListener('click', hideBoardRefusal);
    if (refusalTimer) window.clearTimeout(refusalTimer);
    refusalTimer = window.setTimeout(hideBoardRefusal, 12000);
  }

  async function onDispatchClick(id, action, btn) {
    const key = action + ':' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/' + action, {});
    Inflight.delete(key);
    if (result.ok) {
      await refreshNow();
    } else {
      btn.disabled = false;
      showPanelError((result.data && result.data.error) || 'request failed');
    }
  }

  async function onTriageClick(id, action, btn) {
    const key = 'triage:' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/triage', { action });
    Inflight.delete(key);
    if (result.ok) {
      await refreshNow();
    } else {
      btn.disabled = false;
      showPanelError((result.data && result.data.error) || 'request failed');
    }

  // The inline answer to "needs an owner" (P8-15). Mirrors the existing
  // dispatch/cancel/resume/triage actions exactly: POST to a per-item action
  // path, then let the one poll loop pick up the result. `gw claim <id>` is
  // the CLI's own name for this, unchanged here.
  async function onClaimClick(id, btn) {
    const key = 'claim:' + id;
    if (Inflight.has(key)) return;
    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/claim', {});
    Inflight.delete(key);

      await refreshNow();

  // Release's counterpart (P8-14): a table row that claimed an item by
  // mistake, or is handing it back, does not need to open the panel to say

  async function onReleaseClick(id, btn) {
    const key = 'release:' + id;

    Inflight.add(key);
    btn.disabled = true;
    const result = await apiWrite('/api/items/' + encodeURIComponent(id) + '/release', {});
    Inflight.delete(key);
    if (result.ok) {
      await refreshNow();
    } else {
      btn.disabled = false;
